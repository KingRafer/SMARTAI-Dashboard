<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Sign In — Smart AI</title>
  <meta name="theme-color" content="#050a12"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <style>
    :root, [data-theme=dark] {
      --bg: #050a12;
      --bg-card: #0c1220;
      --border: rgba(148,163,184,.12);
      --cyan: #2dd4bf;
      --teal: #14b8a6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --green: #34d399;
      --glow: rgba(45,212,191,.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-image:
        radial-gradient(ellipse 70% 50% at 20% 10%, rgba(45,212,191,.12), transparent 55%),
        radial-gradient(ellipse 50% 40% at 90% 90%, rgba(99,102,241,.08), transparent 50%);
    }
    .auth-shell {
      width: 100%;
      max-width: 420px;
    }
    .logo {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -.03em;
      margin-bottom: 1.75rem;
      text-decoration: none;
      color: var(--text);
      display: block;
    }
    .logo span { color: var(--cyan); }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.75rem 1.6rem;
      box-shadow: 0 25px 50px -20px rgba(0,0,0,.55);
    }
    .card h1 {
      font-size: 1.35rem;
      font-weight: 750;
      margin-bottom: .3rem;
      text-align: center;
    }
    .card .sub {
      text-align: center;
      color: var(--text-muted);
      font-size: .875rem;
      margin-bottom: 1.35rem;
    }
    .demo-box {
      border: 1px dashed rgba(45,212,191,.4);
      background: rgba(45,212,191,.07);
      border-radius: 12px;
      padding: .85rem 1rem;
      margin-bottom: 1.25rem;
    }
    .demo-box .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .5rem .75rem;
      font-size: .82rem;
      color: var(--text-muted);
    }
    .demo-badge {
      font-size: .62rem;
      font-weight: 800;
      letter-spacing: .05em;
      background: linear-gradient(135deg, var(--cyan), var(--teal));
      color: #042f2e;
      padding: .18rem .45rem;
      border-radius: 5px;
    }
    .btn-demo {
      margin-left: auto;
      border: 1px solid rgba(45,212,191,.45);
      background: transparent;
      color: var(--cyan);
      font-weight: 700;
      font-size: .75rem;
      padding: .4rem .8rem;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-demo:hover { background: rgba(45,212,191,.1); }
    .creds {
      margin-top: .4rem;
      font-size: .72rem;
      font-family: ui-monospace, monospace;
      color: var(--text-dim);
    }
    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block;
      font-size: .75rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: .35rem;
    }
    .form-group input {
      width: 100%;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 11px;
      padding: .72rem .95rem;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      min-height: 46px;
    }
    .form-group input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px var(--glow);
    }
    .btn-primary {
      width: 100%;
      margin-top: .25rem;
      padding: .88rem;
      border: none;
      border-radius: 11px;
      font-weight: 700;
      font-size: .92rem;
      font-family: inherit;
      cursor: pointer;
      background: linear-gradient(135deg, var(--cyan), var(--teal));
      color: #042f2e;
      min-height: 48px;
    }
    .btn-primary:hover { filter: brightness(1.05); }
    .msg {
      display: none;
      margin-top: .85rem;
      padding: .65rem .9rem;
      border-radius: 9px;
      font-size: .82rem;
    }
    .msg.show { display: block; }
    .msg.error {
      background: rgba(248,113,113,.1);
      border: 1px solid rgba(248,113,113,.25);
      color: #f87171;
    }
    .msg.success {
      background: rgba(52,211,153,.1);
      border: 1px solid rgba(52,211,153,.25);
      color: var(--green);
    }
    .foot {
      text-align: center;
      margin-top: 1.25rem;
      font-size: .8rem;
      color: var(--text-dim);
    }
    .foot a { color: var(--cyan); font-weight: 600; text-decoration: none; }
    .theme-btn {
      position: fixed;
      top: 1rem;
      right: 1rem;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <button type="button" class="theme-btn" id="theme-toggle" aria-label="Tema" title="Ganti tema">◐</button>

  <div class="auth-shell">
    <a href="index.html" class="logo">SMART<span>AI</span></a>

    <div class="card">
      <h1>Sign In</h1>
      <p class="sub">Masuk ke dashboard member</p>

      <div class="demo-box">
        <div class="row">
          <span class="demo-badge">DEMO</span>
          <span>Akses dashboard tanpa daftar</span>
          <button type="button" class="btn-demo" id="btn-demo">Isi akun demo</button>
        </div>
        <div class="creds">demo@smartai.id &nbsp;/&nbsp; demo123</div>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email / Username</label>
          <input type="text" id="email" name="email" placeholder="demo@smartai.id" autocomplete="username" required/>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required/>
        </div>
        <button type="submit" class="btn-primary">Masuk ke Dashboard</button>
      </form>

      <div id="msg" class="msg"></div>

      <p class="foot">
        Butuh akun baru? <a href="daftar.html">Registrasi</a>
      </p>
    </div>
  </div>

  <script>
  (function () {
    var html = document.documentElement;
    var themeBtn = document.getElementById('theme-toggle');
    try {
      var saved = localStorage.getItem('theme');
      if (saved) html.setAttribute('data-theme', saved);
    } catch (e) {}
    if (themeBtn) {
      themeBtn.addEventListener('click', function () {
        var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    }

    // Already logged in? go dashboard
    try {
      if (localStorage.getItem('smartai_logged_in') === '1') {
        location.replace('dashboard.html');
        return;
      }
    } catch (e) {}

    var form = document.getElementById('login-form');
    var emailEl = document.getElementById('email');
    var passEl = document.getElementById('password');
    var msg = document.getElementById('msg');
    var btnDemo = document.getElementById('btn-demo');

    if (btnDemo) {
      btnDemo.addEventListener('click', function () {
        emailEl.value = 'demo@smartai.id';
        passEl.value = 'demo123';
        btnDemo.textContent = 'Terisi ✓';
        setTimeout(function () { btnDemo.textContent = 'Isi akun demo'; }, 1200);
      });
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var email = (emailEl.value || '').trim().toLowerCase();
      var pass = passEl.value || '';

      if (email === 'demo@smartai.id' && pass === 'demo123') {
        try {
          localStorage.setItem('smartai_logged_in', '1');
          localStorage.setItem('smartai_user', email);
        } catch (err) {}
        msg.className = 'msg show success';
        msg.textContent = 'Login berhasil. Mengalihkan...';
        setTimeout(function () { location.href = 'dashboard.html'; }, 500);
      } else {
        msg.className = 'msg show error';
        msg.textContent = 'Email atau password salah. Gunakan akun demo.';
      }
    });
  })();
  </script>
</body>
</html>
