<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache"/>
<title>Acc Performance — Smart AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=20261118p">
<style>
.live-head{margin-bottom:1.25rem}
.live-head h2{font-size:1.35rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:linear-gradient(90deg,var(--cyan),#5eead4);-webkit-background-clip:text;background-clip:text;color:transparent}
.live-head p{color:var(--text-muted);font-size:.85rem;margin-top:.35rem}
.acc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.15rem}
@media(max-width:1100px){.acc-grid{grid-template-columns:1fr}}

.acc-card{
  background:var(--bg-card-solid);
  border-radius:18px;padding:1.3rem 1.25rem 1.15rem;
  border:1px solid var(--border);position:relative;overflow:hidden;
  animation:fadeUp .55s cubic-bezier(.22,1,.36,1) both;
  transition:transform .25s,box-shadow .25s
}
.acc-card:hover{transform:translateY(-3px)}
.acc-card.basic{border-color:rgba(45,212,191,.4);box-shadow:0 0 0 1px rgba(45,212,191,.1),0 16px 40px rgba(0,0,0,.2)}
.acc-card.gold{border-color:rgba(251,191,36,.45);box-shadow:0 0 0 1px rgba(251,191,36,.1),0 16px 40px rgba(0,0,0,.2)}
.acc-card.pro{border-color:rgba(167,139,250,.45);box-shadow:0 0 0 1px rgba(167,139,250,.1),0 16px 40px rgba(0,0,0,.2)}
[data-theme=light] .acc-card.basic{box-shadow:0 0 0 1px rgba(13,148,136,.12),0 12px 28px rgba(15,23,42,.06)}
[data-theme=light] .acc-card.gold{box-shadow:0 0 0 1px rgba(217,119,6,.12),0 12px 28px rgba(15,23,42,.06)}
[data-theme=light] .acc-card.pro{box-shadow:0 0 0 1px rgba(124,58,237,.12),0 12px 28px rgba(15,23,42,.06)}

.acc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem}
.acc-pkg{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.acc-pkg.basic{color:var(--cyan)}.acc-pkg.gold{color:var(--gold)}.acc-pkg.pro{color:var(--purple)}
.mt5-badge{font-size:.6rem;font-weight:700;letter-spacing:.04em;padding:.26rem .55rem;border-radius:999px;background:rgba(45,212,191,.12);color:var(--cyan);border:1px solid rgba(45,212,191,.28)}
.acc-id{font-size:1.2rem;font-weight:800;letter-spacing:.02em;margin-bottom:.85rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.acc-id .online{font-size:.72rem;font-weight:700;color:var(--green);display:inline-flex;align-items:center;gap:.3rem}
.acc-id .online i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;animation:pulseDot 1.8s infinite}
.acc-id .muted{font-size:.72rem;font-weight:600;color:var(--text-dim)}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}

.acc-metrics{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:.9rem}
.acc-metric{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:.65rem .8rem}
[data-theme=light] .acc-metric{background:rgba(15,23,42,.03)}
.acc-metric .ml{font-size:.62rem;color:var(--text-dim);font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin-bottom:.15rem}
.acc-metric .mv{font-size:1.02rem;font-weight:800}
.acc-metric .mv.up{color:var(--green)}.acc-metric .mv.down{color:var(--red)}

.daily-return-box{
  background:linear-gradient(135deg,rgba(45,212,191,.1),rgba(16,185,129,.04));
  border:1px solid rgba(45,212,191,.22);border-radius:14px;padding:.85rem 1rem;margin-bottom:1rem;text-align:center
}
.acc-card.gold .daily-return-box{background:linear-gradient(135deg,rgba(251,191,36,.1),rgba(245,158,11,.04));border-color:rgba(251,191,36,.25)}
.acc-card.pro .daily-return-box{background:linear-gradient(135deg,rgba(167,139,250,.1),rgba(139,92,246,.04));border-color:rgba(167,139,250,.25)}
[data-theme=light] .daily-return-box{background:linear-gradient(135deg,rgba(13,148,136,.08),rgba(13,148,136,.03))}
.dr-label{font-size:.65rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-dim)}
.dr-value{font-size:1.45rem;font-weight:800;margin:.2rem 0}
.dr-value.up{color:var(--green)}.dr-value.down{color:var(--red)}
.dr-hint{font-size:.68rem;color:var(--text-muted)}

.gauge-row{display:flex;align-items:center;gap:1rem;margin-bottom:.9rem}
.gauge-ring{flex-shrink:0}
.ring-svg{display:block}
.ring-bg{stroke:rgba(148,163,184,.15)}
[data-theme=light] .ring-bg{stroke:rgba(15,23,42,.1)}
.ring-fg{transition:stroke-dashoffset .8s ease}
.ring-text{font-size:12px;font-weight:800;font-family:Inter,system-ui,sans-serif}
.gauge-detail{flex:1;min-width:0}
.gd-title{font-size:.68rem;font-weight:700;color:var(--text-dim);margin-bottom:.4rem;letter-spacing:.02em}
.gd-line{font-size:.75rem;color:var(--text-muted);margin-bottom:.2rem;display:flex;justify-content:space-between;gap:.5rem}
.gd-line b{font-weight:700;color:var(--text)}
.gd-line b.up{color:var(--green)}.gd-line b.down{color:var(--red)}

.acc-bar{margin-bottom:.75rem}
.acc-bar-track{height:4px;background:rgba(148,163,184,.12);border-radius:999px;overflow:hidden}
[data-theme=light] .acc-bar-track{background:rgba(15,23,42,.08)}
.acc-bar-fill{height:100%;border-radius:999px;transition:width .7s ease}
.acc-bar-fill.basic{background:linear-gradient(90deg,#2dd4bf,#5eead4)}
.acc-bar-fill.gold{background:linear-gradient(90deg,#fbbf24,#fcd34d)}
.acc-bar-fill.pro{background:linear-gradient(90deg,#a78bfa,#c4b5fd)}
.acc-foot{font-size:.68rem;color:var(--text-dim)}

.spark-wrap{margin-bottom:.85rem;height:48px}
.spark-svg{width:100%;height:48px;display:block}

.master-perf{margin-top:1.5rem;background:var(--bg-card-solid);border:1px solid var(--border);border-radius:18px;padding:1.25rem}
.master-perf-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1rem}
.master-perf-head h3{font-size:1.05rem;font-weight:800;margin:0}
.cal-tabs{display:flex;flex-wrap:wrap;gap:.4rem}
.cal-tabs button{border:1px solid var(--border);background:transparent;color:var(--text-muted);font-size:.72rem;font-weight:700;padding:.35rem .65rem;border-radius:999px;cursor:pointer;font-family:inherit}
.cal-tabs button.active{border-color:var(--cyan);color:var(--cyan);background:rgba(45,212,191,.1)}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:.85rem}
.cal-nav button{border:1px solid var(--border);background:transparent;color:var(--text);width:36px;height:36px;border-radius:10px;cursor:pointer}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.35rem}
.cal-cell{min-height:64px;border:1px solid var(--border);border-radius:10px;padding:.35rem;font-size:.7rem;background:rgba(255,255,255,.02)}
[data-theme=light] .cal-cell{background:rgba(15,23,42,.02)}
.cal-cell .d{color:var(--text-dim);font-weight:600}
.cal-cell .p{font-weight:800;margin-top:.25rem}
.cal-cell .p.pos{color:var(--green)}.cal-cell .p.neg{color:var(--red)}
.cal-foot{font-size:.75rem;color:var(--text-muted);margin-top:.75rem}
.perf-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.75rem;padding:3rem;color:var(--text-muted)}
.spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--cyan);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<script src="js/auth.js?v=20261118p"></script>
<script src="js/app.js?v=20261118p"></script>
<script src="js/mt5-api.js?v=20261118p"></script>
<script>
if (typeof getUser === 'function' && !getUser()) {
  if (typeof ensureDemoAccount === 'function') ensureDemoAccount();
  if (typeof setUser === 'function') setUser({ nama: 'Demo Member', email: 'demo@smartai.id', hp: '081234567890', referral: 'SMARTAI-REF', avatar: null });
}
if (renderShell('performance')) {
  var packageNames = { ACC01: 'SMART BASIC', ACC02: 'SMART GOLD', ACC03: 'SMART PRO' };
  var accentClass = { ACC01: 'basic', ACC02: 'gold', ACC03: 'pro' };
  var accentColor = { basic: '#2dd4bf', gold: '#fbbf24', pro: '#a78bfa' };
  var calState = { year: new Date().getFullYear(), month: new Date().getMonth() + 1, account: 'ALL' };

  function fmtPct(n) {
    if (n == null || !Number.isFinite(n)) return '\u2014';
    return (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
  }
  function fmtMoney(n, forceSign) {
    if (n == null || !Number.isFinite(n)) return '\u2014';
    var abs = Math.abs(n);
    var s = abs >= 1000000 ? (abs / 1000000).toFixed(2).replace(/\.00$/, '') + 'M'
      : abs.toLocaleString('en-US', { maximumFractionDigits: 2 });
    if (forceSign || n > 0) return (n >= 0 ? '+' : '-') + '$' + s;
    if (n < 0) return '-$' + s;
    return '$' + s;
  }
  function formatTime(iso) {
    if (!iso) return '\u2014';
    try {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return String(iso);
      return d.toLocaleString('id-ID', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        timeZone: 'Asia/Jakarta'
      }) + ' WIB';
    } catch (e) { return String(iso); }
  }

  function ringSVG(pct, cls) {
    var r = 36, c = 2 * Math.PI * r;
    var clamped = Math.max(0, Math.min(Math.abs(pct), 100));
    var offset = c - (clamped / 100) * c;
    var stroke = accentColor[cls] || '#2dd4bf';
    if (pct < 0) stroke = '#f87171';
    return '<svg class="ring-svg" viewBox="0 0 88 88" width="88" height="88">' +
      '<circle class="ring-bg" cx="44" cy="44" r="' + r + '" fill="none" stroke-width="7"/>' +
      '<circle class="ring-fg" cx="44" cy="44" r="' + r + '" fill="none" stroke-width="7"' +
      ' stroke="' + stroke + '" stroke-linecap="round"' +
      ' stroke-dasharray="' + c.toFixed(2) + '" stroke-dashoffset="' + offset.toFixed(2) + '"' +
      ' transform="rotate(-90 44 44)"/>' +
      '<text x="44" y="48" text-anchor="middle" class="ring-text" fill="' + stroke + '">' + fmtPct(pct) + '</text>' +
      '</svg>';
  }

  /* Mini sparkline from recent history profits */
  function sparkSVG(history, cls) {
    var vals = (history || []).map(function(h){ return Number(h.profit) || 0; }).slice(-14);
    if (vals.length < 2) vals = [0, 2, 1, 4, 3, 5, 4, 6, 5, 7];
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var range = max - min || 1;
    var w = 280, h = 48, pad = 4;
    var pts = vals.map(function(v, i) {
      var x = pad + (i / (vals.length - 1)) * (w - pad * 2);
      var y = h - pad - ((v - min) / range) * (h - pad * 2);
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    var stroke = accentColor[cls] || '#2dd4bf';
    return '<svg class="spark-svg" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
      '<polyline fill="none" stroke="' + stroke + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="' + pts + '"/>' +
      '</svg>';
  }

  function renderAccount(a, index, histMap) {
    var id = a.account_id;
    var cls = accentClass[id] || ['basic','gold','pro'][index] || 'basic';
    var online = String(a.status || '').toUpperCase() === 'ONLINE';
    var statusLabel = String(a.status || 'WAITING').toUpperCase();
    var equity = Number(a.equity) || 0;
    var daily = Number(a.daily_profit) || 0;
    var dailyReturn = equity > 0 ? (daily / equity * 100) : 0;
    var dd = Number(a.daily_dd); if (!Number.isFinite(dd)) dd = 0;
    var stamp = formatTime(a.updated_at);
    var hist = (histMap && histMap[id]) || [];

    return '<article class="acc-card ' + cls + '">' +
      '<div class="acc-top"><span class="acc-pkg ' + cls + '">' + (packageNames[id] || a.name || id) + '</span>' +
        '<span class="mt5-badge">MT5 LIVE</span></div>' +
      '<div class="acc-id">' + SmartAIMT5.escape(id) +
        ' <span class="' + (online ? 'online' : 'muted') + '">' +
        (online ? '<i></i> ' : '') + statusLabel + '</span></div>' +
      '<div class="acc-metrics">' +
        '<div class="acc-metric"><div class="ml">Deposit Awal</div><div class="mv">' + SmartAIMT5.formatUSD(a.deposit_awal) + '</div></div>' +
        '<div class="acc-metric"><div class="ml">Equity Saat Ini</div><div class="mv">' + SmartAIMT5.formatUSD(a.equity) + '</div></div>' +
        '<div class="acc-metric"><div class="ml">Daily Profit</div><div class="mv ' + (daily >= 0 ? 'up' : 'down') + '">' + fmtMoney(daily, true) + '</div></div>' +
        '<div class="acc-metric"><div class="ml">Total Penarikan</div><div class="mv">' + SmartAIMT5.formatUSD(a.total_penarikan) + '</div></div>' +
      '</div>' +
      '<div class="daily-return-box">' +
        '<div class="dr-label">Daily Return</div>' +
        '<div class="dr-value ' + (dailyReturn >= 0 ? 'up' : 'down') + '">' + fmtPct(dailyReturn) + '</div>' +
        '<div class="dr-hint">Daily Profit \u00f7 Equity Saat Ini</div>' +
      '</div>' +
      '<div class="spark-wrap">' + sparkSVG(hist, cls) + '</div>' +
      '<div class="gauge-row">' +
        '<div class="gauge-ring">' + ringSVG(dailyReturn, cls) + '</div>' +
        '<div class="gauge-detail">' +
          '<div class="gd-title">Persentase terhadap Equity Saat Ini</div>' +
          '<div class="gd-line"><span>Daily Profit:</span> <b class="' + (daily >= 0 ? 'up' : 'down') + '">' + fmtMoney(daily, true) + '</b></div>' +
          '<div class="gd-line"><span>Equity Saat Ini:</span> <b>' + SmartAIMT5.formatUSD(a.equity) + '</b></div>' +
          '<div class="gd-line"><span>Daily Drawdown:</span> <b>' + dd.toFixed(2) + '%</b></div>' +
        '</div>' +
      '</div>' +
      '<div class="acc-bar"><div class="acc-bar-track">' +
        '<div class="acc-bar-fill ' + cls + '" style="width:' + Math.min(Math.abs(dailyReturn) * 4, 100).toFixed(1) + '%"></div>' +
      '</div></div>' +
      '<div class="acc-foot">Update: ' + stamp + '</div>' +
      '</article>';
  }

  function buildTabs() {
    var tabs = [{ id: 'ALL', label: 'Semua' }, { id: 'ACC01', label: 'Basic' }, { id: 'ACC02', label: 'Gold' }, { id: 'ACC03', label: 'Pro' }];
    return '<div class="cal-tabs" id="cal-tabs">' + tabs.map(function(t) {
      return '<button type="button" data-acc="' + t.id + '" class="' + (calState.account === t.id ? 'active' : '') + '">' + t.label + '</button>';
    }).join('') + '</div>';
  }

  function renderCalendar(history, year, month, account) {
    var daysInMonth = new Date(year, month, 0).getDate();
    var firstDow = new Date(year, month - 1, 1).getDay();
    var map = {};
    (history || []).forEach(function(h) {
      var d = String(h.date || h.day || '').slice(-2);
      if (d) map[parseInt(d, 10)] = h;
    });
    var monthNames = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    var html = '<div class="cal-nav"><button type="button" id="cal-prev">\u2039</button><strong>' + monthNames[month-1] + ' ' + year + '</strong><button type="button" id="cal-next">\u203A</button></div>';
    html += '<div class="cal-grid">';
    ['Min','Sen','Sel','Rab','Kam','Jum','Sab'].forEach(function(l){
      html += '<div style="text-align:center;font-size:.65rem;color:var(--text-dim);font-weight:700">' + l + '</div>';
    });
    for (var i = 0; i < firstDow; i++) html += '<div></div>';
    for (var day = 1; day <= daysInMonth; day++) {
      var row = map[day];
      var profit = row ? Number(row.profit || row.daily_profit || 0) : null;
      var cls = profit === null ? '' : (profit >= 0 ? 'pos' : 'neg');
      html += '<div class="cal-cell"><div class="d">' + day + '</div>' +
        (profit === null ? '' : '<div class="p ' + cls + '">' + (profit >= 0 ? '+' : '') + Math.round(profit) + '</div>') +
        '</div>';
    }
    html += '</div><p class="cal-foot">Filter: ' + account + ' \u00b7 Data dari API / demo</p>';
    return html;
  }

  function bindCal() {
    var prev = document.getElementById('cal-prev');
    var next = document.getElementById('cal-next');
    if (prev) prev.onclick = function() { calState.month--; if (calState.month < 1) { calState.month = 12; calState.year--; } loadPerformance(); };
    if (next) next.onclick = function() { calState.month++; if (calState.month > 12) { calState.month = 1; calState.year++; } loadPerformance(); };
    var tabs = document.getElementById('cal-tabs');
    if (tabs) tabs.querySelectorAll('button').forEach(function(btn) {
      btn.onclick = function() { calState.account = btn.getAttribute('data-acc'); loadPerformance(); };
    });
  }

  async function loadPerformance() {
    var root = document.getElementById('page-content');
    if (!root) return;
    root.innerHTML = '<div class="perf-loading"><div class="spin"></div><div>Memuat data akun\u2026</div></div>';
    try {
      var accounts = await SmartAIMT5.getAccounts(true);
      accounts = (accounts || []).slice().sort(function(a,b){ return String(a.account_id).localeCompare(String(b.account_id)); });
      var history = [];
      try { history = await SmartAIMT5.getDailyHistory(calState.year, calState.month, calState.account === 'ALL' ? null : calState.account); } catch (e) { history = []; }

      /* Group history by account for sparklines */
      var histMap = {};
      (history || []).forEach(function(h) {
        var aid = h.account_id || 'ALL';
        if (!histMap[aid]) histMap[aid] = [];
        histMap[aid].push(h);
      });

      var live = SmartAIMT5.isLive && SmartAIMT5.isLive();
      root.innerHTML =
        '<div class="live-head"><h2>Account Performance</h2><p>' +
          (live ? 'Mode <strong style="color:var(--green)">LIVE</strong> \u00b7 Data real-time dari API.' : 'Mode demo \u00b7 API live belum terjangkau.') +
        '</p></div>' +
        '<div class="acc-grid">' +
          (accounts.length ? accounts.map(function(a,i){ return renderAccount(a, i, histMap); }).join('') : '<p>Tidak ada data akun.</p>') +
        '</div>' +
        '<div class="master-perf">' +
          '<div class="master-perf-head"><div><h3>Profit Calendar</h3>' +
            '<div class="base" style="font-size:.8rem;color:var(--text-muted)">' + (live ? 'Data live' : 'Demo') + ' \u00b7 filter per akun</div></div>' +
            buildTabs() +
          '</div>' +
          '<div id="cal-body">' + renderCalendar(history, calState.year, calState.month, calState.account) + '</div>' +
        '</div>';
      bindCal();
    } catch (error) {
      root.innerHTML = '<div class="live-head"><h2>Account Performance</h2><p>Gagal memuat data.</p></div><div class="master-perf"><p class="cal-foot">' + SmartAIMT5.escape(error && error.message ? error.message : String(error)) + '</p></div>';
    }
  }
  loadPerformance();
  setInterval(function(){ loadPerformance(); }, 45000);
}
</script>
</body>
</html>
