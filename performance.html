<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache"/>
<title>Acc Performance — Smart AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=20261116c">
<style>
.live-head{margin-bottom:1.25rem}
.live-head h2{
  font-size:1.35rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  background:linear-gradient(90deg,var(--cyan),#5eead4);-webkit-background-clip:text;background-clip:text;color:transparent
}
.live-head p{color:var(--text-muted);font-size:.85rem;margin-top:.35rem}

.acc-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1.15rem
}
@media(max-width:1100px){.acc-grid{grid-template-columns:1fr}}

.acc-card{
  background:var(--bg-card-solid);
  border-radius:18px;
  padding:1.25rem 1.2rem 1.15rem;
  border:1px solid var(--border);
  position:relative;
  overflow:hidden;
  animation:fadeUp .55s cubic-bezier(.22,1,.36,1) both
}
.acc-card.basic{border-color:rgba(45,212,191,.35);box-shadow:0 0 0 1px rgba(45,212,191,.08),0 16px 40px rgba(0,0,0,.25)}
.acc-card.gold{border-color:rgba(251,191,36,.4);box-shadow:0 0 0 1px rgba(251,191,36,.08),0 16px 40px rgba(0,0,0,.25)}
.acc-card.pro{border-color:rgba(167,139,250,.4);box-shadow:0 0 0 1px rgba(167,139,250,.08),0 16px 40px rgba(0,0,0,.25)}
.acc-card:nth-child(2){animation-delay:.08s}
.acc-card:nth-child(3){animation-delay:.16s}

.acc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.85rem}
.acc-pkg{
  font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase
}
.acc-pkg.basic{color:var(--cyan)}
.acc-pkg.gold{color:var(--gold)}
.acc-pkg.pro{color:var(--purple)}
.mt5-badge{
  font-size:.62rem;font-weight:700;letter-spacing:.04em;
  padding:.28rem .55rem;border-radius:999px;
  background:rgba(45,212,191,.12);color:var(--cyan);border:1px solid rgba(45,212,191,.25)
}
.acc-card.gold .mt5-badge{background:rgba(251,191,36,.12);color:var(--gold);border-color:rgba(251,191,36,.3)}
.acc-card.pro .mt5-badge{background:rgba(167,139,250,.12);color:var(--purple);border-color:rgba(167,139,250,.3)}

.acc-id{
  font-size:1.15rem;font-weight:800;letter-spacing:.02em;margin-bottom:1rem;
  display:flex;align-items:center;gap:.55rem;flex-wrap:wrap
}
.acc-id .online{
  font-size:.72rem;font-weight:700;color:var(--green);
  display:inline-flex;align-items:center;gap:.3rem
}
.acc-id .online::before{
  content:'';width:7px;height:7px;border-radius:50%;background:var(--green);
  box-shadow:0 0 8px var(--green);animation:pulse 2s ease-in-out infinite
}

.acc-metrics{
  display:grid;grid-template-columns:1fr 1fr;gap:.55rem;margin-bottom:.85rem
}
.acc-metric{
  background:rgba(255,255,255,.03);
  border:1px solid var(--border);
  border-radius:12px;
  padding:.7rem .8rem
}
[data-theme=light] .acc-metric{background:rgba(15,23,42,.03)}
.acc-metric .ml{font-size:.65rem;color:var(--text-dim);font-weight:500;margin-bottom:.25rem}
.acc-metric .mv{font-size:.95rem;font-weight:700;color:var(--text)}
.acc-metric .mv.up{color:var(--green)}
.acc-metric .mv.muted{color:var(--text-muted)}

.daily-box{
  background:rgba(45,212,191,.08);
  border:1px solid rgba(45,212,191,.2);
  border-radius:12px;
  padding:.75rem 1rem;
  margin-bottom:1rem
}
.acc-card.gold .daily-box{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.22)}
.acc-card.pro .daily-box{background:rgba(167,139,250,.08);border-color:rgba(167,139,250,.22)}
.daily-box .db-label{font-size:.68rem;color:var(--text-dim);font-weight:600;margin-bottom:.2rem}
.daily-box .db-val{font-size:1.25rem;font-weight:800;color:var(--green)}
.daily-box .db-sub{font-size:.68rem;color:var(--text-muted);margin-top:.15rem}

.acc-foot{
  display:flex;align-items:center;gap:1rem;margin-bottom:.75rem
}
.ring-wrap{position:relative;width:72px;height:72px;flex-shrink:0}
.ring-wrap svg{width:72px;height:72px;transform:rotate(-90deg)}
.ring-wrap .track{fill:none;stroke:rgba(255,255,255,.08);stroke-width:6}
.ring-wrap .bar{fill:none;stroke-width:6;stroke-linecap:round}
.acc-card.basic .ring-wrap .bar{stroke:var(--cyan)}
.acc-card.gold .ring-wrap .bar{stroke:var(--gold)}
.acc-card.pro .ring-wrap .bar{stroke:var(--purple)}
.ring-pct{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:.78rem;font-weight:800;color:var(--green)
}
.ring-detail{flex:1;font-size:.72rem;color:var(--text-muted);line-height:1.55}
.ring-detail strong{color:var(--text);font-weight:600}

.acc-update{
  font-size:.68rem;color:var(--text-dim);padding-top:.55rem;
  border-top:1px solid var(--border)
}
.progress-line{
  height:3px;border-radius:99px;background:rgba(255,255,255,.06);margin-top:.45rem;position:relative;overflow:hidden
}
.progress-line i{
  position:absolute;left:0;top:0;bottom:0;border-radius:99px;width:42%
}
.acc-card.basic .progress-line i{background:linear-gradient(90deg,transparent,var(--cyan))}
.acc-card.gold .progress-line i{background:linear-gradient(90deg,transparent,var(--gold))}
.acc-card.pro .progress-line i{background:linear-gradient(90deg,transparent,var(--purple))}
</style>
<script>try{var t=localStorage.getItem('smartai_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<script src="js/auth.js?v=20261116c"></script>
<script src="js/app.js?v=20261116c"></script>
<script>
if (renderShell('performance')) {
  var now = new Date();
  var stamp = now.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' })
    + ', ' + now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' WIB';

  function ring(pct) {
    var r = 30, c = 2 * Math.PI * r;
    var offset = c * (1 - Math.min(Math.abs(pct), 5) / 5);
    return { c: c.toFixed(1), offset: offset.toFixed(1) };
  }

  var accounts = [
    {
      cls: 'basic', pkg: 'Smart Basic', id: 'ACC01',
      deposit: '$10,000.00', equity: '$90,786.35',
      daily: '+$991.14', withdraw: '$73,862.00',
      ret: 1.09, retLabel: '+1.09%'
    },
    {
      cls: 'gold', pkg: 'Smart Gold', id: 'ACC02',
      deposit: '$10,000.00', equity: '$106,793.83',
      daily: '+$338.03', withdraw: '$28,000.00',
      ret: 0.32, retLabel: '+0.32%'
    },
    {
      cls: 'pro', pkg: 'Smart Pro', id: 'ACC03',
      deposit: '$60,000.00', equity: '$656,274.00',
      daily: '+$10,323.30', withdraw: '$5,540,000.00',
      ret: 1.57, retLabel: '+1.57%'
    }
  ];

  var cards = accounts.map(function (a, idx) {
    var rg = ring(a.ret);
    return (
      '<div class="acc-card ' + a.cls + '">' +
        '<div class="acc-top">' +
          '<span class="acc-pkg ' + a.cls + '">' + a.pkg.toUpperCase() + '</span>' +
          '<span class="mt5-badge">MT5 LIVE</span>' +
        '</div>' +
        '<div class="acc-id">' + a.id + ' <span class="online">ONLINE</span></div>' +
        '<div class="acc-metrics">' +
          '<div class="acc-metric"><div class="ml">Deposit Awal</div><div class="mv">' + a.deposit + '</div></div>' +
          '<div class="acc-metric"><div class="ml">Equity Saat Ini</div><div class="mv">' + a.equity + '</div></div>' +
          '<div class="acc-metric"><div class="ml">Daily Profit</div><div class="mv up">' + a.daily + '</div></div>' +
          '<div class="acc-metric"><div class="ml">Total Penarikan</div><div class="mv muted">' + a.withdraw + '</div></div>' +
        '</div>' +
        '<div class="daily-box">' +
          '<div class="db-label">Daily Return</div>' +
          '<div class="db-val">' + a.retLabel + '</div>' +
          '<div class="db-sub">Daily Profit ÷ Equity Saat Ini</div>' +
        '</div>' +
        '<div class="acc-foot">' +
          '<div class="ring-wrap">' +
            '<svg viewBox="0 0 72 72">' +
              '<circle class="track" cx="36" cy="36" r="30"/>' +
              '<circle class="bar" cx="36" cy="36" r="30" stroke-dasharray="' + rg.c + '" stroke-dashoffset="' + rg.offset + '"/>' +
            '</svg>' +
            '<div class="ring-pct">' + a.retLabel + '</div>' +
          '</div>' +
          '<div class="ring-detail">' +
            'Persentase terhadap Equity Saat Ini<br/>' +
            'Daily Profit: <strong>' + a.daily + '</strong><br/>' +
            'Equity Saat Ini: <strong>' + a.equity + '</strong><br/>' +
            'Daily Drawdown: <strong>0.00%</strong>' +
          '</div>' +
        '</div>' +
        '<div class="acc-update">Update: ' + stamp +
          '<div class="progress-line"><i></i></div>' +
        '</div>' +
      '</div>'
    );
  }).join('');

  document.getElementById('page-content').innerHTML =
    '<div class="live-head">' +
      '<h2>Live Performance</h2>' +
      '<p>Data aktual akun Smart Basic, Smart Gold, dan Smart Pro.</p>' +
    '</div>' +
    '<div class="acc-grid">' + cards + '</div>';
}
</script>
</body>
</html>
