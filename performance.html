<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="Live performance akun MT5 Smart AI: equity, daily profit, return harian, dan kalender master secara real-time."/>
<meta name="robots" content="noindex, nofollow"/>
<meta name="theme-color" content="#060b14"/>
<title>Acc Performance — Smart AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=20261118r">
<style>
.live-head{margin-bottom:1.25rem}
.live-head h2{font-size:1.35rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:linear-gradient(90deg,var(--cyan),#5eead4);-webkit-background-clip:text;background-clip:text;color:transparent}
.live-head p{color:var(--text-muted);font-size:.85rem;margin-top:.35rem}
.acc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.15rem}
@media(max-width:1100px){.acc-grid{grid-template-columns:1fr}}
.acc-card{background:var(--bg-card-solid);border-radius:18px;padding:1.3rem 1.25rem 1.15rem;border:1px solid var(--border);position:relative;overflow:hidden;animation:fadeUp .55s cubic-bezier(.22,1,.36,1) both;transition:transform .25s,box-shadow .25s}
.acc-card:hover{transform:translateY(-3px)}
.acc-card.basic{border-color:rgba(45,212,191,.4);box-shadow:0 0 0 1px rgba(45,212,191,.1),0 16px 40px rgba(0,0,0,.2)}
.acc-card.gold{border-color:rgba(251,191,36,.45);box-shadow:0 0 0 1px rgba(251,191,36,.1),0 16px 40px rgba(0,0,0,.2)}
.acc-card.pro{border-color:rgba(167,139,250,.45);box-shadow:0 0 0 1px rgba(167,139,250,.1),0 16px 40px rgba(0,0,0,.2)}
[data-theme=light] .acc-card.basic{box-shadow:0 0 0 1px rgba(13,148,136,.12),0 12px 28px rgba(15,23,42,.06)}
[data-theme=light] .acc-card.gold{box-shadow:0 0 0 1px rgba(217,119,6,.12),0 12px 28px rgba(15,23,42,.06)}
[data-theme=light] .acc-card.pro{box-shadow:0 0 0 1px rgba(124,58,237,.12),0 12px 28px rgba(15,23,42,.06)}
.acc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem}
.acc-pkg{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.acc-pkg.basic{color:var(--cyan)}.acc-pkg.gold{color:var(--gold)}.acc-pkg.pro{color:var(--purple)}
.mt5-badge{font-size:.6rem;font-weight:700;letter-spacing:.04em;padding:.26rem .55rem;border-radius:999px;background:rgba(45,212,191,.12);color:var(--cyan);border:1px solid rgba(45,212,191,.28)}
.acc-id{font-size:1.2rem;font-weight:800;letter-spacing:.02em;margin-bottom:.85rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.acc-id .online{font-size:.72rem;font-weight:700;color:var(--green);display:inline-flex;align-items:center;gap:.3rem}
.acc-id .online i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;animation:pulseDot 1.8s infinite}
.acc-id .muted{font-size:.72rem;font-weight:600;color:var(--text-dim)}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}70%{box-shadow:0 0 0 8px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.acc-metrics{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:.9rem}
.acc-metric{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:.65rem .8rem}
[data-theme=light] .acc-metric{background:rgba(15,23,42,.03)}
.acc-metric .ml{font-size:.62rem;color:var(--text-dim);font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin-bottom:.15rem}
.acc-metric .mv{font-size:1.02rem;font-weight:800}
.acc-metric .mv.up{color:var(--green)}.acc-metric .mv.down{color:var(--red)}
.daily-return-box{background:linear-gradient(135deg,rgba(45,212,191,.1),rgba(16,185,129,.04));border:1px solid rgba(45,212,191,.2);border-radius:14px;padding:1rem;display:flex;align-items:center;gap:1rem;margin-bottom:.75rem}
.ring-wrap{position:relative;width:72px;height:72px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-wrap .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800}
.daily-info .label{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim)}
.daily-info .val{font-size:1.15rem;font-weight:800;margin-top:.15rem}
.spark{height:28px;margin-top:.4rem}
.progress-row{margin-top:.5rem}
.progress-row .pr-label{display:flex;justify-content:space-between;font-size:.68rem;color:var(--text-muted);margin-bottom:.25rem}
.progress-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.progress-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--teal));transition:width .6s ease}
.cal-section{margin-top:1.75rem}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:.75rem}
.cal-head h3{font-size:1.05rem;font-weight:800;margin:0}
.cal-nav{display:flex;gap:.4rem;align-items:center}
.cal-nav button{border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text);padding:.4rem .7rem;border-radius:10px;cursor:pointer;font-weight:700;font-size:.8rem}
.cal-nav button:hover{border-color:var(--cyan);color:var(--cyan)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.35rem}
.cal-cell{aspect-ratio:1;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.02);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.72rem;padding:.2rem}
.cal-cell .d{font-weight:700;color:var(--text-muted)}
.cal-cell .p{font-weight:800;font-size:.65rem;margin-top:.1rem}
.cal-cell.pos{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.25)}
.cal-cell.pos .p{color:var(--green)}
.cal-cell.neg{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.22)}
.cal-cell.neg .p{color:var(--red)}
.cal-cell.empty{opacity:.35}
.cal-dow{text-align:center;font-size:.65rem;font-weight:700;color:var(--text-dim);padding:.3rem 0}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.page-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:280px;gap:.9rem;color:var(--text-muted)}
.page-loading .spin{width:40px;height:40px;border-radius:50%;border:3px solid rgba(45,212,191,.12);border-top-color:var(--cyan);animation:spin .65s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<script>try{var t=localStorage.getItem('smartai_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<script src="js/auth.js?v=20261118r"></script>
<script src="js/app.js?v=20261118r"></script>
<script src="js/mt5-api.js?v=20261118r"></script>
<script>
const user = renderShell('performance');
if (user) {
  var root = document.getElementById('page-content');
  root.innerHTML = '<div class="page-loading"><div class="spin"></div><p>Memuat performa live…</p></div>';
  var calMonth = new Date().getMonth();
  var calYear = new Date().getFullYear();
  function fmt(n) {
    if (typeof SmartAIMT5 !== 'undefined' && SmartAIMT5.formatUSD) return SmartAIMT5.formatUSD(n);
    return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 2 }).format(n || 0);
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function ring(pct) {
    var p = Math.max(-100, Math.min(100, Number(pct) || 0));
    var r = 28, c = 2 * Math.PI * r;
    var offset = c - (Math.abs(p) / 100) * c;
    var color = p >= 0 ? 'var(--green)' : 'var(--red)';
    return '<div class="ring-wrap"><svg width="72" height="72" viewBox="0 0 72 72"><circle cx="36" cy="36" r="'+r+'" fill="none" stroke="rgba(148,163,184,.15)" stroke-width="6"/><circle cx="36" cy="36" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+offset+'"/></svg><div class="pct" style="color:'+color+'">'+(p>=0?'+':'')+p.toFixed(1)+'%</div></div>';
  }
  async function loadPerformance() {
    var accounts = [];
    var history = {};
    try {
      if (typeof SmartAIMT5 !== 'undefined') {
        var res = await Promise.all([
          SmartAIMT5.getAccounts(true),
          SmartAIMT5.getDailyHistory ? SmartAIMT5.getDailyHistory() : Promise.resolve({})
        ]);
        accounts = res[0] || [];
        history = res[1] || {};
      }
    } catch (e) { accounts = []; }
    accounts = (accounts || []).sort(function(a,b){ return String(a.account_id||'').localeCompare(String(b.account_id||'')); });
    var pkgClass = { ACC01: 'basic', ACC02: 'gold', ACC03: 'pro' };
    var pkgName = { ACC01: 'Smart Basic', ACC02: 'Smart Gold', ACC03: 'Smart Pro' };
    var cards = accounts.map(function(a, i) {
      var cls = pkgClass[a.account_id] || 'basic';
      var on = String(a.status||'').toUpperCase() === 'ONLINE';
      var daily = Number(a.daily_profit) || 0;
      var equity = Number(a.equity) || 0;
      var pct = equity > 0 ? (daily / equity * 100) : 0;
      var html = '<div class="acc-card '+cls+'" style="animation-delay:'+(i*0.06)+'s">';
      html += '<div class="acc-top"><span class="acc-pkg '+cls+'">'+esc(pkgName[a.account_id]||a.name||'MT5')+'</span><span class="mt5-badge">MT5</span></div>';
      html += '<div class="acc-id">'+esc(a.account_id||'—');
      if (on) html += ' <span class="online"><i></i>Online</span>';
      else html += ' <span class="muted">'+esc(a.status||'—')+'</span>';
      html += '</div>';
      html += '<div class="acc-metrics">';
      html += '<div class="acc-metric"><div class="ml">Balance</div><div class="mv">'+fmt(a.balance)+'</div></div>';
      html += '<div class="acc-metric"><div class="ml">Equity</div><div class="mv">'+fmt(a.equity)+'</div></div>';
      html += '<div class="acc-metric"><div class="ml">Profit</div><div class="mv '+(Number(a.total_profit)>=0?'up':'down')+'">'+fmt(a.total_profit)+'</div></div>';
      html += '<div class="acc-metric"><div class="ml">Penarikan</div><div class="mv">'+fmt(a.total_penarikan)+'</div></div>';
      html += '</div>';
      html += '<div class="daily-return-box">'+ring(pct)+'<div class="daily-info"><div class="label">Daily Return</div><div class="val '+(daily>=0?'up':'down')+'">'+fmt(daily)+'</div></div></div>';
      html += '</div>';
      return html;
    }).join('');
    if (!cards) cards = '<div class="panel" style="grid-column:1/-1;padding:1.5rem;text-align:center;color:var(--text-muted)">Belum ada data akun MT5.</div>';
    // Calendar
    var daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
    var firstDow = new Date(calYear, calMonth, 1).getDay();
    var monthNames = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    var dows = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
    var calHtml = '<div class="cal-section"><div class="cal-head"><h3>Master Calendar</h3><div class="cal-nav"><button type="button" id="cal-prev">‹</button><span style="font-weight:700;min-width:140px;text-align:center">'+monthNames[calMonth]+' '+calYear+'</span><button type="button" id="cal-next">›</button></div></div>';
    calHtml += '<div class="cal-grid">';
    for (var d=0;d<7;d++) calHtml += '<div class="cal-dow">'+dows[d]+'</div>';
    for (var e=0;e<firstDow;e++) calHtml += '<div class="cal-cell empty"></div>';
    for (var day=1; day<=daysInMonth; day++) {
      var key = calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
      var profit = 0;
      if (history && history[key]) profit = Number(history[key]) || 0;
      // also try aggregate from accounts history if present
      var cls = profit > 0 ? 'pos' : (profit < 0 ? 'neg' : '');
      var pTxt = profit !== 0 ? (profit>0?'+':'')+profit.toFixed(0) : '—';
      calHtml += '<div class="cal-cell '+cls+'"><div class="d">'+day+'</div><div class="p">'+pTxt+'</div></div>';
    }
    calHtml += '</div></div>';
    root.innerHTML = '<div class="live-head"><h2>Live Acc Performance</h2><p>Data real-time dari akun MT5 · auto-refresh 45 detik</p></div><div class="acc-grid">'+cards+'</div>'+calHtml;
    var prev = document.getElementById('cal-prev');
    var next = document.getElementById('cal-next');
    if (prev) prev.onclick = function(){ calMonth--; if(calMonth<0){calMonth=11;calYear--;} loadPerformance(); };
    if (next) next.onclick = function(){ calMonth++; if(calMonth>11){calMonth=0;calYear++;} loadPerformance(); };
  }
  loadPerformance();
  setInterval(function(){ loadPerformance(); }, 45000);
}
</script>
</body>
</html>
