<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache"/>
<title>Acc Performance — Smart AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=20261116d">
<style>
.live-head{margin-bottom:1.25rem}
.live-head h2{font-size:1.35rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:linear-gradient(90deg,var(--cyan),#5eead4);-webkit-background-clip:text;background-clip:text;color:transparent}
.live-head p{color:var(--text-muted);font-size:.85rem;margin-top:.35rem}
.acc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.15rem}
@media(max-width:1100px){.acc-grid{grid-template-columns:1fr}}
.acc-card{background:var(--bg-card-solid);border-radius:18px;padding:1.25rem 1.2rem 1.15rem;border:1px solid var(--border);position:relative;overflow:hidden;animation:fadeUp .55s cubic-bezier(.22,1,.36,1) both}
.acc-card.basic{border-color:rgba(45,212,191,.35);box-shadow:0 0 0 1px rgba(45,212,191,.08),0 16px 40px rgba(0,0,0,.25)}
.acc-card.gold{border-color:rgba(251,191,36,.4);box-shadow:0 0 0 1px rgba(251,191,36,.08),0 16px 40px rgba(0,0,0,.25)}
.acc-card.pro{border-color:rgba(167,139,250,.4);box-shadow:0 0 0 1px rgba(167,139,250,.08),0 16px 40px rgba(0,0,0,.25)}
.acc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.85rem}
.acc-pkg{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.acc-pkg.basic{color:var(--cyan)}.acc-pkg.gold{color:var(--gold)}.acc-pkg.pro{color:var(--purple)}
.mt5-badge{font-size:.62rem;font-weight:700;letter-spacing:.04em;padding:.28rem .55rem;border-radius:999px;background:rgba(45,212,191,.12);color:var(--cyan);border:1px solid rgba(45,212,191,.25)}
.acc-id{font-size:1.15rem;font-weight:800;letter-spacing:.02em;margin-bottom:1rem;display:flex;align-items:center;gap:.55rem;flex-wrap:wrap}
.acc-id .online{font-size:.72rem;font-weight:700;color:var(--green)}.acc-id .muted{font-size:.72rem;font-weight:600;color:var(--text-dim)}
.acc-metrics{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin-bottom:1rem}
.acc-metric{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:.7rem .8rem}
.acc-metric .ml{font-size:.65rem;color:var(--text-dim);font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin-bottom:.2rem}
.acc-metric .mv{font-size:1.05rem;font-weight:800}.acc-metric .mv.up{color:var(--green)}
.daily-box{background:linear-gradient(135deg,rgba(45,212,191,.08),rgba(16,185,129,.05));border:1px solid rgba(45,212,191,.2);border-radius:14px;padding:.9rem 1rem;margin-bottom:1rem}
.db-label{font-size:.68rem;color:var(--text-dim);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.db-val{font-size:1.4rem;font-weight:800;color:var(--cyan);margin:.2rem 0}.db-sub{font-size:.78rem;color:var(--text-muted)}
.acc-foot{display:flex;gap:1rem;align-items:center;margin-bottom:.85rem}
.ring-wrap{position:relative;width:72px;height:72px;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-wrap .track{fill:none;stroke:rgba(255,255,255,.08);stroke-width:6}
.ring-wrap .bar{fill:none;stroke-width:6;stroke-linecap:round}
.acc-card.basic .ring-wrap .bar{stroke:var(--cyan)}.acc-card.gold .ring-wrap .bar{stroke:var(--gold)}.acc-card.pro .ring-wrap .bar{stroke:var(--purple)}
.ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;color:var(--green)}
.ring-detail{flex:1;font-size:.72rem;color:var(--text-muted);line-height:1.55}
.ring-detail strong{color:var(--text);font-weight:600}
.acc-update{font-size:.68rem;color:var(--text-dim);padding-top:.55rem;border-top:1px solid var(--border)}
.progress-line{height:3px;border-radius:99px;background:rgba(255,255,255,.06);margin-top:.45rem;position:relative;overflow:hidden}
.progress-line i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;width:100%}
.acc-card.basic .progress-line i{background:linear-gradient(90deg,transparent,var(--cyan))}
.master-perf{margin-top:1.75rem;background:var(--bg-card-solid);border:1px solid var(--border);border-radius:18px;padding:1.35rem 1.4rem 1.2rem}
.master-perf-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}
.master-perf-head h3{font-size:1.15rem;font-weight:800}
.view-tabs{display:flex;background:rgba(255,255,255,.04);border-radius:999px;padding:3px;border:1px solid var(--border);flex-wrap:wrap}
.view-tabs button{border:none;background:transparent;color:var(--text-muted);font-size:.78rem;font-weight:600;padding:.45rem .9rem;border-radius:999px;cursor:pointer;font-family:inherit}
.view-tabs button.active{background:var(--bg-card);color:var(--text)}
.mp-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.35rem}
@media(max-width:800px){.mp-stats{grid-template-columns:1fr 1fr}}
.mp-stat{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:.85rem 1rem}
.mp-stat .ml{font-size:.68rem;color:var(--text-dim);font-weight:600;text-transform:uppercase;margin-bottom:.35rem}
.mp-stat .mv{font-size:1.25rem;font-weight:800}.mp-stat .mv.up{color:var(--green)}.mp-stat .mv.down{color:var(--red)}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.cal-title{font-size:1.05rem;font-weight:700}
.cal-nav button{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:1rem}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font-size:.7rem;font-weight:600;color:var(--text-dim);padding:.35rem 0}
.cal-day{aspect-ratio:1;min-height:56px;border-radius:12px;border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.12rem;font-size:.72rem;background:rgba(255,255,255,.02)}
.cal-day .d{font-weight:600;font-size:.78rem;color:var(--text)}.cal-day .p{font-weight:700;font-size:.68rem}
.cal-day.empty{background:transparent;border-color:transparent}.cal-day.none{opacity:.5}
.cal-day.u3{background:rgba(45,212,191,.08)}.cal-day.u3 .p{color:#5eead4}
.cal-day.m38{background:rgba(45,212,191,.14)}.cal-day.m38 .p{color:var(--cyan)}
.cal-day.m815{background:rgba(45,212,191,.22)}.cal-day.m815 .p{color:#2dd4bf}
.cal-day.above{background:rgba(16,185,129,.28)}.cal-day.above .p{color:#34d399}
.cal-day.loss{background:rgba(248,113,113,.12)}.cal-day.loss .p{color:var(--red)}
.cal-day.today{outline:2px solid var(--cyan)}
.cal-legend{display:flex;flex-wrap:wrap;gap:.65rem 1.1rem;margin-top:1rem;font-size:.72rem;color:var(--text-muted)}
.cal-legend i{width:12px;height:12px;border-radius:4px;display:inline-block;border:1px solid var(--border)}
.cal-foot{margin-top:1rem;padding-top:.85rem;border-top:1px solid var(--border);font-size:.75rem;color:var(--text-dim)}
.perf-loading{padding:2rem;text-align:center;color:var(--text-muted)}
.perf-loading .spin{display:inline-block;width:28px;height:28px;border:3px solid rgba(45,212,191,.2);border-top-color:var(--cyan);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:.75rem}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style>
<script>try{var t=localStorage.getItem('smartai_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<script src="js/auth.js?v=20261116d"></script>
<script src="js/app.js?v=20261116d"></script>
<script src="js/mt5-api.js?v=20261117meta"></script>
<script>
if (typeof getUser === 'function' && !getUser()) {
  if (typeof ensureDemoAccount === 'function') ensureDemoAccount();
  if (typeof setUser === 'function') setUser({ nama: 'Demo Member', email: 'demo@smartai.com', hp: '081234567890', referral: 'SMARTAI-REF', avatar: null });
}
if (renderShell('performance')) {
  var packageNames = { ACC01: 'Smart Basic', ACC02: 'Smart Gold', ACC03: 'Smart Pro' };
  function accSubtitle(a) {
    var parts = [];
    if (a.login) parts.push('MT5 ' + a.login);
    if (a.owner) parts.push(a.owner);
    if (a.broker_label || a.broker) parts.push(a.broker_label || a.broker);
    return parts.join(' · ');
  }
  var calState = { year: new Date().getFullYear(), month: new Date().getMonth() + 1, account: 'ALL' };

  function renderAccount(a, index) {
    var cls = ['basic','gold','pro'][index] || 'basic';
    var online = String(a.status || '').toUpperCase() === 'ONLINE';
    var statusLabel = String(a.status || 'WAITING').toUpperCase();
    var equity = Number(a.equity);
    var daily = Number(a.daily_profit);
    var dailyReturn = Number.isFinite(equity) && equity > 0 && Number.isFinite(daily) ? (daily / equity * 100) : null;
    var returnText = dailyReturn === null ? '\u2014' : ((dailyReturn > 0 ? '+' : '') + dailyReturn.toFixed(2) + '%');
    var stamp = a.updated_at ? SmartAIMT5.escape(a.updated_at) : '\u2014';
    var sub = accSubtitle(a);
    return '<article class="acc-card ' + cls + '">' +
      '<div class="acc-top"><span class="acc-pkg ' + cls + '">' + (packageNames[a.account_id] || a.name || 'MT5') + '</span><span class="mt5-badge">' + statusLabel + '</span></div>' +
      '<div class="acc-id">' + SmartAIMT5.escape(a.account_id) + ' <span class="' + (online ? 'online' : 'muted') + '">' + statusLabel + '</span></div>' +
      (sub ? '<div style="font-size:.72rem;color:var(--text-muted);margin:-0.55rem 0 0.85rem;line-height:1.4">' + SmartAIMT5.escape(sub) + '</div>' : '') +
      '<div class="acc-metrics">' +
        '<div class="acc-metric"><div class="ml">Balance</div><div class="mv">' + SmartAIMT5.formatUSD(a.balance) + '</div></div>' +
        '<div class="acc-metric"><div class="ml">Equity</div><div class="mv">' + SmartAIMT5.formatUSD(a.equity) + '</div></div>' +
        '<div class="acc-metric"><div class="ml">Deposit Awal</div><div class="mv">' + SmartAIMT5.formatUSD(a.deposit_awal) + '</div></div>' +
        '<div class="acc-metric"><div class="ml">Total Profit</div><div class="mv ' + (Number(a.total_profit) >= 0 ? 'up' : '') + '">' + SmartAIMT5.formatUSD(a.total_profit) + '</div></div>' +
      '</div>' +
      '<div class="daily-box"><div class="db-label">Daily Profit</div><div class="db-val">' + SmartAIMT5.formatUSD(a.daily_profit) + '</div><div class="db-sub">Daily Return: ' + returnText + '</div></div>' +
      '<div class="acc-foot"><div class="ring-wrap"><svg viewBox="0 0 72 72"><circle class="track" cx="36" cy="36" r="30"/><circle class="bar" cx="36" cy="36" r="30" stroke-dasharray="188.5" stroke-dashoffset="' + (dailyReturn === null ? '188.5' : (188.5 * (1 - Math.min(Math.abs(dailyReturn),5)/5)).toFixed(1)) + '"/></svg><div class="ring-pct">' + returnText + '</div></div>' +
      '<div class="ring-detail">Total Penarikan: <strong>' + SmartAIMT5.formatUSD(a.total_penarikan) + '</strong><br/>Daily DD: <strong>' + SmartAIMT5.formatNumber(a.daily_dd, 2) + '</strong><br/>Update: <strong>' + stamp + '</strong></div></div>' +
      '<div class="acc-update">' + (SmartAIMT5.isLive() ? 'Sumber: API live SmartInvestama' : 'Sumber: demo fallback') + '<div class="progress-line"><i style="width:100%"></i></div></div>' +
    '</article>';
  }

  function profitClass(p) {
    if (p == null || !Number.isFinite(p)) return 'none';
    if (p < 0) return 'loss'; if (p === 0) return 'none';
    if (p < 300) return 'u3'; if (p < 800) return 'm38'; if (p < 1500) return 'm815'; return 'above';
  }
  function fmtShort(p) {
    if (p == null || !Number.isFinite(p)) return '\u2014';
    if (Math.abs(p) >= 1000) return (p > 0 ? '+' : '') + (p / 1000).toFixed(1) + 'k';
    return (p > 0 ? '+' : '') + Math.round(p);
  }
  function monthName(y, m) {
    try { return new Date(y, m - 1, 1).toLocaleDateString('id-ID', { month: 'long', year: 'numeric' }); }
    catch (e) { return y + '-' + m; }
  }
  function renderCalendar(history, year, month, accountFilter) {
    var daysInMonth = new Date(year, month, 0).getDate();
    var firstDow = new Date(year, month - 1, 1).getDay();
    var startPad = (firstDow + 6) % 7;
    var byDate = {};
    (history || []).forEach(function(h) {
      if (accountFilter && accountFilter !== 'ALL' && h.account_id !== accountFilter) return;
      if (!byDate[h.date]) byDate[h.date] = 0;
      byDate[h.date] += Number(h.profit) || 0;
    });
    var total = 0, winDays = 0, lossDays = 0, best = null, worst = null;
    for (var d = 1; d <= daysInMonth; d++) {
      var key = year + '-' + String(month).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      var p = byDate[key];
      if (p === undefined) continue;
      total += p;
      if (p > 0) winDays++; else if (p < 0) lossDays++;
      if (best === null || p > best) best = p;
      if (worst === null || p < worst) worst = p;
    }
    var today = new Date();
    var isCurrentMonth = today.getFullYear() === year && (today.getMonth() + 1) === month;
    var todayDate = today.getDate();
    var html = '';
    html += '<div class="mp-stats">';
    html += '<div class="mp-stat"><div class="ml">Total Profit Bulan</div><div class="mv ' + (total >= 0 ? 'up' : 'down') + '">' + SmartAIMT5.formatUSD(total) + '</div></div>';
    html += '<div class="mp-stat"><div class="ml">Hari Profit</div><div class="mv up">' + winDays + '</div></div>';
    html += '<div class="mp-stat"><div class="ml">Hari Loss</div><div class="mv down">' + lossDays + '</div></div>';
    html += '<div class="mp-stat"><div class="ml">Best / Worst</div><div class="mv">' + fmtShort(best) + ' / ' + fmtShort(worst) + '</div></div>';
    html += '</div>';
    html += '<div class="cal-head"><div class="cal-title">' + monthName(year, month) + '</div><div class="cal-nav"><button type="button" id="cal-prev">\u2039</button><button type="button" id="cal-next">\u203A</button></div></div>';
    html += '<div class="cal-grid">';
    ['Sen','Sel','Rab','Kam','Jum','Sab','Min'].forEach(function(dow){ html += '<div class="cal-dow">' + dow + '</div>'; });
    for (var i = 0; i < startPad; i++) html += '<div class="cal-day empty"></div>';
    for (var d = 1; d <= daysInMonth; d++) {
      var key = year + '-' + String(month).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      var p = byDate[key];
      var cls = profitClass(p);
      if (isCurrentMonth && d === todayDate) cls += ' today';
      html += '<div class="cal-day ' + cls + '"><span class="d">' + d + '</span>';
      if (p !== undefined) html += '<span class="p">' + fmtShort(p) + '</span>';
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="cal-legend"><span><i class="loss" style="background:rgba(248,113,113,.12)"></i> Loss</span><span><i class="none"></i> Flat</span><span><i class="u3" style="background:rgba(45,212,191,.08)"></i> kecil</span><span><i class="m38" style="background:rgba(45,212,191,.14)"></i> sedang</span><span><i class="m815" style="background:rgba(45,212,191,.22)"></i> bagus</span><span><i class="above" style="background:rgba(16,185,129,.28)"></i> besar</span></div>';
    html += '<div class="cal-foot">' + (SmartAIMT5.isLive() ? 'Kalender dari history equity live.' : 'Kalender demo.') + ' Filter akun di tab atas.</div>';
    return html;
  }
  function buildTabs() {
    var tabs = [{ id: 'ALL', label: 'Semua Akun' },{ id: 'ACC01', label: 'ACC01' },{ id: 'ACC02', label: 'ACC02' },{ id: 'ACC03', label: 'ACC03' }];
    return '<div class="view-tabs" id="cal-tabs">' + tabs.map(function(t) {
      return '<button type="button" data-acc="' + t.id + '" class="' + (calState.account === t.id ? 'active' : '') + '">' + t.label + '</button>';
    }).join('') + '</div>';
  }
  function bindCal() {
    var prev = document.getElementById('cal-prev');
    var next = document.getElementById('cal-next');
    if (prev) prev.onclick = function() { calState.month--; if (calState.month < 1) { calState.month = 12; calState.year--; } loadPerformance(); };
    if (next) next.onclick = function() { calState.month++; if (calState.month > 12) { calState.month = 1; calState.year++; } loadPerformance(); };
    var tabs = document.getElementById('cal-tabs');
    if (tabs) tabs.querySelectorAll('button').forEach(function(btn) {
      btn.onclick = function() { calState.account = btn.getAttribute('data-acc'); loadPerformance(); };
    });
  }
  async function loadPerformance() {
    var root = document.getElementById('page-content');
    if (!root) return;
    root.innerHTML = '<div class="perf-loading"><div class="spin"></div><div>Memuat data akun…</div></div>';
    try {
      var accounts = await SmartAIMT5.getAccounts(true);
      accounts = (accounts || []).slice().sort(function(a,b){ return String(a.account_id).localeCompare(String(b.account_id)); });
      var history = [];
      try { history = await SmartAIMT5.getDailyHistory(calState.year, calState.month, calState.account === 'ALL' ? null : calState.account); } catch (e) { history = []; }
      var live = SmartAIMT5.isLive && SmartAIMT5.isLive();
      root.innerHTML =
        '<div class="live-head"><h2>Account Performance</h2><p>' +
          (live ? 'Mode <strong style="color:var(--green)">LIVE</strong> · Data real-time dari API SmartInvestama.' : 'Mode demo · API live belum terjangkau.') +
        '</p></div>' +
        '<div class="acc-grid">' + (accounts.length ? accounts.map(renderAccount).join('') : '<p>Tidak ada data akun.</p>') + '</div>' +
        '<div class="master-perf">' +
          '<div class="master-perf-head"><div><h3>Profit Calendar</h3><div class="base" style="font-size:.8rem;color:var(--text-muted)">' + (live ? 'Data live' : 'Demo') + ' · filter per akun</div></div>' +
            buildTabs() +
          '</div>' +
          '<div id="cal-body">' + renderCalendar(history, calState.year, calState.month, calState.account) + '</div>' +
        '</div>';
      bindCal();
    } catch (error) {
      root.innerHTML = '<div class="live-head"><h2>Account Performance</h2><p>Gagal memuat data.</p></div><div class="master-perf"><p class="cal-foot">' + SmartAIMT5.escape(error && error.message ? error.message : String(error)) + '</p></div>';
    }
  }
  loadPerformance();
  setInterval(function(){ loadPerformance(); }, 45000);
}
</script>
</body>
</html>
