<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#060b14"/>
<meta http-equiv="Cache-Control" content="no-cache"/>
<title>Commission — Smart AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=20261117c">
<style>
.comm-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:1.25rem;margin-top:1.25rem}
@media(max-width:960px){.comm-grid{grid-template-columns:1fr}}
.chart-card{background:var(--bg-card-solid);border:1px solid var(--border);border-radius:16px;padding:1.2rem 1.3rem}
.chart-card h3{font-size:1rem;font-weight:800;margin-bottom:.25rem}
.chart-card .sub{font-size:.78rem;color:var(--text-muted);margin-bottom:1.1rem;line-height:1.4}
.bar-chart{display:flex;align-items:flex-end;gap:.75rem;height:200px;padding:0 .25rem .5rem;border-bottom:1px solid var(--border)}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:.4rem;min-width:0}
.bar-track{width:100%;max-width:48px;flex:1;display:flex;align-items:flex-end;justify-content:center}
.bar{width:100%;border-radius:8px 8px 4px 4px;min-height:4px;background:linear-gradient(180deg,var(--cyan),rgba(45,212,191,.25));transition:height .6s cubic-bezier(.22,1,.36,1)}
.bar.l2{background:linear-gradient(180deg,#a78bfa,rgba(167,139,250,.25))}
.bar.l3{background:linear-gradient(180deg,var(--gold),rgba(251,191,36,.25))}
.bar.l4{background:linear-gradient(180deg,#38bdf8,rgba(56,189,248,.25))}
.bar.l5{background:linear-gradient(180deg,#fb7185,rgba(251,113,133,.25))}
.bar-val{font-size:.72rem;font-weight:800;color:var(--text);white-space:nowrap}
.bar-label{font-size:.7rem;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:.04em}
.bar-lots{font-size:.62rem;color:var(--text-muted)}
.donut-wrap{display:flex;align-items:center;gap:1.25rem;flex-wrap:wrap;justify-content:center}
.donut-svg{width:160px;height:160px;flex-shrink:0}
.donut-center{font-size:.85rem;font-weight:800;fill:var(--text)}
.donut-sub{font-size:.62rem;fill:var(--text-muted)}
.donut-legend{display:flex;flex-direction:column;gap:.45rem;font-size:.8rem;min-width:140px}
.donut-legend span{display:flex;align-items:center;gap:.45rem;color:var(--text-muted)}
.donut-legend i{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.donut-legend strong{color:var(--text);font-weight:700;margin-left:auto}
.trend-svg{width:100%;height:180px;display:block}
.trend-grid line{stroke:var(--border);stroke-width:1}
.trend-area{fill:url(#areaGrad);opacity:.9}
.trend-line{fill:none;stroke:var(--cyan);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.trend-dot{fill:var(--cyan);stroke:var(--bg-card-solid);stroke-width:2}
.trend-labels{display:flex;justify-content:space-between;margin-top:.35rem;font-size:.68rem;color:var(--text-dim);padding:0 .15rem}
.stack-row{margin-bottom:.85rem}
.stack-label{display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:.3rem}
.stack-label span{color:var(--text-muted)}
.stack-label strong{color:var(--text);font-weight:700}
.stack-track{height:12px;border-radius:999px;background:rgba(255,255,255,.04);overflow:hidden;display:flex}
.stack-seg{height:100%;transition:width .5s ease}
.stack-seg.s1{background:var(--cyan)}.stack-seg.s2{background:#a78bfa}.stack-seg.s3{background:var(--gold)}.stack-seg.s4{background:#38bdf8}.stack-seg.s5{background:#fb7185}
.comm-table th{font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim)}
.comm-table td{font-size:.85rem}
.badge-lot{display:inline-flex;align-items:center;gap:.25rem;font-size:.72rem;font-weight:700;padding:.2rem .5rem;border-radius:6px;background:rgba(45,212,191,.1);color:var(--cyan)}
.mt5-hint{margin-top:1rem;padding:.85rem 1rem;border-radius:12px;background:rgba(56,189,248,.06);border:1px solid rgba(56,189,248,.2);font-size:.8rem;color:var(--text-muted);line-height:1.5}
.mt5-hint strong{color:var(--text)}
</style>
<script>try{var t=localStorage.getItem('smartai_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<script src="js/auth.js?v=20261117c"></script>
<script src="js/app.js?v=20261117c"></script>
<script src="js/mt5-api.js?v=20261117c"></script>
<script>
if (renderShell('commission')) {
  var root = document.getElementById('page-content');
  var MAX_LEVEL = 5, TOTAL_PER_LOT = 15, DIRECT_SPONSOR = 13, UPLINE_POOL = 2;
  function rateForYou(level) {
    level = Number(level) || 0;
    if (level < 1 || level > MAX_LEVEL) return 0;
    if (level === 1) return TOTAL_PER_LOT;
    return UPLINE_POOL / (level - 1);
  }
  function rateLabel(level) {
    var r = rateForYou(level);
    return r === Math.floor(r) ? '$' + r : '$' + r.toFixed(2);
  }
  var COLORS = {1:'#2dd4bf',2:'#a78bfa',3:'#fbbf24',4:'#38bdf8',5:'#fb7185'};
  var demoLots = {1:25,2:13,3:7,4:3,5:2};
  var monthly = [
    {m:'Jun',total:180,lots:14},{m:'Jul',total:265,lots:20},{m:'Agu',total:310,lots:24},
    {m:'Sep',total:290,lots:22},{m:'Okt',total:420,lots:32},{m:'Nov',total:0,lots:0}
  ];
  var history = [
    {date:'16 Nov 2026',member:'Fajar S.',level:1,lots:3.0,note:'MT5 #88421'},
    {date:'15 Nov 2026',member:'Tono H.',level:2,lots:2.5,note:'MT5 #90112'},
    {date:'14 Nov 2026',member:'Maya L.',level:1,lots:4.0,note:'MT5 #87330'},
    {date:'13 Nov 2026',member:'Andi R.',level:3,lots:1.5,note:'MT5 #91550'},
    {date:'12 Nov 2026',member:'Nina A.',level:2,lots:2.0,note:'MT5 #89201'},
    {date:'11 Nov 2026',member:'Wati A.',level:4,lots:1.0,note:'MT5 #92880'},
    {date:'10 Nov 2026',member:'Rizky K.',level:1,lots:2.0,note:'MT5 #86044'},
    {date:'09 Nov 2026',member:'Lulu P.',level:5,lots:0.5,note:'MT5 #93102'}
  ];
  function fmt(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(n||0)}
  function byLevelEarn(){var o={},t=0,lots=0;for(var L=1;L<=5;L++){o[L]=demoLots[L]*rateForYou(L);t+=o[L];lots+=demoLots[L]}return{earn:o,total:t,lots:lots}}
  function donutSVG(earn,total){if(total<=0)total=1;var r=54,cx=80,cy=80,circ=2*Math.PI*r,offset=0,segs='';for(var L=1;L<=5;L++){var pct=earn[L]/total,len=pct*circ;segs+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+COLORS[L]+'" stroke-width="18" stroke-dasharray="'+len.toFixed(2)+' '+(circ-len).toFixed(2)+'" stroke-dashoffset="'+(-offset).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')" />';offset+=len}return '<svg class="donut-svg" viewBox="0 0 160 160">'+segs+'<text class="donut-center" x="80" y="76" text-anchor="middle">'+fmt(total).replace('.00','')+'</text><text class="donut-sub" x="80" y="94" text-anchor="middle">total komisi</text></svg>'}
  function trendSVG(data){var W=480,H=180,padL=8,padR=8,padT=16,padB=8;var maxV=Math.max.apply(null,data.map(function(d){return d.total}))||1;maxV=Math.ceil(maxV*1.15/50)*50;var pts=data.map(function(d,i){var x=padL+(i/(data.length-1))*(W-padL-padR);var y=padT+(1-d.total/maxV)*(H-padT-padB);return{x:x,y:y,v:d.total}});var line=pts.map(function(p,i){return (i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1)}).join(' ');var area=line+' L'+pts[pts.length-1].x.toFixed(1)+','+(H-padB)+' L'+pts[0].x.toFixed(1)+','+(H-padB)+' Z';var dots=pts.map(function(p){return '<circle class="trend-dot" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="4"><title>'+fmt(p.v)+'</title></circle>'}).join('');var grid='';for(var g=0;g<=4;g++){var gy=padT+(g/4)*(H-padT-padB);grid+='<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" />'}return '<svg class="trend-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(45,212,191,.35)"/><stop offset="100%" stop-color="rgba(45,212,191,0)"/></linearGradient></defs><g class="trend-grid">'+grid+'</g><path class="trend-area" d="'+area+'"/><path class="trend-line" d="'+line+'"/>'+dots+'</svg>'}
  async function loadComm(){
    var accounts=[];try{if(typeof SmartAIMT5!=='undefined'&&SmartAIMT5.getAccounts)accounts=await SmartAIMT5.getAccounts(true)}catch(e){}
    var live=(typeof SmartAIMT5!=='undefined'&&SmartAIMT5.isLive)?SmartAIMT5.isLive():false;
    var totalDaily=0,totalProfit=0;accounts.forEach(function(a){if(Number.isFinite(Number(a.daily_profit)))totalDaily+=Number(a.daily_profit);if(Number.isFinite(Number(a.total_profit)))totalProfit+=Number(a.total_profit)});
    var data=byLevelEarn();monthly[monthly.length-1].total=data.total;monthly[monthly.length-1].lots=data.lots;
    var maxEarn=Math.max.apply(null,[1,2,3,4,5].map(function(L){return data.earn[L]}))||1;
    var bars=[1,2,3,4,5].map(function(L){var h=Math.max(4,(data.earn[L]/maxEarn)*100);return '<div class="bar-col"><div class="bar-val">'+fmt(data.earn[L]).replace('.00','')+'</div><div class="bar-track"><div class="bar l'+L+'" style="height:'+h+'%"></div></div><div class="bar-label">L'+L+'</div><div class="bar-lots">'+demoLots[L]+' lot</div></div>'}).join('');
    var legend=[1,2,3,4,5].map(function(L){var pct=data.total?((data.earn[L]/data.total)*100).toFixed(0):0;return '<span><i style="background:'+COLORS[L]+'"></i> Level '+L+' <strong>'+fmt(data.earn[L]).replace('.00','')+' ('+pct+'%)</strong></span>'}).join('');
    var stackSegs=[1,2,3,4,5].map(function(L){var w=data.total?(data.earn[L]/data.total*100):0;return '<div class="stack-seg s'+L+'" style="width:'+w+'%" title="L'+L+': '+fmt(data.earn[L])+'"></div>'}).join('');
    var histRows=history.map(function(h){var earn=h.lots*rateForYou(h.level);return '<tr><td>'+h.date+'</td><td>'+(typeof SmartAIMT5!=='undefined'&&SmartAIMT5.escape?SmartAIMT5.escape(h.member):h.member)+'</td><td><span style="background:rgba(45,212,191,.12);color:var(--cyan);padding:.15rem .45rem;border-radius:999px;font-size:.68rem;font-weight:800">L'+h.level+'</span></td><td><span class="badge-lot">'+h.lots+' lot</span></td><td style="color:var(--green);font-weight:700">'+fmt(earn)+'</td><td style="font-size:.75rem;color:var(--text-muted)">'+h.note+'</td></tr>'}).join('');
    var fmtDaily=(typeof SmartAIMT5!=='undefined'&&SmartAIMT5.formatUSD)?SmartAIMT5.formatUSD(totalDaily):fmt(totalDaily);
    var fmtProfit=(typeof SmartAIMT5!=='undefined'&&SmartAIMT5.formatUSD)?SmartAIMT5.formatUSD(totalProfit):fmt(totalProfit);
    var acctRows=(accounts.length?accounts:[{account_id:'—',daily_profit:0,total_profit:0,status:'Demo'}]).map(function(a){var esc=(typeof SmartAIMT5!=='undefined'&&SmartAIMT5.escape)?SmartAIMT5.escape:function(s){return String(s||'')};var f=(typeof SmartAIMT5!=='undefined'&&SmartAIMT5.formatUSD)?SmartAIMT5.formatUSD:fmt;return '<tr><td>'+esc(a.account_id)+'</td><td>'+f(a.daily_profit)+'</td><td>'+f(a.total_profit)+'</td><td>'+esc(a.status||'')+'</td></tr>'}).join('');
    root.innerHTML='<div class="page-header"><div><h1>Commission</h1><p>Visualisasi komisi multilevel — total <strong>$15/lot</strong>: sponsor $13 + pool upline $2 (L1: kamu $15 penuh).</p></div></div>'+
      '<div class="stats-grid">'+
        '<div class="stat-card"><div class="label">Komisi jaringan (demo)</div><div class="value up">'+fmt(data.total)+'</div><div class="hint">'+data.lots+' lot · L1–L5</div></div>'+
        '<div class="stat-card"><div class="label">Direct L1 ($15/lot ke kamu)</div><div class="value up">'+fmt(data.earn[1])+'</div><div class="hint">'+demoLots[1]+' lot downline</div></div>'+
        '<div class="stat-card"><div class="label">Daily profit MT5</div><div class="value '+(totalDaily>=0?'up':'')+'">'+fmtDaily+'</div><div class="hint">'+(live?'Live':'Demo')+'</div></div>'+
        '<div class="stat-card"><div class="label">Total profit MT5</div><div class="value up">'+fmtProfit+'</div><div class="hint">Semua akun</div></div></div>'+
      '<div class="comm-grid"><div class="chart-card"><h3>Komisi per Level</h3><p class="sub">Rate × volume lot (ke kamu).</p><div class="bar-chart">'+bars+'</div>'+
        '<div class="stack-row" style="margin-top:1.25rem"><div class="stack-label"><span>Distribusi total</span><strong>'+fmt(data.total)+'</strong></div><div class="stack-track">'+stackSegs+'</div></div></div>'+
        '<div class="chart-card"><h3>Proporsi Komisi</h3><p class="sub">Share tiap level.</p><div class="donut-wrap">'+donutSVG(data.earn,data.total)+'<div class="donut-legend">'+legend+'</div></div></div></div>'+
      '<div class="chart-card" style="margin-top:1.25rem"><h3>Tren Komisi 6 Bulan</h3><p class="sub">Estimasi (demo). Titik terakhir = bulan berjalan.</p>'+trendSVG(monthly)+
        '<div class="trend-labels">'+monthly.map(function(d){return '<span>'+d.m+'</span>'}).join('')+'</div></div>'+
      '<div class="comm-grid" style="margin-top:1.25rem"><div class="panel" style="margin:0"><div class="panel-head"><h2>Riwayat komisi</h2><span class="sub">Dari lot MT-5 downline · demo</span></div>'+
        '<div class="table-wrap"><table class="comm-table"><thead><tr><th>Tanggal</th><th>Member</th><th>Level</th><th>Volume</th><th>Komisi</th><th>Akun</th></tr></thead><tbody>'+histRows+'</tbody></table></div>'+
        '<div class="mt5-hint"><strong>Logika komisi (total $15/lot):</strong> sponsor langsung <strong>$13</strong> (L1: kamu <strong>$15</strong>). Sisa <strong>$2</strong> dibagi rata ke upline di atas sponsor. <a href="referral.html" style="color:var(--cyan)">Pohon koneksi</a>.</div></div>'+
        '<div class="panel" style="margin:0"><div class="panel-head"><h2>Skema rate ke kamu</h2><span class="sub">Total $15 / lot</span></div>'+
        '<div class="table-wrap"><table class="comm-table"><thead><tr><th>Level</th><th>Rate ke kamu</th><th>Volume</th><th>Komisi</th></tr></thead><tbody>'+
        [1,2,3,4,5].map(function(L){return '<tr><td>Level '+L+'</td><td>'+rateLabel(L)+' / lot</td><td>'+demoLots[L]+' lot</td><td style="color:var(--green);font-weight:700">'+fmt(data.earn[L])+'</td></tr>'}).join('')+
        '</tbody></table></div><div class="panel-head" style="margin-top:1.25rem"><h2>Akun MT5</h2><span class="sub">'+(live?'LIVE':'DEMO')+'</span></div>'+
        '<div class="table-wrap"><table class="comm-table"><thead><tr><th>Akun</th><th>Daily</th><th>Total profit</th><th>Status</th></tr></thead><tbody>'+acctRows+'</tbody></table></div></div></div>';
  }
  loadComm();setInterval(loadComm,45000);
}
</script>
</body>
</html>
