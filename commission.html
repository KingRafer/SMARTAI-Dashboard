<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#060b14"/>
<title>Commission — Smart AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>try{var t=localStorage.getItem('smartai_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/mt5-api.js?v=20261117live2"></script>
<script>
if (renderShell('commission')) {
  var root = document.getElementById('page-content');
  root.innerHTML = '<div style="padding:2rem;text-align:center;color:var(--text-muted)">Memuat…</div>';

  async function loadComm() {
    var accounts = [];
    try { accounts = await SmartAIMT5.getAccounts(true); } catch (e) {}
    var live = SmartAIMT5.isLive && SmartAIMT5.isLive();
    var totalProfit = 0, totalDaily = 0;
    accounts.forEach(function(a) {
      if (Number.isFinite(Number(a.total_profit))) totalProfit += Number(a.total_profit);
      if (Number.isFinite(Number(a.daily_profit))) totalDaily += Number(a.daily_profit);
    });
    root.innerHTML =
      '<div class="page-header"><div><h1>Commission</h1><p>Komisi referral (demo) + konteks performa akun MT5.</p></div></div>' +
      '<div class="stats-grid">' +
        '<div class="stat-card"><div class="label">Komisi bulan ini</div><div class="value up">$1,240</div><div class="hint">Demo referral</div></div>' +
        '<div class="stat-card"><div class="label">Total dibayar</div><div class="value">$8,920</div><div class="hint">Demo</div></div>' +
        '<div class="stat-card"><div class="label">Daily profit MT5</div><div class="value '+(totalDaily>=0?'up':'')+'">' + SmartAIMT5.formatUSD(totalDaily) + '</div><div class="hint">'+(live?'Live':'Demo')+'</div></div>' +
        '<div class="stat-card"><div class="label">Total profit MT5</div><div class="value up">' + SmartAIMT5.formatUSD(totalProfit) + '</div><div class="hint">Semua akun</div></div>' +
      '</div>' +
      '<div class="panel">' +
        '<div class="panel-head"><h2>Riwayat komisi</h2><span class="sub">Data demo referral · bukan dari broker</span></div>' +
        '<div class="table-wrap"><table>' +
          '<thead><tr><th>Tanggal</th><th>Sumber</th><th>Jumlah</th><th>Status</th></tr></thead>' +
          '<tbody>' +
            '<tr><td>15 Nov 2026</td><td>Referral L1</td><td style="color:var(--green)">+$120</td><td><span class="badge ok">Paid</span></td></tr>' +
            '<tr><td>10 Nov 2026</td><td>Client fee</td><td style="color:var(--green)">+$350</td><td><span class="badge ok">Paid</span></td></tr>' +
            '<tr><td>05 Nov 2026</td><td>Referral L2</td><td style="color:var(--green)">+$45</td><td><span class="badge warn">Pending</span></td></tr>' +
            '<tr><td>01 Nov 2026</td><td>Client fee</td><td style="color:var(--green)">+$280</td><td><span class="badge ok">Paid</span></td></tr>' +
          '</tbody></table></div>' +
      '</div>' +
      '<div class="panel" style="margin-top:1.25rem">' +
        '<div class="panel-head"><h2>Konteks akun MT5</h2><span class="sub">'+(live?'LIVE':'DEMO')+'</span></div>' +
        '<div class="table-wrap"><table>' +
          '<thead><tr><th>Akun</th><th>Daily</th><th>Total profit</th><th>Status</th></tr></thead>' +
          '<tbody>' + accounts.map(function(a){
            return '<tr><td>'+SmartAIMT5.escape(a.account_id)+'</td><td>'+SmartAIMT5.formatUSD(a.daily_profit)+'</td><td>'+SmartAIMT5.formatUSD(a.total_profit)+'</td><td>'+SmartAIMT5.escape(a.status||'')+'</td></tr>';
          }).join('') + '</tbody></table></div>' +
      '</div>';
  }
  loadComm();
  setInterval(loadComm, 45000);
}
</script>
</body>
</html>
