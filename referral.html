<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache"/>
<title>Referral Network — Smart AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=20261116f">
<style>
.ref-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:1.25rem}
@media(max-width:960px){.ref-grid{grid-template-columns:1fr}}
.rule-card{background:var(--bg-card-solid);border:1px solid var(--border);border-radius:16px;padding:1.2rem 1.3rem}
.rule-card h3{font-size:1rem;font-weight:800;margin-bottom:.35rem}
.rule-card p.sub{font-size:.8rem;color:var(--text-muted);margin-bottom:1rem;line-height:1.45}
.level-table{width:100%;border-collapse:collapse;font-size:.85rem}
.level-table th,.level-table td{padding:.55rem .4rem;text-align:left;border-bottom:1px solid var(--border)}
.level-table th{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);font-weight:700}
.level-table td strong{color:var(--cyan);font-weight:800}
.level-pill{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:22px;padding:0 .45rem;border-radius:999px;font-size:.68rem;font-weight:800;background:rgba(45,212,191,.12);color:var(--cyan)}
.flow-box{margin-top:1rem;padding:.9rem 1rem;border-radius:12px;background:rgba(45,212,191,.06);border:1px solid rgba(45,212,191,.18);font-size:.8rem;color:var(--text-muted);line-height:1.55}
.flow-box strong{color:var(--text)}
.calc-box{background:var(--bg-card-solid);border:1px solid var(--border);border-radius:16px;padding:1.2rem 1.3rem}
.calc-box label{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);margin-bottom:.35rem}
.calc-box input,.calc-box select{width:100%;padding:.65rem .75rem;border-radius:10px;border:1px solid var(--border);background:var(--input-bg,rgba(0,0,0,.25));color:var(--text);font-family:inherit;font-size:.9rem;margin-bottom:.85rem}
.calc-result{margin-top:.5rem}
.calc-row{display:flex;justify-content:space-between;align-items:center;padding:.45rem 0;border-bottom:1px solid var(--border);font-size:.85rem}
.calc-row:last-child{border-bottom:none;font-weight:800;padding-top:.7rem}
.calc-row .amt{color:var(--cyan);font-weight:700}
.calc-row.total .amt{color:var(--green);font-size:1.05rem}
.network-list{margin-top:1.25rem}
.member-row{display:grid;grid-template-columns:40px 1fr auto auto;gap:.75rem;align-items:center;padding:.75rem .9rem;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.02);margin-bottom:.55rem}
.member-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;background:rgba(45,212,191,.15);color:var(--cyan)}
.member-av.l2{background:rgba(251,191,36,.15);color:var(--gold)}
.member-av.l3{background:rgba(167,139,250,.15);color:var(--purple)}
.member-av.l4{background:rgba(248,113,113,.12);color:#fb7185}
.member-av.l5{background:rgba(148,163,184,.15);color:#94a3b8}
.member-name{font-weight:700;font-size:.88rem}
.member-meta{font-size:.72rem;color:var(--text-muted)}
.member-lots{font-size:.8rem;color:var(--text-muted);text-align:right}
.member-earn{font-weight:800;color:var(--green);font-size:.9rem;text-align:right}
.ref-code-box{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:.75rem}
.ref-code-box code{font-family:ui-monospace,monospace;font-weight:700;color:var(--cyan);padding:.4rem .7rem;border-radius:8px;background:rgba(45,212,191,.1);border:1px solid rgba(45,212,191,.2);font-size:.85rem}
.btn-copy{border:1px solid var(--border);background:transparent;color:var(--text);padding:.4rem .75rem;border-radius:8px;font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit}
.btn-copy:hover{border-color:var(--cyan);color:var(--cyan)}
.example-steps{margin:0;padding-left:1.1rem;font-size:.8rem;color:var(--text-muted);line-height:1.55}
.example-steps li{margin-bottom:.35rem}
.example-steps strong{color:var(--text)}
</style>
<script>try{var t=localStorage.getItem('smartai_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<script src="js/auth.js?v=20261116f"></script>
<script src="js/app.js?v=20261116f"></script>
<script>
const user = renderShell('referral');
if (user) {
  var COMMISSION = { 1: 15, 2: 2, 3: 1, 4: 1, 5: 1 };
  var MAX_LEVEL = 5;
  var refCode = (user.referral && user.referral.trim()) ? user.referral.trim().toUpperCase() : 'SMARTAI-REF';
  var refLink = location.origin + location.pathname.replace(/[^/]+$/, '') + 'register.html?ref=' + encodeURIComponent(refCode);

  var network = [
    { id: 'M2A', name: 'Fajar S.', level: 1, lots: 12, invitedBy: 'YOU' },
    { id: 'M2B', name: 'Maya L.', level: 1, lots: 8, invitedBy: 'YOU' },
    { id: 'M2C', name: 'Rizky K.', level: 1, lots: 5, invitedBy: 'YOU' },
    { id: 'M3A', name: 'Tono H.', level: 2, lots: 6, invitedBy: 'M2A' },
    { id: 'M3B', name: 'Nina A.', level: 2, lots: 4, invitedBy: 'M2A' },
    { id: 'M3C', name: 'Dina W.', level: 2, lots: 3, invitedBy: 'M2B' },
    { id: 'M4A', name: 'Andi R.', level: 3, lots: 5, invitedBy: 'M3A' },
    { id: 'M4B', name: 'Fira L.', level: 3, lots: 2, invitedBy: 'M3B' },
    { id: 'M5A', name: 'Wati A.', level: 4, lots: 3, invitedBy: 'M4A' },
    { id: 'M6A', name: 'Lulu P.', level: 5, lots: 2, invitedBy: 'M5A' }
  ];

  function earnFromMember(level, lots) {
    var rate = COMMISSION[level] || 0;
    return rate * (Number(lots) || 0);
  }
  function totalYouEarn() {
    return network.reduce(function(s, m) { return s + earnFromMember(m.level, m.lots); }, 0);
  }
  function levelStats() {
    var out = {};
    for (var L = 1; L <= MAX_LEVEL; L++) out[L] = { count: 0, lots: 0, earn: 0 };
    network.forEach(function(m) {
      if (!out[m.level]) return;
      out[m.level].count++;
      out[m.level].lots += m.lots;
      out[m.level].earn += earnFromMember(m.level, m.lots);
    });
    return out;
  }

  var stats = levelStats();
  var totalEarn = totalYouEarn();
  var totalLots = network.reduce(function(s, m) { return s + m.lots; }, 0);
  var totalMembers = network.length;

  function fmt(n) {
    return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 2 }).format(n);
  }
  function avClass(level) { return level === 1 ? '' : 'l' + level; }

  var levelRows = '';
  for (var L = 1; L <= MAX_LEVEL; L++) {
    levelRows += '<tr><td><span class="level-pill">L' + L + '</span></td>' +
      '<td>' + (L === 1 ? 'Direct (yang kamu ajak)' : 'Upline level ' + L) + '</td>' +
      '<td><strong>$' + COMMISSION[L].toFixed(0) + '</strong> / lot</td>' +
      '<td>' + (stats[L].count) + ' member</td>' +
      '<td>' + fmt(stats[L].earn) + '</td></tr>';
  }

  var memberRows = network.map(function(m) {
    var earn = earnFromMember(m.level, m.lots);
    var ini = m.name.split(' ').map(function(p){ return p[0]; }).join('').slice(0, 2).toUpperCase();
    return '<div class="member-row">' +
      '<div class="member-av ' + avClass(m.level) + '">' + ini + '</div>' +
      '<div><div class="member-name">' + escapeHtml(m.name) + '</div>' +
      '<div class="member-meta">Level ' + m.level + ' · diajak oleh ' + escapeHtml(m.invitedBy === 'YOU' ? 'kamu' : m.invitedBy) + '</div></div>' +
      '<div class="member-lots">' + m.lots + ' lot</div>' +
      '<div class="member-earn">+' + fmt(earn) + '</div>' +
    '</div>';
  }).join('');

  document.getElementById('page-content').innerHTML =
    '<div class="page-header">' +
      '<div><h1>Referral Network</h1>' +
      '<p>Skema komisi multilevel sampai 5 level — bonus dihitung per lot transaksi downline.</p></div>' +
    '</div>' +
    '<div class="stats-grid">' +
      '<div class="stat-card"><div class="label">Estimasi komisi (demo)</div><div class="value up">' + fmt(totalEarn) + '</div><div class="hint">Dari volume jaringan</div></div>' +
      '<div class="stat-card"><div class="label">Member di network</div><div class="value">' + totalMembers + '</div><div class="hint">Level 1–5</div></div>' +
      '<div class="stat-card"><div class="label">Total lot downline</div><div class="value">' + totalLots + '</div><div class="hint">Bulan ini · simulasi</div></div>' +
      '<div class="stat-card"><div class="label">Direct (L1)</div><div class="value">' + stats[1].count + '</div><div class="hint">' + fmt(stats[1].earn) + ' dari L1</div></div>' +
    '</div>' +
    '<div class="ref-grid">' +
      '<div class="rule-card">' +
        '<h3>Aturan komisi per 1 lot</h3>' +
        '<p class="sub">Setiap kali member di jaringanmu menutup transaksi <strong>1 lot</strong>, komisi mengalir ke upline sampai maksimal 5 level.</p>' +
        '<table class="level-table">' +
          '<thead><tr><th>Level</th><th>Posisi</th><th>Bonus</th><th>Di network</th><th>Estimasi</th></tr></thead>' +
          '<tbody>' + levelRows + '</tbody>' +
        '</table>' +
        '<div class="flow-box">' +
          '<strong>Contoh alur:</strong><br/>' +
          'Member 1 (kamu) ajak Member 2 → Member 2 trade 1 lot → kamu dapat <strong>$15</strong>.<br/>' +
          'Member 2 ajak Member 3 → Member 3 trade 1 lot → Member 2 dapat <strong>$15</strong>, kamu (L2) dapat <strong>$2</strong>.<br/>' +
          'Member 3 ajak Member 4 → Member 4 trade 1 lot → Member 3 dapat $15, Member 2 dapat $2, kamu dapat <strong>$1</strong> (L3).<br/>' +
          'Begitu seterusnya sampai level 5 ($1).' +
        '</div>' +
        '<div style="margin-top:1rem">' +
          '<div style="font-size:.78rem;font-weight:700;margin-bottom:.4rem;color:var(--text-muted)">Kode referral kamu</div>' +
          '<div class="ref-code-box">' +
            '<code id="ref-code">' + escapeHtml(refCode) + '</code>' +
            '<button type="button" class="btn-copy" id="copy-code">Salin kode</button>' +
            '<button type="button" class="btn-copy" id="copy-link">Salin link daftar</button>' +
          '</div>' +
          '<div style="font-size:.72rem;color:var(--text-dim);margin-top:.5rem;word-break:break-all" id="ref-link">' + escapeHtml(refLink) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="calc-box">' +
        '<h3 style="font-size:1rem;font-weight:800;margin-bottom:.35rem">Kalkulator komisi</h3>' +
        '<p style="font-size:.8rem;color:var(--text-muted);margin-bottom:1rem">Hitung berapa yang kamu terima jika downline di level tertentu trade N lot.</p>' +
        '<label>Level downline relatif ke kamu</label>' +
        '<select id="calc-level">' +
          '<option value="1">Level 1 — direct ($15/lot)</option>' +
          '<option value="2">Level 2 — ($2/lot)</option>' +
          '<option value="3">Level 3 — ($1/lot)</option>' +
          '<option value="4">Level 4 — ($1/lot)</option>' +
          '<option value="5">Level 5 — ($1/lot)</option>' +
        '</select>' +
        '<label>Jumlah lot</label>' +
        '<input type="number" id="calc-lots" min="0" step="0.01" value="1" />' +
        '<div class="calc-result" id="calc-out"></div>' +
        '<div style="margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--border)">' +
          '<div style="font-size:.78rem;font-weight:700;margin-bottom:.5rem">Ilustrasi 3 langkah</div>' +
          '<ol class="example-steps">' +
            '<li><strong>Kamu</strong> bagikan kode → <strong>Member 2</strong> daftar &amp; trade 10 lot → kamu: 10 × $15 = <strong>$150</strong></li>' +
            '<li><strong>Member 2</strong> ajak <strong>Member 3</strong> → Member 3 trade 10 lot → Member 2: $150 · kamu: 10 × $2 = <strong>$20</strong></li>' +
            '<li><strong>Member 3</strong> ajak <strong>Member 4</strong> → Member 4 trade 10 lot → kamu (L3): 10 × $1 = <strong>$10</strong></li>' +
          '</ol>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="panel network-list">' +
      '<div class="panel-head"><h2>Downline (simulasi)</h2><span class="sub">Lot &amp; komisi ke kamu · data contoh</span></div>' +
      memberRows +
    '</div>';

  function renderCalc() {
    var level = parseInt(document.getElementById('calc-level').value, 10);
    var lots = parseFloat(document.getElementById('calc-lots').value) || 0;
    var rate = COMMISSION[level] || 0;
    var you = rate * lots;
    var html = '';
    html += '<div class="calc-row"><span>Rate level ' + level + '</span><span class="amt">$' + rate + ' / lot</span></div>';
    html += '<div class="calc-row"><span>Volume</span><span class="amt">' + lots + ' lot</span></div>';
    html += '<div class="calc-row total"><span>Kamu terima</span><span class="amt">' + fmt(you) + '</span></div>';
    html += '<div style="margin-top:.85rem;font-size:.75rem;color:var(--text-dim);line-height:1.45">Distribusi total per lot (jika 5 level terisi): L1 $15 + L2 $2 + L3 $1 + L4 $1 + L5 $1 = <strong style="color:var(--text)">$20</strong>.</div>';
    document.getElementById('calc-out').innerHTML = html;
  }
  document.getElementById('calc-level').onchange = renderCalc;
  document.getElementById('calc-lots').oninput = renderCalc;
  renderCalc();

  function copyText(text, btn) {
    function ok() {
      var old = btn.textContent;
      btn.textContent = 'Tersalin ✓';
      setTimeout(function(){ btn.textContent = old; }, 1500);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok).catch(function(){ fallback(); });
    } else fallback();
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); ok(); } catch (e) {}
      document.body.removeChild(ta);
    }
  }
  document.getElementById('copy-code').onclick = function() {
    copyText(document.getElementById('ref-code').textContent, this);
  };
  document.getElementById('copy-link').onclick = function() {
    copyText(document.getElementById('ref-link').textContent, this);
  };
}
</script>
</body>
</html>
