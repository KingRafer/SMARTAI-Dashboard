<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Referral Network — Smart AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
.pyramid-wrap{
  background: linear-gradient(180deg, rgba(45,212,191,.04), transparent 40%), var(--input-bg);
  border:1px solid var(--border);
  border-radius:18px;
  padding:1.5rem 1rem 1rem;
  overflow-x:auto;
}
.pyramid-svg{
  display:block;
  width:100%;
  max-width:680px;
  height:auto;
  margin:0 auto;
}
.pyramid-svg .edge{
  stroke:#475569;
  stroke-width:3;
  stroke-linecap:round;
  fill:none;
  opacity:.65;
}
[data-theme=light] .pyramid-svg .edge{
  stroke:#94a3b8;
  opacity:.7;
}
.pyramid-svg .node-ring{
  fill:none;
  stroke:rgba(255,255,255,.12);
  stroke-width:2;
}
.pyramid-svg .node-fill{transition:filter .2s}
.pyramid-svg .node-group{cursor:default}
.pyramid-svg .node-group:hover .node-fill{filter:brightness(1.12)}
.pyramid-svg .node-group:hover .node-ring{stroke:rgba(45,212,191,.5)}
.pyramid-svg text{
  font-family:Inter,system-ui,sans-serif;
  text-anchor:middle;
  dominant-baseline:hanging;
}
.pyramid-svg .lbl{
  fill:#94a3b8;
  font-size:11px;
  font-weight:600;
}
[data-theme=light] .pyramid-svg .lbl{fill:#475569}
.pyramid-svg .lbl-root{
  fill:#2dd4bf;
  font-size:12px;
  font-weight:700;
}
[data-theme=light] .pyramid-svg .lbl-root{fill:#0d9488}
.pyramid-svg .lbl-empty{
  fill:#64748b;
  font-size:10px;
  font-weight:500;
}
.pyramid-svg .av-text{
  fill:#042f2e;
  font-size:13px;
  font-weight:700;
  text-anchor:middle;
  dominant-baseline:central;
}
.pyramid-svg .av-text.light{fill:#fff}
.pyramid-svg .av-text.sm{font-size:11px}
.pyramid-svg .av-text.empty{fill:#64748b;font-size:16px;font-weight:500}

.tree-legend{
  display:flex;flex-wrap:wrap;gap:.75rem 1.25rem;justify-content:center;
  margin-top:1rem;padding-top:.85rem;border-top:1px solid var(--border);
  font-size:.75rem;color:var(--text-muted);
}
.tree-legend span{display:flex;align-items:center;gap:.4rem}
.tree-legend i{
  width:12px;height:12px;border-radius:50%;display:inline-block;
}
.tree-legend i.root{background:linear-gradient(135deg,#2dd4bf,#14b8a6)}
.tree-legend i.l1{background:linear-gradient(135deg,#2dd4bf,#5eead4)}
.tree-legend i.l2{background:linear-gradient(135deg,#a78bfa,#7c3aed)}
.tree-legend i.l3{background:linear-gradient(135deg,#fbbf24,#d97706)}
.tree-legend i.empty{border:1.5px dashed #64748b;background:transparent;box-sizing:border-box}
</style>
<script>try{var t=localStorage.getItem('smartai_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
const user = renderShell('referral');
if (user) {
  const me = escapeHtml(user.nama || 'You');
  const shortMe = me.length > 12 ? me.slice(0, 11) + '…' : me;
  const ini = initials(user.nama || 'You');
  const refCode = (user.referral && user.referral.trim()) ? user.referral.trim().toUpperCase() : 'SMARTAI-REF';
  const refLink = location.origin + location.pathname.replace(/[^/]+$/, '') + 'register.html?ref=' + encodeURIComponent(refCode);

  /* Coordinate system: viewBox 0 0 680 420 — pure SVG for perfect alignment */
  const W = 680, H = 420;
  const nodes = [
    { id:'r',  x:340, y:48,  r:28, label: shortMe, full: me + ' (Kamu)', av: ini, level:0, empty:false },
    { id:'a',  x:190, y:130, r:24, label:'Fajar', full:'Fajar S.', av:'FS', level:1, empty:false },
    { id:'b',  x:490, y:130, r:24, label:'Maya', full:'Maya L.', av:'ML', level:1, empty:false },
    { id:'a1', x:110, y:220, r:22, label:'Tono', full:'Tono H.', av:'TH', level:2, empty:false },
    { id:'a2', x:270, y:220, r:22, label:'Nina', full:'Nina A.', av:'NA', level:2, empty:false },
    { id:'b1', x:410, y:220, r:22, label:'Dina', full:'Dina W.', av:'DW', level:2, empty:false },
    { id:'b2', x:570, y:220, r:22, label:'Rizky', full:'Rizky K.', av:'RK', level:2, empty:false },
    { id:'c1', x:70,  y:320, r:18, label:'Yoga', full:'Yoga P.', av:'YP', level:3, empty:false },
    { id:'c2', x:150, y:320, r:18, label:'Sinta', full:'Sinta A.', av:'SA', level:3, empty:false },
    { id:'c3', x:230, y:320, r:18, label:'Eko', full:'Eko H.', av:'EH', level:3, empty:false },
    { id:'c4', x:310, y:320, r:18, label:'Kosong', full:'Slot kosong', av:'+', level:3, empty:true },
    { id:'c5', x:390, y:320, r:18, label:'Bima', full:'Bima P.', av:'BP', level:3, empty:false },
    { id:'c6', x:470, y:320, r:18, label:'Kosong', full:'Slot kosong', av:'+', level:3, empty:true },
    { id:'c7', x:550, y:320, r:18, label:'Rina', full:'Rina M.', av:'RM', level:3, empty:false },
    { id:'c8', x:630, y:320, r:18, label:'Kosong', full:'Slot kosong', av:'+', level:3, empty:true }
  ];

  const edges = [
    ['r','a'],['r','b'],
    ['a','a1'],['a','a2'],
    ['b','b1'],['b','b2'],
    ['a1','c1'],['a1','c2'],
    ['a2','c3'],['a2','c4'],
    ['b1','c5'],['b1','c6'],
    ['b2','c7'],['b2','c8']
  ];

  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));

  const fills = {
    0: 'url(#gRoot)',
    1: 'url(#gL1)',
    2: 'url(#gL2)',
    3: 'url(#gL3)'
  };

  const edgeSvg = edges.map(([f, t]) => {
    const a = byId[f], b = byId[t];
    // stop at circle edge, not center — cleaner look
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    const x1 = a.x + (dx / dist) * a.r;
    const y1 = a.y + (dy / dist) * a.r;
    const x2 = b.x - (dx / dist) * b.r;
    const y2 = b.y - (dy / dist) * b.r;
    return `<line class="edge" x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;
  }).join('');

  const nodeSvg = nodes.map(n => {
    if (n.empty) {
      return `<g class="node-group" transform="translate(${n.x},${n.y})">
        <title>${escapeHtml(n.full)}</title>
        <circle class="node-fill" r="${n.r}" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="4 3"/>
        <text class="av-text empty" y="1">+</text>
        <text class="lbl-empty" y="${n.r + 10}">${escapeHtml(n.label)}</text>
      </g>`;
    }
    const fill = fills[n.level] || fills[3];
    const avClass = n.level === 2 ? 'av-text light' : (n.level === 3 ? 'av-text sm' : 'av-text');
    const lblClass = n.level === 0 ? 'lbl-root' : 'lbl';
    return `<g class="node-group" transform="translate(${n.x},${n.y})">
      <title>${escapeHtml(n.full)}</title>
      <circle class="node-fill" r="${n.r}" fill="${fill}"/>
      <circle class="node-ring" r="${n.r}"/>
      <text class="${avClass}" y="1">${escapeHtml(n.av)}</text>
      <text class="${lblClass}" y="${n.r + 10}">${escapeHtml(n.label)}</text>
    </g>`;
  }).join('');

  const matrixNames = [
    'Fajar S.','Maya L.','Rizky K.','Andi R.','Sari W.',
    'Tono H.','Nina A.','Dina W.','Bima P.','Yoga P.',
    'Sinta A.','Eko H.','Rina M.',null,null,
    null,null,null,null,null,
    null,null,null,null,null
  ];
  const matrixCells = matrixNames.map((name, i) => {
    if (!name) return `<div class="matrix-cell empty" style="animation-delay:${i * 0.02}s"></div>`;
    const av = name.split(/\s+/).map(p => p[0]).slice(0, 2).join('').toUpperCase();
    return `<div class="matrix-cell filled" style="animation-delay:${i * 0.02}s" title="${escapeHtml(name)}">
      <div class="mc-av">${av}</div>
      <div class="mc-name">${escapeHtml(name.split(' ')[0])}</div>
    </div>`;
  }).join('');

  document.getElementById('page-content').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="label">Total Network</div><div class="value">34</div><div class="hint">Semua level</div></div>
      <div class="stat-card"><div class="label">Matrix filled</div><div class="value">13/25</div><div class="hint">5 × 5 seats</div></div>
      <div class="stat-card"><div class="label">Level 1</div><div class="value">2</div><div class="hint">Direct binary</div></div>
      <div class="stat-card"><div class="label">Open slots</div><div class="value">3</div><div class="hint">Di pohon</div></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Bagikan referral</h2>
        <span class="sub">Salin kode atau link</span>
      </div>
      <div class="ref-share">
        <div class="ref-field">
          <div class="rf-label">Kode referral</div>
          <div class="rf-row">
            <span class="rf-value code" id="ref-code">${escapeHtml(refCode)}</span>
            <button type="button" class="btn-copy" id="copy-code">Salin kode</button>
          </div>
        </div>
        <div class="ref-field">
          <div class="rf-label">Link referral</div>
          <div class="rf-row">
            <span class="rf-value" id="ref-link">${escapeHtml(refLink)}</span>
            <button type="button" class="btn-copy" id="copy-link">Salin link</button>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Pohon Jaringan</h2>
        <span class="sub">Binary · profesional</span>
      </div>
      <div class="pyramid-wrap">
        <svg class="pyramid-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pohon referral binary">
          <defs>
            <linearGradient id="gRoot" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#2dd4bf"/>
              <stop offset="100%" stop-color="#0d9488"/>
            </linearGradient>
            <linearGradient id="gL1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#5eead4"/>
              <stop offset="100%" stop-color="#14b8a6"/>
            </linearGradient>
            <linearGradient id="gL2" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#c4b5fd"/>
              <stop offset="100%" stop-color="#7c3aed"/>
            </linearGradient>
            <linearGradient id="gL3" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fcd34d"/>
              <stop offset="100%" stop-color="#d97706"/>
            </linearGradient>
          </defs>
          ${edgeSvg}
          ${nodeSvg}
        </svg>
        <div class="tree-legend">
          <span><i class="root"></i> Anda (Root)</span>
          <span><i class="l1"></i> Level 1</span>
          <span><i class="l2"></i> Level 2</span>
          <span><i class="l3"></i> Level 3</span>
          <span><i class="empty"></i> Slot kosong</span>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Matrix Level 5 × 5</h2>
        <span class="sub">25 posisi · 13 terisi · 12 kosong</span>
      </div>
      <div class="matrix-wrap">
        <div class="matrix-5x5">${matrixCells}</div>
      </div>
      <div class="matrix-legend">
        <span><i class="f"></i> Terisi</span>
        <span><i class="e"></i> Slot kosong</span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Daftar jaringan</h2><span class="sub">Data demo</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nama</th><th>Level</th><th>Posisi</th><th>Status</th></tr></thead>
          <tbody>
            <tr><td>Fajar S.</td><td>L1</td><td>Kiri</td><td><span class="badge ok">Active</span></td></tr>
            <tr><td>Maya L.</td><td>L1</td><td>Kanan</td><td><span class="badge ok">Active</span></td></tr>
            <tr><td>Tono H.</td><td>L2</td><td>L-L</td><td><span class="badge ok">Active</span></td></tr>
            <tr><td>Nina A.</td><td>L2</td><td>L-R</td><td><span class="badge warn">Pending</span></td></tr>
            <tr><td>Yoga P.</td><td>L3</td><td>—</td><td><span class="badge ok">Active</span></td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="copy-toast" id="copy-toast">Disalin!</div>
  `;

  function showToast(msg) {
    const t = document.getElementById('copy-toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  function copyText(text, btn) {
    function ok() {
      btn.classList.add('copied');
      const old = btn.textContent;
      btn.textContent = 'Tersalin ✓';
      showToast('Berhasil disalin ke clipboard');
      setTimeout(() => { btn.classList.remove('copied'); btn.textContent = old; }, 1600);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok).catch(fallback);
    } else fallback();
    function fallback() {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      ok();
    }
  }

  document.getElementById('copy-code').addEventListener('click', function () { copyText(refCode, this); });
  document.getElementById('copy-link').addEventListener('click', function () { copyText(refLink, this); });
}
</script>
</body>
</html>
