<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Referral Network — Smart AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
.pyramid-wrap{
  background:var(--input-bg);
  border:1px solid var(--border);
  border-radius:16px;
  padding:1.5rem 1rem 2rem;
  overflow-x:auto;
}
.pyramid{
  position:relative;
  width:100%;
  max-width:720px;
  margin:0 auto;
  min-height:420px;
}
.pyramid svg.lines{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:0;
}
.pyramid svg.lines line{
  stroke:rgba(100,116,139,.7);
  stroke-width:4;
  stroke-linecap:round;
}
[data-theme=light] .pyramid svg.lines line{stroke:rgba(71,85,105,.45)}
.py-node{
  position:absolute;
  z-index:1;
  transform:translate(-50%,-50%);
  text-align:center;
  cursor:default;
  animation:scaleIn .5s cubic-bezier(.22,1,.36,1) both;
}
.py-circle{
  width:52px;height:52px;border-radius:50%;
  margin:0 auto;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.85rem;color:#042f2e;
  background:linear-gradient(145deg,#94a3b8,#cbd5e1);
  box-shadow:0 6px 18px rgba(0,0,0,.25);
  border:3px solid rgba(255,255,255,.15);
  transition:transform .25s,box-shadow .25s;
}
.py-node:hover .py-circle{
  transform:scale(1.12);
  box-shadow:0 10px 28px var(--glow);
}
.py-node.root .py-circle{
  width:60px;height:60px;font-size:.95rem;
  background:linear-gradient(145deg,var(--cyan),var(--teal));
  color:#042f2e;
  border-color:rgba(45,212,191,.5);
}
.py-node.filled .py-circle{
  background:linear-gradient(145deg,var(--cyan),#5eead4);
}
.py-node.l2 .py-circle{background:linear-gradient(145deg,#a78bfa,#818cf8);color:#fff}
.py-node.l3 .py-circle{background:linear-gradient(145deg,#fbbf24,#f59e0b);color:#422006}
.py-node.empty .py-circle{
  background:transparent;
  border:2px dashed var(--border);
  color:var(--text-dim);
  box-shadow:none;
  font-size:1.2rem;font-weight:500;
}
.py-label{
  margin-top:.35rem;
  font-size:.68rem;
  font-weight:600;
  color:var(--text-muted);
  white-space:nowrap;
  max-width:90px;
  overflow:hidden;
  text-overflow:ellipsis;
}
.py-node.root .py-label{color:var(--cyan);font-size:.75rem}
</style>
<script>try{var t=localStorage.getItem('smartai_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
const user = renderShell('referral');
if (user) {
  const me = escapeHtml(user.nama || 'You');
  const ini = initials(user.nama || 'You');
  const refCode = (user.referral && user.referral.trim()) ? user.referral.trim().toUpperCase() : 'SMARTAI-REF';
  const refLink = location.origin + location.pathname.replace(/[^/]+$/, '') + 'register.html?ref=' + encodeURIComponent(refCode);

  /* Binary pyramid positions (% of container) — classic 1-2-4-8 layout */
  const nodes = [
    { id: 'r',  x: 50, y: 10, label: me, av: ini, cls: 'root', delay: 0 },
    { id: 'a',  x: 28, y: 32, label: 'Fajar S.', av: 'FS', cls: 'filled', delay: 0.05 },
    { id: 'b',  x: 72, y: 32, label: 'Maya L.', av: 'ML', cls: 'filled', delay: 0.08 },
    { id: 'a1', x: 16, y: 54, label: 'Tono H.', av: 'TH', cls: 'l2', delay: 0.12 },
    { id: 'a2', x: 40, y: 54, label: 'Nina A.', av: 'NA', cls: 'l2', delay: 0.15 },
    { id: 'b1', x: 60, y: 54, label: 'Dina W.', av: 'DW', cls: 'l2', delay: 0.18 },
    { id: 'b2', x: 84, y: 54, label: 'Rizky K.', av: 'RK', cls: 'l2', delay: 0.2 },
    { id: 'c1', x: 10, y: 78, label: 'Yoga P.', av: 'YP', cls: 'l3', delay: 0.24 },
    { id: 'c2', x: 22, y: 78, label: 'Sinta A.', av: 'SA', cls: 'l3', delay: 0.26 },
    { id: 'c3', x: 34, y: 78, label: 'Eko H.', av: 'EH', cls: 'l3', delay: 0.28 },
    { id: 'c4', x: 46, y: 78, label: '+', av: '+', cls: 'empty', delay: 0.3 },
    { id: 'c5', x: 58, y: 78, label: 'Bima P.', av: 'BP', cls: 'l3', delay: 0.32 },
    { id: 'c6', x: 70, y: 78, label: '+', av: '+', cls: 'empty', delay: 0.34 },
    { id: 'c7', x: 82, y: 78, label: 'Rina M.', av: 'RM', cls: 'l3', delay: 0.36 },
    { id: 'c8', x: 94, y: 78, label: '+', av: '+', cls: 'empty', delay: 0.38 }
  ];

  /* Edges: parent -> child (binary) */
  const edges = [
    ['r','a'],['r','b'],
    ['a','a1'],['a','a2'],
    ['b','b1'],['b','b2'],
    ['a1','c1'],['a1','c2'],
    ['a2','c3'],['a2','c4'],
    ['b1','c5'],['b1','c6'],
    ['b2','c7'],['b2','c8']
  ];

  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  const lines = edges.map(([from, to]) => {
    const a = byId[from], b = byId[to];
    return `<line x1="${a.x}%" y1="${a.y}%" x2="${b.x}%" y2="${b.y}%"/>`;
  }).join('');

  const nodeHtml = nodes.map(n => `
    <div class="py-node ${n.cls}" style="left:${n.x}%;top:${n.y}%;animation-delay:${n.delay}s" title="${n.label}">
      <div class="py-circle">${n.av}</div>
      <div class="py-label">${n.label === me ? n.label + ' (Kamu)' : n.label}</div>
    </div>`).join('');

  const matrixNames = [
    'Fajar S.','Maya L.','Rizky K.','Andi R.','Sari W.',
    'Tono H.','Nina A.','Dina W.','Bima P.','Yoga P.',
    'Sinta A.','Eko H.','Rina M.',null,null,
    null,null,null,null,null,
    null,null,null,null,null
  ];
  const matrixCells = matrixNames.map((name, i) => {
    if (!name) return `<div class="matrix-cell empty" style="animation-delay:${i * 0.02}s"></div>`;
    const av = name.split(/\s+/).map(p => p[0]).slice(0, 2).join('').toUpperCase();
    return `<div class="matrix-cell filled" style="animation-delay:${i * 0.02}s" title="${escapeHtml(name)}">
      <div class="mc-av">${av}</div>
      <div class="mc-name">${escapeHtml(name.split(' ')[0])}</div>
    </div>`;
  }).join('');

  document.getElementById('page-content').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="label">Total Network</div><div class="value">34</div><div class="hint">Semua level</div></div>
      <div class="stat-card"><div class="label">Matrix filled</div><div class="value">13/25</div><div class="hint">5 × 5 seats</div></div>
      <div class="stat-card"><div class="label">Level 1</div><div class="value">2</div><div class="hint">Direct binary</div></div>
      <div class="stat-card"><div class="label">Open slots</div><div class="value">3</div><div class="hint">Di pohon</div></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Bagikan referral</h2>
        <span class="sub">Salin kode atau link</span>
      </div>
      <div class="ref-share">
        <div class="ref-field">
          <div class="rf-label">Kode referral</div>
          <div class="rf-row">
            <span class="rf-value code" id="ref-code">${escapeHtml(refCode)}</span>
            <button type="button" class="btn-copy" id="copy-code">Salin kode</button>
          </div>
        </div>
        <div class="ref-field">
          <div class="rf-label">Link referral</div>
          <div class="rf-row">
            <span class="rf-value" id="ref-link">${escapeHtml(refLink)}</span>
            <button type="button" class="btn-copy" id="copy-link">Salin link</button>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Pohon Jaringan</h2>
        <span class="sub">Binary pyramid · root → kiri & kanan</span>
      </div>
      <div class="pyramid-wrap">
        <div class="pyramid">
          <svg class="lines" viewBox="0 0 100 100" preserveAspectRatio="none">${lines}</svg>
          ${nodeHtml}
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Matrix Level 5 × 5</h2>
        <span class="sub">25 posisi · 13 terisi · 12 kosong</span>
      </div>
      <div class="matrix-wrap">
        <div class="matrix-5x5">${matrixCells}</div>
      </div>
      <div class="matrix-legend">
        <span><i class="f"></i> Terisi</span>
        <span><i class="e"></i> Slot kosong</span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Daftar jaringan</h2><span class="sub">Data demo</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nama</th><th>Level</th><th>Posisi</th><th>Status</th></tr></thead>
          <tbody>
            <tr><td>Fajar S.</td><td>L1</td><td>Kiri</td><td><span class="badge ok">Active</span></td></tr>
            <tr><td>Maya L.</td><td>L1</td><td>Kanan</td><td><span class="badge ok">Active</span></td></tr>
            <tr><td>Tono H.</td><td>L2</td><td>L-L</td><td><span class="badge ok">Active</span></td></tr>
            <tr><td>Nina A.</td><td>L2</td><td>L-R</td><td><span class="badge warn">Pending</span></td></tr>
            <tr><td>Yoga P.</td><td>L3</td><td>—</td><td><span class="badge ok">Active</span></td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="copy-toast" id="copy-toast">Disalin!</div>
  `;

  function showToast(msg) {
    const t = document.getElementById('copy-toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  function copyText(text, btn) {
    function ok() {
      btn.classList.add('copied');
      const old = btn.textContent;
      btn.textContent = 'Tersalin ✓';
      showToast('Berhasil disalin ke clipboard');
      setTimeout(() => { btn.classList.remove('copied'); btn.textContent = old; }, 1600);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok).catch(fallback);
    } else fallback();
    function fallback() {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      ok();
    }
  }

  document.getElementById('copy-code').addEventListener('click', function () { copyText(refCode, this); });
  document.getElementById('copy-link').addEventListener('click', function () { copyText(refLink, this); });
}
</script>
</body>
</html>
