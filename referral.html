<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Referral Network — Smart AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
.pyramid-wrap{
  background:var(--input-bg);
  border:1px solid var(--border);
  border-radius:16px;
  padding:1.75rem 1rem 1.25rem;
  overflow-x:auto;
}
.pyramid{
  position:relative;
  width:min(100%, 640px);
  margin:0 auto;
  /* fixed ratio so SVG % lines match nodes */
  aspect-ratio: 16 / 11;
  min-height: 360px;
}
.pyramid svg.lines{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:0;
}
.pyramid svg.lines line{
  stroke:#64748b;
  stroke-width:3.5;
  stroke-linecap:round;
  opacity:.75;
}
[data-theme=light] .pyramid svg.lines line{
  stroke:#475569;
  opacity:.5;
}
.py-node{
  position:absolute;
  z-index:1;
  transform:translate(-50%,-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  width:72px;
  animation:scaleIn .45s cubic-bezier(.22,1,.36,1) both;
}
.py-circle{
  width:44px;
  height:44px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:.78rem;
  color:#0f172a;
  background:#94a3b8;
  box-shadow:0 4px 14px rgba(0,0,0,.2);
  border:2.5px solid rgba(255,255,255,.12);
  transition:transform .2s, box-shadow .2s;
  flex-shrink:0;
}
.py-node:hover .py-circle{
  transform:scale(1.1);
  box-shadow:0 8px 22px var(--glow);
}
.py-node.root .py-circle{
  width:52px;
  height:52px;
  font-size:.88rem;
  background:linear-gradient(145deg,var(--cyan),var(--teal));
  color:#042f2e;
  border-color:rgba(45,212,191,.45);
}
.py-node.l1 .py-circle{
  background:linear-gradient(145deg,#2dd4bf,#14b8a6);
  color:#042f2e;
}
.py-node.l2 .py-circle{
  background:linear-gradient(145deg,#a78bfa,#7c3aed);
  color:#fff;
}
.py-node.l3 .py-circle{
  background:linear-gradient(145deg,#fbbf24,#d97706);
  color:#422006;
  width:38px;
  height:38px;
  font-size:.7rem;
}
.py-node.empty .py-circle{
  background:transparent;
  border:2px dashed #475569;
  color:#64748b;
  box-shadow:none;
  font-size:1rem;
  font-weight:500;
}
[data-theme=light] .py-node.empty .py-circle{
  border-color:#94a3b8;
  color:#94a3b8;
}
.py-label{
  margin-top:6px;
  font-size:11px;
  font-weight:600;
  color:var(--text-muted);
  text-align:center;
  line-height:1.2;
  max-width:72px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.py-node.root .py-label{
  color:var(--cyan);
  font-size:12px;
}
.py-node.l3 .py-label,
.py-node.empty .py-label{
  font-size:10px;
  max-width:64px;
}
.py-node.empty .py-label{color:var(--text-dim);font-weight:500}
</style>
<script>try{var t=localStorage.getItem('smartai_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
const user = renderShell('referral');
if (user) {
  const me = escapeHtml(user.nama || 'You');
  const shortMe = me.length > 10 ? me.slice(0, 9) + '…' : me;
  const ini = initials(user.nama || 'You');
  const refCode = (user.referral && user.referral.trim()) ? user.referral.trim().toUpperCase() : 'SMARTAI-REF';
  const refLink = location.origin + location.pathname.replace(/[^/]+$/, '') + 'register.html?ref=' + encodeURIComponent(refCode);

  /* Even binary grid:
     L0: 50
     L1: 25 / 75
     L2: 12.5 / 37.5 / 62.5 / 87.5
     L3: 6.25 … step 12.5
     Y: 14, 36, 58, 82  (room for labels)
  */
  const nodes = [
    { id:'r',  x:50,    y:14, label: shortMe, full: me + ' (Kamu)', av: ini, cls:'root', delay:0 },
    { id:'a',  x:25,    y:36, label:'Fajar', full:'Fajar S.', av:'FS', cls:'l1', delay:0.05 },
    { id:'b',  x:75,    y:36, label:'Maya', full:'Maya L.', av:'ML', cls:'l1', delay:0.08 },
    { id:'a1', x:12.5,  y:58, label:'Tono', full:'Tono H.', av:'TH', cls:'l2', delay:0.12 },
    { id:'a2', x:37.5,  y:58, label:'Nina', full:'Nina A.', av:'NA', cls:'l2', delay:0.14 },
    { id:'b1', x:62.5,  y:58, label:'Dina', full:'Dina W.', av:'DW', cls:'l2', delay:0.16 },
    { id:'b2', x:87.5,  y:58, label:'Rizky', full:'Rizky K.', av:'RK', cls:'l2', delay:0.18 },
    { id:'c1', x:6.25,  y:82, label:'Yoga', full:'Yoga P.', av:'YP', cls:'l3', delay:0.22 },
    { id:'c2', x:18.75, y:82, label:'Sinta', full:'Sinta A.', av:'SA', cls:'l3', delay:0.24 },
    { id:'c3', x:31.25, y:82, label:'Eko', full:'Eko H.', av:'EH', cls:'l3', delay:0.26 },
    { id:'c4', x:43.75, y:82, label:'Kosong', full:'Slot kosong', av:'+', cls:'empty', delay:0.28 },
    { id:'c5', x:56.25, y:82, label:'Bima', full:'Bima P.', av:'BP', cls:'l3', delay:0.3 },
    { id:'c6', x:68.75, y:82, label:'Kosong', full:'Slot kosong', av:'+', cls:'empty', delay:0.32 },
    { id:'c7', x:81.25, y:82, label:'Rina', full:'Rina M.', av:'RM', cls:'l3', delay:0.34 },
    { id:'c8', x:93.75, y:82, label:'Kosong', full:'Slot kosong', av:'+', cls:'empty', delay:0.36 }
  ];

  const edges = [
    ['r','a'],['r','b'],
    ['a','a1'],['a','a2'],
    ['b','b1'],['b','b2'],
    ['a1','c1'],['a1','c2'],
    ['a2','c3'],['a2','c4'],
    ['b1','c5'],['b1','c6'],
    ['b2','c7'],['b2','c8']
  ];

  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  // Lines connect circle centers (node position = circle center)
  const lines = edges.map(([f, t]) => {
    const a = byId[f], b = byId[t];
    return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`;
  }).join('');

  const nodeHtml = nodes.map(n => `
    <div class="py-node ${n.cls}" style="left:${n.x}%;top:${n.y}%;animation-delay:${n.delay}s" title="${escapeHtml(n.full)}">
      <div class="py-circle">${n.av}</div>
      <div class="py-label">${escapeHtml(n.label)}</div>
    </div>`).join('');

  const matrixNames = [
    'Fajar S.','Maya L.','Rizky K.','Andi R.','Sari W.',
    'Tono H.','Nina A.','Dina W.','Bima P.','Yoga P.',
    'Sinta A.','Eko H.','Rina M.',null,null,
    null,null,null,null,null,
    null,null,null,null,null
  ];
  const matrixCells = matrixNames.map((name, i) => {
    if (!name) return `<div class="matrix-cell empty" style="animation-delay:${i * 0.02}s"></div>`;
    const av = name.split(/\s+/).map(p => p[0]).slice(0, 2).join('').toUpperCase();
    return `<div class="matrix-cell filled" style="animation-delay:${i * 0.02}s" title="${escapeHtml(name)}">
      <div class="mc-av">${av}</div>
      <div class="mc-name">${escapeHtml(name.split(' ')[0])}</div>
    </div>`;
  }).join('');

  document.getElementById('page-content').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="label">Total Network</div><div class="value">34</div><div class="hint">Semua level</div></div>
      <div class="stat-card"><div class="label">Matrix filled</div><div class="value">13/25</div><div class="hint">5 × 5 seats</div></div>
      <div class="stat-card"><div class="label">Level 1</div><div class="value">2</div><div class="hint">Direct binary</div></div>
      <div class="stat-card"><div class="label">Open slots</div><div class="value">3</div><div class="hint">Di pohon</div></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Bagikan referral</h2>
        <span class="sub">Salin kode atau link</span>
      </div>
      <div class="ref-share">
        <div class="ref-field">
          <div class="rf-label">Kode referral</div>
          <div class="rf-row">
            <span class="rf-value code" id="ref-code">${escapeHtml(refCode)}</span>
            <button type="button" class="btn-copy" id="copy-code">Salin kode</button>
          </div>
        </div>
        <div class="ref-field">
          <div class="rf-label">Link referral</div>
          <div class="rf-row">
            <span class="rf-value" id="ref-link">${escapeHtml(refLink)}</span>
            <button type="button" class="btn-copy" id="copy-link">Salin link</button>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Pohon Jaringan</h2>
        <span class="sub">Binary · rapi & simetris</span>
      </div>
      <div class="pyramid-wrap">
        <div class="pyramid">
          <svg class="lines" viewBox="0 0 100 100" preserveAspectRatio="none">${lines}</svg>
          ${nodeHtml}
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Matrix Level 5 × 5</h2>
        <span class="sub">25 posisi · 13 terisi · 12 kosong</span>
      </div>
      <div class="matrix-wrap">
        <div class="matrix-5x5">${matrixCells}</div>
      </div>
      <div class="matrix-legend">
        <span><i class="f"></i> Terisi</span>
        <span><i class="e"></i> Slot kosong</span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Daftar jaringan</h2><span class="sub">Data demo</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nama</th><th>Level</th><th>Posisi</th><th>Status</th></tr></thead>
          <tbody>
            <tr><td>Fajar S.</td><td>L1</td><td>Kiri</td><td><span class="badge ok">Active</span></td></tr>
            <tr><td>Maya L.</td><td>L1</td><td>Kanan</td><td><span class="badge ok">Active</span></td></tr>
            <tr><td>Tono H.</td><td>L2</td><td>L-L</td><td><span class="badge ok">Active</span></td></tr>
            <tr><td>Nina A.</td><td>L2</td><td>L-R</td><td><span class="badge warn">Pending</span></td></tr>
            <tr><td>Yoga P.</td><td>L3</td><td>—</td><td><span class="badge ok">Active</span></td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="copy-toast" id="copy-toast">Disalin!</div>
  `;

  function showToast(msg) {
    const t = document.getElementById('copy-toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  function copyText(text, btn) {
    function ok() {
      btn.classList.add('copied');
      const old = btn.textContent;
      btn.textContent = 'Tersalin ✓';
      showToast('Berhasil disalin ke clipboard');
      setTimeout(() => { btn.classList.remove('copied'); btn.textContent = old; }, 1600);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok).catch(fallback);
    } else fallback();
    function fallback() {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      ok();
    }
  }

  document.getElementById('copy-code').addEventListener('click', function () { copyText(refCode, this); });
  document.getElementById('copy-link').addEventListener('click', function () { copyText(refLink, this); });
}
</script>
</body>
</html>
