<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Referral Network — Smart AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<style>
/* Hierarchical tree (Glowness-style) */
.tree-panel{
  background:var(--input-bg);
  border:1px solid var(--border);
  border-radius:16px;
  padding:1.5rem 1.25rem 1.75rem;
  overflow-x:auto;
}
.tree{
  list-style:none;
  margin:0;
  padding:0;
  min-width:280px;
}
.tree ul{
  list-style:none;
  margin:0;
  padding:0 0 0 1.35rem;
  position:relative;
}
/* vertical line of parent branch */
.tree ul::before{
  content:'';
  position:absolute;
  left:0.55rem;
  top:0;
  bottom:1.1rem;
  width:2px;
  background:linear-gradient(180deg,rgba(45,212,191,.45),rgba(45,212,191,.12));
  border-radius:2px;
}
.tree li{
  position:relative;
  margin:0;
  padding:.45rem 0 .45rem 0;
}
/* horizontal connector to node */
.tree li::before{
  content:'';
  position:absolute;
  left:-0.8rem;
  top:1.55rem;
  width:1.1rem;
  height:2px;
  background:rgba(45,212,191,.35);
}
.tree > li::before{display:none}
.tree > li > ul::before{left:0.55rem}

.t-node{
  display:inline-flex;
  align-items:center;
  gap:.75rem;
  background:var(--bg-card-solid);
  border:1px solid var(--border);
  border-radius:14px;
  padding:.55rem .9rem .55rem .55rem;
  min-width:200px;
  max-width:320px;
  box-shadow:0 6px 20px rgba(0,0,0,.12);
  transition:transform .2s,border-color .2s,box-shadow .2s;
  animation:fadeUp .45s cubic-bezier(.22,1,.36,1) both;
}
.t-node:hover{
  transform:translateX(4px);
  border-color:rgba(45,212,191,.4);
  box-shadow:0 8px 24px var(--glow);
}
.t-node.root{
  background:linear-gradient(135deg,rgba(45,212,191,.18),var(--bg-card-solid));
  border-color:rgba(45,212,191,.4);
}
.t-node.empty{
  border-style:dashed;
  opacity:.85;
  background:transparent;
}
.t-node.empty:hover{opacity:1;border-color:var(--cyan)}
.t-av{
  width:40px;height:40px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.85rem;color:#fff;
  background:linear-gradient(135deg,#2dd4bf,#14b8a6);
}
.t-node.root .t-av{background:linear-gradient(135deg,#2dd4bf,#0d9488)}
.t-node.l1 .t-av{background:linear-gradient(135deg,#a78bfa,#818cf8)}
.t-node.l2 .t-av{background:linear-gradient(135deg,#f472b6,#c084fc)}
.t-node.l3 .t-av{background:linear-gradient(135deg,#fbbf24,#f59e0b)}
.t-node.l4 .t-av{background:linear-gradient(135deg,#60a5fa,#38bdf8)}
.t-node.l5 .t-av{background:linear-gradient(135deg,#fb7185,#f43f5e)}
.t-node.empty .t-av{
  background:transparent;border:1px dashed var(--border);color:var(--text-dim);font-size:1.1rem
}
.t-meta{min-width:0}
.t-name{font-size:.9rem;font-weight:600;color:var(--text);line-height:1.25}
.t-name span{color:var(--text-muted);font-weight:500;font-size:.8rem}
.t-sub{font-size:.72rem;color:var(--text-dim);margin-top:.15rem;line-height:1.3}
.t-code{font-family:ui-monospace,monospace;letter-spacing:.03em;opacity:.9}
</style>
<script>try{var t=localStorage.getItem('smartai_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
const user = renderShell('referral');
if (user) {
  const me = escapeHtml(user.nama || 'You');
  const ini = initials(user.nama || 'You');
  const refCode = (user.referral && user.referral.trim()) ? user.referral.trim().toUpperCase() : 'SMARTAI-REF';
  const refLink = location.origin + location.pathname.replace(/[^/]+$/, '') + 'register.html?ref=' + encodeURIComponent(refCode);

  const matrixNames = [
    'Fajar S.','Maya L.','Rizky K.','Andi R.','Sari W.',
    'Tono H.','Nina A.','Dina W.','Bima P.','Yoga P.',
    'Sinta A.','Eko H.','Rina M.',null,null,
    null,null,null,null,null,
    null,null,null,null,null
  ];
  const matrixCells = matrixNames.map((name, i) => {
    if (!name) {
      return `<div class="matrix-cell empty" style="animation-delay:${i * 0.02}s" title="Slot kosong"></div>`;
    }
    const av = name.split(/\s+/).map(p => p[0]).slice(0, 2).join('').toUpperCase();
    return `<div class="matrix-cell filled" style="animation-delay:${i * 0.02}s" title="${escapeHtml(name)}">
      <div class="mc-av">${av}</div>
      <div class="mc-name">${escapeHtml(name.split(' ')[0])}</div>
    </div>`;
  }).join('');

  document.getElementById('page-content').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="label">Total Network</div><div class="value">34</div><div class="hint">Semua level</div></div>
      <div class="stat-card"><div class="label">Matrix filled</div><div class="value">13/25</div><div class="hint">5 × 5 seats</div></div>
      <div class="stat-card"><div class="label">Level 1</div><div class="value">5</div><div class="hint">Direct</div></div>
      <div class="stat-card"><div class="label">Open slots</div><div class="value">12</div><div class="hint">Siap diisi</div></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Bagikan referral</h2>
        <span class="sub">Salin kode atau link</span>
      </div>
      <div class="ref-share">
        <div class="ref-field">
          <div class="rf-label">Kode referral</div>
          <div class="rf-row">
            <span class="rf-value code" id="ref-code">${escapeHtml(refCode)}</span>
            <button type="button" class="btn-copy" id="copy-code">Salin kode</button>
          </div>
        </div>
        <div class="ref-field">
          <div class="rf-label">Link referral</div>
          <div class="rf-row">
            <span class="rf-value" id="ref-link">${escapeHtml(refLink)}</span>
            <button type="button" class="btn-copy" id="copy-link">Salin link</button>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Pohon Jaringan</h2>
        <span class="sub">Cabang tersusun ke bawah</span>
      </div>
      <div class="tree-panel">
        <ul class="tree">
          <li>
            <div class="t-node root">
              <div class="t-av">${ini}</div>
              <div class="t-meta">
                <div class="t-name">${me} <span>(Kamu)</span></div>
                <div class="t-sub t-code">${escapeHtml(refCode)}</div>
              </div>
            </div>
            <ul>
              <li>
                <div class="t-node l1" style="animation-delay:.05s">
                  <div class="t-av">FS</div>
                  <div class="t-meta">
                    <div class="t-name">Fajar S.</div>
                    <div class="t-sub">Level 1 · FAJAR01 · 2 di bawahnya</div>
                  </div>
                </div>
                <ul>
                  <li>
                    <div class="t-node l2" style="animation-delay:.1s">
                      <div class="t-av">TH</div>
                      <div class="t-meta">
                        <div class="t-name">Tono H.</div>
                        <div class="t-sub">Level 2 · TONO88 · 1 di bawahnya</div>
                      </div>
                    </div>
                    <ul>
                      <li>
                        <div class="t-node l3" style="animation-delay:.15s">
                          <div class="t-av">YP</div>
                          <div class="t-meta">
                            <div class="t-name">Yoga P.</div>
                            <div class="t-sub">Level 3 · YOGA12 · 0 di bawahnya</div>
                          </div>
                        </div>
                      </li>
                      <li>
                        <div class="t-node empty" style="animation-delay:.18s">
                          <div class="t-av">+</div>
                          <div class="t-meta">
                            <div class="t-name">Slot kosong</div>
                            <div class="t-sub">Ajak mitra baru dengan kodemu</div>
                          </div>
                        </div>
                      </li>
                    </ul>
                  </li>
                  <li>
                    <div class="t-node l2" style="animation-delay:.12s">
                      <div class="t-av">NA</div>
                      <div class="t-meta">
                        <div class="t-name">Nina A.</div>
                        <div class="t-sub">Level 2 · NINA07 · 0 di bawahnya</div>
                      </div>
                    </div>
                  </li>
                </ul>
              </li>
              <li>
                <div class="t-node l1" style="animation-delay:.08s">
                  <div class="t-av">ML</div>
                  <div class="t-meta">
                    <div class="t-name">Maya L.</div>
                    <div class="t-sub">Level 1 · MAYA22 · 1 di bawahnya</div>
                  </div>
                </div>
                <ul>
                  <li>
                    <div class="t-node l2" style="animation-delay:.14s">
                      <div class="t-av">SA</div>
                      <div class="t-meta">
                        <div class="t-name">Sinta A.</div>
                        <div class="t-sub">Level 2 · SINTA5 · 0 di bawahnya</div>
                      </div>
                    </div>
                  </li>
                  <li>
                    <div class="t-node empty" style="animation-delay:.16s">
                      <div class="t-av">+</div>
                      <div class="t-meta">
                        <div class="t-name">Slot kosong</div>
                        <div class="t-sub">Ajak mitra baru dengan kodemu</div>
                      </div>
                    </div>
                  </li>
                </ul>
              </li>
              <li>
                <div class="t-node l1" style="animation-delay:.1s">
                  <div class="t-av">RK</div>
                  <div class="t-meta">
                    <div class="t-name">Rizky K.</div>
                    <div class="t-sub">Level 1 · RIZKY9 · 0 di bawahnya</div>
                  </div>
                </div>
              </li>
              <li>
                <div class="t-node empty" style="animation-delay:.12s">
                  <div class="t-av">+</div>
                  <div class="t-meta">
                    <div class="t-name">Slot kosong</div>
                    <div class="t-sub">Ajak mitra baru dengan kodemu</div>
                  </div>
                </div>
              </li>
              <li>
                <div class="t-node empty" style="animation-delay:.14s">
                  <div class="t-av">+</div>
                  <div class="t-meta">
                    <div class="t-name">Slot kosong</div>
                    <div class="t-sub">Ajak mitra baru dengan kodemu</div>
                  </div>
                </div>
              </li>
            </ul>
          </li>
        </ul>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Matrix Level 5 × 5</h2>
        <span class="sub">25 posisi · 13 terisi · 12 kosong</span>
      </div>
      <div class="matrix-wrap">
        <div class="matrix-5x5">${matrixCells}</div>
      </div>
      <div class="matrix-legend">
        <span><i class="f"></i> Terisi</span>
        <span><i class="e"></i> Slot kosong</span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Daftar jaringan</h2><span class="sub">Data demo</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nama</th><th>Level</th><th>Join</th><th>Status</th></tr></thead>
          <tbody>
            <tr><td>Fajar S.</td><td>L1</td><td>02 Oct 2026</td><td><span class="badge ok">Active</span></td></tr>
            <tr><td>Maya L.</td><td>L1</td><td>10 Oct 2026</td><td><span class="badge ok">Active</span></td></tr>
            <tr><td>Tono H.</td><td>L2</td><td>18 Oct 2026</td><td><span class="badge ok">Active</span></td></tr>
            <tr><td>Nina A.</td><td>L2</td><td>01 Nov 2026</td><td><span class="badge warn">Pending</span></td></tr>
            <tr><td>Yoga P.</td><td>L3</td><td>05 Nov 2026</td><td><span class="badge ok">Active</span></td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="copy-toast" id="copy-toast">Disalin!</div>
  `;

  function showToast(msg) {
    const t = document.getElementById('copy-toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  function copyText(text, btn) {
    function ok() {
      btn.classList.add('copied');
      const old = btn.textContent;
      btn.textContent = 'Tersalin ✓';
      showToast('Berhasil disalin ke clipboard');
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.textContent = old;
      }, 1600);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok).catch(fallback);
    } else fallback();
    function fallback() {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      ok();
    }
  }

  document.getElementById('copy-code').addEventListener('click', function () {
    copyText(refCode, this);
  });
  document.getElementById('copy-link').addEventListener('click', function () {
    copyText(refLink, this);
  });
}
</script>
</body>
</html>
