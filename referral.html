<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache"/>
<title>Referral Network — Smart AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=20261116d">
<style>
.pyramid-wrap{
  background: linear-gradient(180deg, rgba(45,212,191,.04), transparent 35%), var(--input-bg);
  border:1px solid var(--border);
  border-radius:18px;
  padding:1.25rem .75rem .85rem;
  overflow-x:auto;
}
.pyramid-svg{display:block;width:100%;min-width:820px;height:auto;margin:0 auto}
.pyramid-svg .edge{
  stroke:#64748b;stroke-width:2.5;stroke-linecap:square;stroke-linejoin:miter;fill:none;opacity:.75
}
[data-theme=light] .pyramid-svg .edge{stroke:#64748b;opacity:.55}
.pyramid-svg .node-ring{fill:none;stroke:rgba(255,255,255,.1);stroke-width:1.5}
.pyramid-svg .node-group{cursor:default}
.pyramid-svg .node-group:hover .node-fill{filter:brightness(1.12)}
.pyramid-svg text{font-family:Inter,system-ui,sans-serif;text-anchor:middle}
.pyramid-svg .lbl{fill:#94a3b8;font-size:9px;font-weight:600;dominant-baseline:hanging}
[data-theme=light] .pyramid-svg .lbl{fill:#475569}
.pyramid-svg .lbl-root{fill:#2dd4bf;font-size:11px;font-weight:700;dominant-baseline:hanging}
[data-theme=light] .pyramid-svg .lbl-root{fill:#0d9488}
.pyramid-svg .lvl-tag{fill:#64748b;font-size:10px;font-weight:700;text-anchor:start}
.pyramid-svg .av-text{fill:#042f2e;font-size:11px;font-weight:700;dominant-baseline:central}
.pyramid-svg .av-text.light{fill:#fff}
.pyramid-svg .av-text.sm{font-size:9px}
.pyramid-svg .av-text.empty{fill:#64748b;font-size:12px;font-weight:500}
.tree-note{text-align:center;font-size:.78rem;color:var(--text-dim);margin-top:.65rem}
.tree-legend{
  display:flex;flex-wrap:wrap;gap:.6rem 1.1rem;justify-content:center;
  margin-top:.75rem;padding-top:.75rem;border-top:1px solid var(--border);
  font-size:.72rem;color:var(--text-muted)
}
.tree-legend span{display:flex;align-items:center;gap:.35rem}
.tree-legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.tree-legend i.l0{background:linear-gradient(135deg,#2dd4bf,#0d9488)}
.tree-legend i.l1{background:linear-gradient(135deg,#5eead4,#14b8a6)}
.tree-legend i.l2{background:linear-gradient(135deg,#c4b5fd,#7c3aed)}
.tree-legend i.l3{background:linear-gradient(135deg,#fcd34d,#d97706)}
.tree-legend i.l4{background:linear-gradient(135deg,#60a5fa,#2563eb)}
.tree-legend i.l5{background:linear-gradient(135deg,#fb7185,#e11d48)}
.tree-legend i.empty{border:1.5px dashed #64748b;background:transparent;box-sizing:border-box}
</style>
<script>try{var t=localStorage.getItem('smartai_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<script src="js/auth.js?v=20261116d"></script>
<script src="js/app.js?v=20261116d"></script>
<script>
const user = renderShell('referral');
if (user) {
  const me = escapeHtml(user.nama || 'You');
  const shortMe = me.length > 10 ? me.slice(0, 9) + '…' : me;
  const ini = initials(user.nama || 'You');
  const refCode = (user.referral && user.referral.trim()) ? user.referral.trim().toUpperCase() : 'SMARTAI-REF';
  const refLink = location.origin + location.pathname.replace(/[^/]+$/, '') + 'register.html?ref=' + encodeURIComponent(refCode);

  const roster = {
    0: [{ av: ini, label: shortMe, full: me + ' (Kamu)', empty: false }],
    1: [
      { av: 'FS', label: 'Fajar', full: 'Fajar S.', empty: false },
      { av: 'ML', label: 'Maya', full: 'Maya L.', empty: false }
    ],
    2: [
      { av: 'TH', label: 'Tono', full: 'Tono H.', empty: false },
      { av: 'NA', label: 'Nina', full: 'Nina A.', empty: false },
      { av: 'DW', label: 'Dina', full: 'Dina W.', empty: false },
      { av: 'RK', label: 'Rizky', full: 'Rizky K.', empty: false }
    ],
    3: [
      { av: 'YP', label: 'Yoga', full: 'Yoga P.', empty: false },
      { av: 'SA', label: 'Sinta', full: 'Sinta A.', empty: false },
      { av: 'EH', label: 'Eko', full: 'Eko H.', empty: false },
      { av: '+', label: '', full: 'Slot kosong', empty: true },
      { av: 'BP', label: 'Bima', full: 'Bima P.', empty: false },
      { av: '+', label: '', full: 'Slot kosong', empty: true },
      { av: 'RM', label: 'Rina', full: 'Rina M.', empty: false },
      { av: '+', label: '', full: 'Slot kosong', empty: true }
    ],
    4: [
      { av: 'AR', label: 'Andi', full: 'Andi R.', empty: false },
      { av: 'SW', label: 'Sari', full: 'Sari W.', empty: false },
      { av: '+', label: '', full: 'Slot kosong', empty: true },
      { av: 'DK', label: 'Dedi', full: 'Dedi K.', empty: false },
      { av: '+', label: '', full: 'Slot kosong', empty: true },
      { av: 'FL', label: 'Fira', full: 'Fira L.', empty: false },
      { av: '+', label: '', full: 'Slot kosong', empty: true },
      { av: '+', label: '', full: 'Slot kosong', empty: true }
    ],
    5: [
      { av: 'GH', label: 'Gilang', full: 'Gilang H.', empty: false },
      { av: '+', label: '', full: 'Slot kosong', empty: true },
      { av: 'IR', label: 'Indra', full: 'Indra R.', empty: false },
      { av: '+', label: '', full: 'Slot kosong', empty: true },
      { av: '+', label: '', full: 'Slot kosong', empty: true },
      { av: 'JN', label: 'Joko', full: 'Joko N.', empty: false },
      { av: '+', label: '', full: 'Slot kosong', empty: true },
      { av: '+', label: '', full: 'Slot kosong', empty: true }
    ]
  };

  const MAX_LEVEL = 5;
  const W = 920;
  const rowH = 96;
  const topPad = 42;
  const H = topPad + (MAX_LEVEL + 1) * rowH + 28;
  const radii = [26, 22, 20, 16, 14, 12];
  const leftPad = 52;

  const nodes = [];
  for (let level = 0; level <= MAX_LEVEL; level++) {
    const list = roster[level] || [];
    const count = list.length;
    const y = topPad + level * rowH;
    const r = radii[level] || 12;
    for (let i = 0; i < count; i++) {
      const x = leftPad + ((i + 0.5) / count) * (W - leftPad - 24);
      const d = list[i];
      nodes.push({
        id: 'L' + level + '_' + i,
        level: level, i: i, x: x, y: y, r: r,
        av: d.av, label: d.label, full: d.full, empty: d.empty,
        parent: level === 0 ? null : 'L' + (level - 1) + '_' + Math.floor(i * (roster[level - 1].length) / count)
      });
    }
  }

  const byId = Object.fromEntries(nodes.map(function (n) { return [n.id, n]; }));
  const fills = ['url(#g0)','url(#g1)','url(#g2)','url(#g3)','url(#g4)','url(#g5)'];

  /* Orthogonal (kota) connectors: vertical → horizontal bus → vertical */
  const childrenOf = {};
  nodes.forEach(function (n) {
    if (!n.parent) return;
    if (!childrenOf[n.parent]) childrenOf[n.parent] = [];
    childrenOf[n.parent].push(n);
  });

  var edgeSvg = '';
  Object.keys(childrenOf).forEach(function (pid) {
    var parent = byId[pid];
    var kids = childrenOf[pid];
    if (!parent || !kids.length) return;

    var py1 = parent.y + parent.r;           // bottom of parent
    var midY = (parent.y + kids[0].y) / 2;  // horizontal bus y

    // vertical stem from parent down to bus
    edgeSvg += '<path class="edge" d="M' + parent.x.toFixed(1) + ' ' + py1.toFixed(1) +
      ' V' + midY.toFixed(1) + '"/>';

    if (kids.length === 1) {
      var k = kids[0];
      var ky0 = k.y - k.r;
      if (Math.abs(k.x - parent.x) < 0.5) {
        edgeSvg += '<path class="edge" d="M' + parent.x.toFixed(1) + ' ' + midY.toFixed(1) +
          ' V' + ky0.toFixed(1) + '"/>';
      } else {
        edgeSvg += '<path class="edge" d="M' + parent.x.toFixed(1) + ' ' + midY.toFixed(1) +
          ' H' + k.x.toFixed(1) + ' V' + ky0.toFixed(1) + '"/>';
      }
    } else {
      var minX = kids[0].x, maxX = kids[0].x;
      kids.forEach(function (k) {
        if (k.x < minX) minX = k.x;
        if (k.x > maxX) maxX = k.x;
      });
      // horizontal bus
      edgeSvg += '<path class="edge" d="M' + minX.toFixed(1) + ' ' + midY.toFixed(1) +
        ' H' + maxX.toFixed(1) + '"/>';
      // drop to each child
      kids.forEach(function (k) {
        var ky0 = k.y - k.r;
        edgeSvg += '<path class="edge" d="M' + k.x.toFixed(1) + ' ' + midY.toFixed(1) +
          ' V' + ky0.toFixed(1) + '"/>';
      });
    }
  });

  const levelTags = [0,1,2,3,4,5].map(function (lv) {
    const y = topPad + lv * rowH + 4;
    return '<text class="lvl-tag" x="8" y="' + y + '">L' + lv + '</text>';
  }).join('');

  const nodeSvg = nodes.map(function (n) {
    if (n.empty) {
      return '<g class="node-group" transform="translate(' + n.x + ',' + n.y + ')">' +
        '<title>' + escapeHtml(n.full) + ' · Level ' + n.level + '</title>' +
        '<circle class="node-fill" r="' + n.r + '" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 2"/>' +
        '<text class="av-text empty" y="1">+</text></g>';
    }
    const fill = fills[n.level] || fills[5];
    const avCls = (n.level === 2 || n.level >= 4) ? 'av-text light sm' : (n.level >= 3 ? 'av-text sm' : 'av-text');
    const lblCls = n.level === 0 ? 'lbl-root' : 'lbl';
    return '<g class="node-group" transform="translate(' + n.x + ',' + n.y + ')">' +
      '<title>' + escapeHtml(n.full) + ' · Level ' + n.level + '</title>' +
      '<circle class="node-fill" r="' + n.r + '" fill="' + fill + '"/>' +
      '<circle class="node-ring" r="' + n.r + '"/>' +
      '<text class="' + avCls + '" y="1">' + escapeHtml(n.av) + '</text>' +
      (n.label ? '<text class="' + lblCls + '" y="' + (n.r + 8) + '">' + escapeHtml(n.label) + '</text>' : '') +
      '</g>';
  }).join('');

  const matrixNames = [
    'Fajar S.','Maya L.','Rizky K.','Andi R.','Sari W.',
    'Tono H.','Nina A.','Dina W.','Bima P.','Yoga P.',
    'Sinta A.','Eko H.','Rina M.','Gilang H.','Indra R.',
    'Joko N.',null,null,null,null,
    null,null,null,null,null
  ];
  const matrixCells = matrixNames.map(function (name, i) {
    if (!name) return '<div class="matrix-cell empty" style="animation-delay:' + (i * 0.02) + 's"></div>';
    const av = name.split(/\s+/).map(function (p) { return p[0]; }).slice(0, 2).join('').toUpperCase();
    return '<div class="matrix-cell filled" style="animation-delay:' + (i * 0.02) + 's" title="' + escapeHtml(name) + '">' +
      '<div class="mc-av">' + av + '</div><div class="mc-name">' + escapeHtml(name.split(' ')[0]) + '</div></div>';
  }).join('');

  document.getElementById('page-content').innerHTML =
    '<div class="stats-grid">' +
      '<div class="stat-card"><div class="label">Total Network</div><div class="value">34</div><div class="hint">Semua level</div></div>' +
      '<div class="stat-card"><div class="label">Max depth</div><div class="value">5</div><div class="hint">Mentok level 5</div></div>' +
      '<div class="stat-card"><div class="label">Level 1</div><div class="value">2</div><div class="hint">Direct</div></div>' +
      '<div class="stat-card"><div class="label">Open slots</div><div class="value">∞</div><div class="hint">Tak terbatas</div></div>' +
    '</div>' +
    '<div class="panel"><div class="panel-head"><h2>Bagikan referral</h2><span class="sub">Salin kode / link</span></div>' +
      '<div class="ref-share">' +
        '<div class="ref-field"><div class="rf-label">Kode referral</div><div class="rf-row">' +
          '<span class="rf-value code" id="ref-code">' + escapeHtml(refCode) + '</span>' +
          '<button type="button" class="btn-copy" id="copy-code">Salin kode</button></div></div>' +
        '<div class="ref-field"><div class="rf-label">Link referral</div><div class="rf-row">' +
          '<span class="rf-value" id="ref-link">' + escapeHtml(refLink) + '</span>' +
          '<button type="button" class="btn-copy" id="copy-link">Salin link</button></div></div>' +
      '</div></div>' +
    '<div class="panel"><div class="panel-head"><h2>Pohon Jaringan</h2><span class="sub">Tree topology · garis siku</span></div>' +
      '<div class="pyramid-wrap">' +
        '<svg class="pyramid-svg" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">' +
          '<defs>' +
            '<linearGradient id="g0" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2dd4bf"/><stop offset="100%" stop-color="#0d9488"/></linearGradient>' +
            '<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#5eead4"/><stop offset="100%" stop-color="#14b8a6"/></linearGradient>' +
            '<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#c4b5fd"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>' +
            '<linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fcd34d"/><stop offset="100%" stop-color="#d97706"/></linearGradient>' +
            '<linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#93c5fd"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>' +
            '<linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fda4af"/><stop offset="100%" stop-color="#e11d48"/></linearGradient>' +
          '</defs>' +
          levelTags + edgeSvg + nodeSvg +
        '</svg>' +
        '<p class="tree-note">Garis penghubung <strong>orthogonal</strong> (vertikal + horizontal), seperti tree topology.</p>' +
        '<div class="tree-legend">' +
          '<span><i class="l0"></i> L0 Root</span><span><i class="l1"></i> L1</span><span><i class="l2"></i> L2</span>' +
          '<span><i class="l3"></i> L3</span><span><i class="l4"></i> L4</span><span><i class="l5"></i> L5</span><span><i class="empty"></i> Kosong</span>' +
        '</div></div></div>' +
    '<div class="panel"><div class="panel-head"><h2>Matrix 5×5</h2><span class="sub">Seat plan demo</span></div>' +
      '<div class="matrix-wrap"><div class="matrix-5x5">' + matrixCells + '</div></div>' +
      '<div class="matrix-legend"><span><i class="f"></i> Terisi</span><span><i class="e"></i> Kosong</span></div></div>' +
    '<div class="panel"><div class="panel-head"><h2>Daftar jaringan</h2></div>' +
      '<div class="table-wrap"><table><thead><tr><th>Nama</th><th>Level</th><th>Status</th></tr></thead><tbody>' +
        '<tr><td>Fajar S.</td><td>L1</td><td><span class="badge ok">Active</span></td></tr>' +
        '<tr><td>Andi R.</td><td>L4</td><td><span class="badge ok">Active</span></td></tr>' +
        '<tr><td>Gilang H.</td><td>L5</td><td><span class="badge info">New</span></td></tr>' +
      '</tbody></table></div></div>' +
    '<div class="copy-toast" id="copy-toast">Disalin!</div>';

  function showToast(msg) {
    var t = document.getElementById('copy-toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 1800);
  }
  function copyText(text, btn) {
    function ok() {
      btn.classList.add('copied');
      var old = btn.textContent; btn.textContent = 'Tersalin ✓';
      showToast('Berhasil disalin');
      setTimeout(function () { btn.classList.remove('copied'); btn.textContent = old; }, 1600);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok).catch(function () {
        var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta); ok();
      });
    }
  }
  document.getElementById('copy-code').onclick = function () { copyText(refCode, this); };
  document.getElementById('copy-link').onclick = function () { copyText(refLink, this); };
}
</script>
</body>
</html>
