<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache"/>
<title>Referral Network — Smart AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=20261117c">
<style>
.ref-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:1.25rem}
@media(max-width:960px){.ref-grid{grid-template-columns:1fr}}
.rule-card{background:var(--bg-card-solid);border:1px solid var(--border);border-radius:16px;padding:1.2rem 1.3rem}
.rule-card h3{font-size:1rem;font-weight:800;margin-bottom:.35rem}
.rule-card p.sub{font-size:.8rem;color:var(--text-muted);margin-bottom:1rem;line-height:1.45}
.level-table{width:100%;border-collapse:collapse;font-size:.85rem}
.level-table th,.level-table td{padding:.55rem .4rem;text-align:left;border-bottom:1px solid var(--border)}
.level-table th{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);font-weight:700}
.level-table td strong{color:var(--cyan);font-weight:800}
.level-pill{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:22px;padding:0 .45rem;border-radius:999px;font-size:.68rem;font-weight:800;background:rgba(45,212,191,.12);color:var(--cyan)}
.flow-box{margin-top:1rem;padding:.9rem 1rem;border-radius:12px;background:rgba(45,212,191,.06);border:1px solid rgba(45,212,191,.18);font-size:.8rem;color:var(--text-muted);line-height:1.55}
.flow-box strong{color:var(--text)}
.calc-box{background:var(--bg-card-solid);border:1px solid var(--border);border-radius:16px;padding:1.2rem 1.3rem}
.calc-box label{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);margin-bottom:.35rem}
.calc-box input,.calc-box select{width:100%;padding:.65rem .75rem;border-radius:10px;border:1px solid var(--border);background:var(--input-bg,rgba(0,0,0,.25));color:var(--text);font-family:inherit;font-size:.9rem;margin-bottom:.85rem}
.calc-result{margin-top:.5rem}
.calc-row{display:flex;justify-content:space-between;align-items:center;padding:.45rem 0;border-bottom:1px solid var(--border);font-size:.85rem}
.calc-row:last-child{border-bottom:none;font-weight:800;padding-top:.7rem}
.calc-row .amt{color:var(--cyan);font-weight:700}
.calc-row.total .amt{color:var(--green);font-size:1.05rem}
.ref-code-box{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:.75rem}
.ref-code-box code{font-family:ui-monospace,monospace;font-weight:700;color:var(--cyan);padding:.4rem .7rem;border-radius:8px;background:rgba(45,212,191,.1);border:1px solid rgba(45,212,191,.2);font-size:.85rem}
.btn-copy{border:1px solid var(--border);background:transparent;color:var(--text);padding:.4rem .75rem;border-radius:8px;font-size:.78rem;font-weight:600;cursor:pointer;font-family:inherit}
.btn-copy:hover{border-color:var(--cyan);color:var(--cyan)}
.example-steps{margin:0;padding-left:1.1rem;font-size:.8rem;color:var(--text-muted);line-height:1.55}
.example-steps li{margin-bottom:.35rem}
.example-steps strong{color:var(--text)}
.tree-panel{margin-top:1.25rem}
.tree-wrap{border:1px solid var(--border);border-radius:16px;padding:1.5rem 1rem 1.35rem;overflow:auto;background:var(--bg-card-solid);position:relative}
.network-tree{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:0;min-width:min(100%,720px);margin:0 auto}
.tree-level{display:flex;justify-content:center;flex-wrap:wrap;gap:.85rem;width:100%;position:relative}
.tree-level + .tree-level{margin-top:2.1rem}
.level-tag{position:absolute;left:0;top:-1.15rem;font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);background:var(--bg-card-solid);padding:0 .4rem}
.net-node{background:var(--bg-card-solid);border:1px solid var(--border);border-radius:12px;padding:.7rem .95rem;min-width:118px;text-align:center;box-shadow:var(--shadow-sm);position:relative;transition:border-color .2s,box-shadow .2s,transform .15s;animation:scaleIn .4s cubic-bezier(.22,1,.36,1) both}
.net-node:hover{border-color:var(--cyan);box-shadow:0 8px 22px var(--glow);transform:translateY(-2px)}
.net-node.root{background:linear-gradient(145deg,rgba(45,212,191,.16),var(--bg-card-solid));border-color:rgba(45,212,191,.35);min-width:132px}
.net-node .av{width:38px;height:38px;border-radius:50%;margin:0 auto .4rem;background:linear-gradient(135deg,var(--cyan),var(--teal));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.78rem;color:#042f2e}
.net-node.l2 .av{background:linear-gradient(135deg,var(--purple),#818cf8);color:#1e1b4b}
.net-node.l3 .av{background:linear-gradient(135deg,var(--gold),var(--yellow));color:#422006}
.net-node.l4 .av{background:linear-gradient(135deg,var(--blue),#38bdf8);color:#0c4a6e}
.net-node.l5 .av{background:linear-gradient(135deg,#fb7185,#f43f5e);color:#4c0519}
.net-node .n-name{font-size:.8rem;font-weight:700;line-height:1.25}
.net-node .n-meta{font-size:.65rem;color:var(--text-dim);margin-top:.15rem}
.net-node .n-lots{margin-top:.35rem;font-size:.72rem;font-weight:700;color:var(--cyan);background:rgba(45,212,191,.1);border-radius:6px;padding:.18rem .4rem;display:inline-block}
.net-node .n-earn{font-size:.7rem;font-weight:800;color:var(--green);margin-top:.2rem}
.net-node.root .n-lots,.net-node.root .n-earn{display:none}
.tree-connector{width:2px;height:22px;margin:0 auto;background:linear-gradient(180deg,var(--cyan),rgba(45,212,191,.15));border-radius:2px}
.hier-list{margin-top:1.25rem}
.hier-item{margin-bottom:.15rem}
.hier-row{display:grid;grid-template-columns:28px 36px 1fr auto auto;gap:.65rem;align-items:center;padding:.55rem .75rem;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.02)}
.hier-row:hover{border-color:rgba(45,212,191,.35);background:rgba(45,212,191,.04)}
.hier-toggle{width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-size:.7rem;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit}
.hier-toggle.leaf{visibility:hidden}
.hier-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:800;background:rgba(45,212,191,.15);color:var(--cyan)}
.hier-av.l2{background:rgba(167,139,250,.18);color:#a78bfa}
.hier-av.l3{background:rgba(251,191,36,.15);color:var(--gold)}
.hier-av.l4{background:rgba(56,189,248,.15);color:#38bdf8}
.hier-av.l5{background:rgba(251,113,133,.15);color:#fb7185}
.hier-name{font-weight:700;font-size:.85rem}
.hier-meta{font-size:.7rem;color:var(--text-muted)}
.hier-lots{font-size:.78rem;color:var(--text-muted);text-align:right;white-space:nowrap}
.hier-earn{font-weight:800;color:var(--green);font-size:.85rem;text-align:right;white-space:nowrap}
.hier-children{margin-left:1.35rem;padding-left:.75rem;border-left:2px solid rgba(45,212,191,.18);margin-top:.2rem;display:none}
.hier-children.open{display:block}
.mt5-note{margin-top:1rem;padding:.85rem 1rem;border-radius:12px;background:rgba(56,189,248,.06);border:1px solid rgba(56,189,248,.2);font-size:.8rem;color:var(--text-muted);line-height:1.5}
.mt5-note strong{color:var(--text)}
.tree-legend{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:center;margin-top:1rem;font-size:.72rem;color:var(--text-muted)}
.tree-legend span{display:inline-flex;align-items:center;gap:.3rem}
.tree-legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.tree-legend i.l1{background:linear-gradient(135deg,var(--cyan),var(--teal))}
.tree-legend i.l2{background:linear-gradient(135deg,var(--purple),#818cf8)}
.tree-legend i.l3{background:linear-gradient(135deg,var(--gold),var(--yellow))}
.tree-legend i.l4{background:linear-gradient(135deg,var(--blue),#38bdf8)}
.tree-legend i.l5{background:linear-gradient(135deg,#fb7185,#f43f5e)}
</style>
<script>try{var t=localStorage.getItem('smartai_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<script src="js/auth.js?v=20261117c"></script>
<script src="js/app.js?v=20261117c"></script>
<script>
const user = renderShell('referral');
if (user) {
  var MAX_LEVEL = 5, TOTAL_PER_LOT = 15, DIRECT_SPONSOR = 13, UPLINE_POOL = 2;
  function rateForYou(level) {
    level = Number(level) || 0;
    if (level < 1 || level > MAX_LEVEL) return 0;
    if (level === 1) return TOTAL_PER_LOT;
    return UPLINE_POOL / (level - 1);
  }
  function rateLabel(level) {
    var r = rateForYou(level);
    return r === Math.floor(r) ? '$' + r : '$' + r.toFixed(2);
  }
  var refCode = (user.referral && user.referral.trim()) ? user.referral.trim().toUpperCase() : 'SMARTAI-REF';
  var refLink = location.origin + location.pathname.replace(/[^/]+$/, '') + 'register.html?ref=' + encodeURIComponent(refCode);
  var network = [
    { id:'M2A', name:'Fajar S.', level:1, lots:12, invitedBy:'YOU' },
    { id:'M2B', name:'Maya L.', level:1, lots:8, invitedBy:'YOU' },
    { id:'M2C', name:'Rizky K.', level:1, lots:5, invitedBy:'YOU' },
    { id:'M3A', name:'Tono H.', level:2, lots:6, invitedBy:'M2A' },
    { id:'M3B', name:'Nina A.', level:2, lots:4, invitedBy:'M2A' },
    { id:'M3C', name:'Dina W.', level:2, lots:3, invitedBy:'M2B' },
    { id:'M4A', name:'Andi R.', level:3, lots:5, invitedBy:'M3A' },
    { id:'M4B', name:'Fira L.', level:3, lots:2, invitedBy:'M3B' },
    { id:'M5A', name:'Wati A.', level:4, lots:3, invitedBy:'M4A' },
    { id:'M6A', name:'Lulu P.', level:5, lots:2, invitedBy:'M5A' }
  ];
  function earnFromMember(level, lots) { return rateForYou(level) * (Number(lots) || 0); }
  function totalYouEarn() { return network.reduce(function(s,m){ return s + earnFromMember(m.level, m.lots); }, 0); }
  function levelStats() {
    var out = {}; for (var L=1;L<=MAX_LEVEL;L++) out[L]={count:0,lots:0,earn:0};
    network.forEach(function(m){ if(!out[m.level])return; out[m.level].count++; out[m.level].lots+=m.lots; out[m.level].earn+=earnFromMember(m.level,m.lots); });
    return out;
  }
  function byId(id){ for(var i=0;i<network.length;i++) if(network[i].id===id) return network[i]; return null; }
  function childrenOf(parentId){ return network.filter(function(m){ return m.invitedBy===parentId; }); }
  function initials(name){ return String(name||'').split(/\s+/).map(function(p){return p[0];}).join('').slice(0,2).toUpperCase(); }
  function fmt(n){ return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(n); }
  function parentName(invitedBy){ if(invitedBy==='YOU') return 'kamu'; var p=byId(invitedBy); return p?p.name:invitedBy; }
  function getInvitedBy(id){ var m=byId(id); return m?m.invitedBy:'YOU'; }

  var stats = levelStats();
  var totalEarn = totalYouEarn();
  var totalLots = network.reduce(function(s,m){return s+m.lots;},0);
  var totalMembers = network.length;

  function buildTree(){
    return { id:'YOU', name:(user.nama||'Kamu'), level:0, lots:0, children: childrenOf('YOU').map(attachChildren) };
  }
  function attachChildren(node){
    return { id:node.id, name:node.name, level:node.level, lots:node.lots, earn:earnFromMember(node.level,node.lots), children:childrenOf(node.id).map(attachChildren) };
  }
  function renderVisualTree(root){
    var levels=[[root]], queue=[{node:root,depth:0}];
    while(queue.length){
      var cur=queue.shift();
      if(cur.depth>=MAX_LEVEL) continue;
      if(cur.node.children&&cur.node.children.length){
        if(!levels[cur.depth+1]) levels[cur.depth+1]=[];
        cur.node.children.forEach(function(ch){ levels[cur.depth+1].push(ch); queue.push({node:ch,depth:cur.depth+1}); });
      }
    }
    var html='<div class="network-tree">';
    levels.forEach(function(nodes,depth){
      if(depth>0) html+='<div class="tree-connector"></div>';
      html+='<div class="tree-level">';
      html+= depth===0 ? '<span class="level-tag">Kamu (Root)</span>' : '<span class="level-tag">Level '+depth+' · '+rateLabel(depth)+'/lot ke kamu</span>';
      nodes.forEach(function(n,idx){
        var cls=depth===0?'root':('l'+depth);
        html+='<div class="net-node '+cls+'" style="animation-delay:'+(depth*0.08+idx*0.04).toFixed(2)+'s">';
        html+='<div class="av">'+escapeHtml(initials(n.name))+'</div><div class="n-name">'+escapeHtml(n.name)+'</div>';
        if(depth===0) html+='<div class="n-meta">Sponsor</div>';
        else { html+='<div class="n-meta">L'+depth+'</div><div class="n-lots">'+n.lots+' lot</div><div class="n-earn">+'+fmt(n.earn)+'</div>'; }
        html+='</div>';
      });
      html+='</div>';
    });
    return html+'</div>';
  }
  function renderHierListFixed(node, depth){
    depth=depth||0; if(depth>MAX_LEVEL) return '';
    var hasKids=node.children&&node.children.length>0;
    var earn=node.level>0?node.earn:0;
    var avCls=node.level>0?'l'+node.level:'';
    var meta=node.level===0?'Root · sponsor jaringan':'Level '+node.level+' · diajak oleh '+parentName(getInvitedBy(node.id));
    var html='<div class="hier-item"><div class="hier-row">';
    html+='<button type="button" class="hier-toggle'+(hasKids?'':' leaf')+'" data-toggle="'+escapeHtml(node.id)+'">'+(hasKids?'▾':'')+'</button>';
    html+='<div class="hier-av '+avCls+'">'+escapeHtml(initials(node.name))+'</div>';
    html+='<div><div class="hier-name">'+escapeHtml(node.name)+(node.level===0?' <span style="color:var(--cyan);font-size:.72rem">(kamu)</span>':'')+'</div><div class="hier-meta">'+meta+'</div></div>';
    if(node.level>0){ html+='<div class="hier-lots">'+node.lots+' lot</div><div class="hier-earn">+'+fmt(earn)+'</div>'; }
    else html+='<div class="hier-lots"></div><div class="hier-earn"></div>';
    html+='</div>';
    if(hasKids){
      html+='<div class="hier-children'+(depth<2?' open':'')+'" data-children="'+escapeHtml(node.id)+'">';
      node.children.forEach(function(ch){ html+=renderHierListFixed(ch, depth+1); });
      html+='</div>';
    }
    return html+'</div>';
  }

  var tree = buildTree();
  var levelRows = '';
  for (var L=1;L<=MAX_LEVEL;L++){
    var posTxt = L===1 ? 'Direct — kamu sponsor langsung ($15)' : 'Sponsor langsung $13 · sisa $2 dibagi '+(L-1)+' upline';
    levelRows += '<tr><td><span class="level-pill">L'+L+'</span></td><td>'+posTxt+'</td><td><strong>'+rateLabel(L)+'</strong> / lot (ke kamu)</td><td>'+stats[L].count+' member</td><td>'+fmt(stats[L].earn)+'</td></tr>';
  }

  document.getElementById('page-content').innerHTML =
    '<div class="page-header"><div><h1>Referral Network</h1><p>Pohon koneksi 5 level — komisi total <strong>$15/lot</strong> (sponsor $13 + pool upline $2).</p></div></div>'+
    '<div class="stats-grid">'+
      '<div class="stat-card"><div class="label">Estimasi komisi (demo)</div><div class="value up">'+fmt(totalEarn)+'</div><div class="hint">Dari volume lot jaringan</div></div>'+
      '<div class="stat-card"><div class="label">Member di network</div><div class="value">'+totalMembers+'</div><div class="hint">Level 1–5</div></div>'+
      '<div class="stat-card"><div class="label">Total lot downline</div><div class="value">'+totalLots+'</div><div class="hint">Bulan ini · simulasi</div></div>'+
      '<div class="stat-card"><div class="label">Direct (L1)</div><div class="value">'+stats[1].count+'</div><div class="hint">'+fmt(stats[1].earn)+' dari L1</div></div></div>'+
    '<div class="panel tree-panel"><div class="panel-head"><h2>Pohon Koneksi</h2><span class="sub">Sampai 5 level · data demo</span></div>'+
      '<div class="tree-wrap">'+renderVisualTree(tree)+'</div>'+
      '<div class="tree-legend"><span><i class="l1"></i> L1 → kamu $15</span><span><i class="l2"></i> L2 → kamu $2</span><span><i class="l3"></i> L3 → kamu $1</span><span><i class="l4"></i> L4 → kamu $0.67</span><span><i class="l5"></i> L5 → kamu $0.50</span></div>'+
      '<div class="mt5-note"><strong>Komisi lot (MT-5) — total $15/lot:</strong> Sponsor langsung mendapat <strong>$13</strong> (kecuali L1: kamu mendapat penuh <strong>$15</strong>). Sisa <strong>$2</strong> dibagi rata ke upline di atas sponsor langsung.</div></div>'+
    '<div class="panel hier-list"><div class="panel-head"><h2>Detail Jaringan (hierarki)</h2><span class="sub">Klik ▾ buka/tutup cabang</span></div>'+renderHierListFixed(tree,0)+'</div>'+
    '<div class="ref-grid" style="margin-top:1.25rem"><div class="rule-card">'+
      '<h3>Aturan komisi per 1 lot (total $15)</h3>'+
      '<p class="sub">Sponsor langsung <strong>$13</strong>, sisa <strong>$2</strong> dibagi rata ke upline di atasnya. L1: kamu dapat penuh <strong>$15</strong>.</p>'+
      '<table class="level-table"><thead><tr><th>Level</th><th>Distribusi</th><th>Ke kamu</th><th>Member</th><th>Estimasi</th></tr></thead><tbody>'+levelRows+'</tbody></table>'+
      '<div class="flow-box"><strong>Contoh alur (1 lot):</strong><br/>'+
        '<strong>L1</strong> trade → kamu (sponsor) <strong>$15</strong>.<br/>'+
        '<strong>L2</strong> trade → L1 <strong>$13</strong>, kamu <strong>$2</strong>.<br/>'+
        '<strong>L3</strong> trade → L2 <strong>$13</strong>, L1+kamu <strong>$1</strong> masing-masing.<br/>'+
        '<strong>L4</strong> trade → L3 <strong>$13</strong>, kamu/L1/L2 ≈ <strong>$0.67</strong> masing-masing.<br/>'+
        '<strong>L5</strong> trade → L4 <strong>$13</strong>, 4 upline <strong>$0.50</strong> masing-masing.</div></div>'+
    '<div><div class="calc-box"><h3 style="font-size:1rem;font-weight:800;margin-bottom:.85rem">Kalkulator cepat</h3>'+
      '<label>Level downline</label><select id="calc-level">'+
        '<option value="1">Level 1 — $15/lot ke kamu</option><option value="2">Level 2 — $2/lot ke kamu</option>'+
        '<option value="3">Level 3 — $1/lot ke kamu</option><option value="4">Level 4 — $0.67/lot ke kamu</option>'+
        '<option value="5">Level 5 — $0.50/lot ke kamu</option></select>'+
      '<label>Volume lot (MT-5)</label><input id="calc-lots" type="number" min="0" step="0.01" value="10" />'+
      '<div class="calc-result" id="calc-out"></div></div>'+
    '<div class="rule-card" style="margin-top:1rem"><h3>Kode referral kamu</h3>'+
      '<div class="ref-code-box"><code id="ref-code">'+escapeHtml(refCode)+'</code><button type="button" class="btn-copy" id="copy-code">Salin kode</button></div>'+
      '<div class="ref-code-box" style="margin-top:.5rem"><code id="ref-link" style="font-size:.72rem;word-break:break-all">'+escapeHtml(refLink)+'</code><button type="button" class="btn-copy" id="copy-link">Salin link</button></div>'+
      '<div style="margin-top:1rem"><p class="sub" style="margin-bottom:.5rem">Contoh 10 lot:</p><ol class="example-steps">'+
        '<li><strong>L1</strong> trade 10 lot → kamu: <strong>$150</strong></li>'+
        '<li><strong>L2</strong> trade 10 lot → L1: $130 · kamu: <strong>$20</strong></li>'+
        '<li><strong>L3</strong> trade 10 lot → L2: $130 · L1+kamu: $10 masing-masing</li>'+
        '<li><strong>L4</strong> trade 10 lot → L3: $130 · kamu/L1/L2 ≈ $6.67 masing-masing</li></ol></div></div></div></div>';

  document.querySelectorAll('.hier-toggle:not(.leaf)').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id=btn.getAttribute('data-toggle');
      var child=document.querySelector('[data-children="'+id+'"]');
      if(!child) return;
      var open=child.classList.toggle('open');
      btn.textContent=open?'▾':'▸';
    });
  });
  function renderCalc(){
    var level=parseInt(document.getElementById('calc-level').value,10);
    var lots=parseFloat(document.getElementById('calc-lots').value)||0;
    var rate=rateForYou(level), you=rate*lots;
    var html='<div class="calc-row"><span>Rate ke kamu (L'+level+')</span><span class="amt">'+rateLabel(level)+' / lot</span></div>';
    html+='<div class="calc-row"><span>Volume MT-5</span><span class="amt">'+lots+' lot</span></div>';
    if(level===1) html+='<div class="calc-row"><span>Distribusi</span><span class="amt">Kamu (sponsor) $15</span></div>';
    else { html+='<div class="calc-row"><span>Sponsor langsung</span><span class="amt">$13 / lot</span></div>';
           html+='<div class="calc-row"><span>Pool upline ($2 ÷ '+(level-1)+')</span><span class="amt">'+rateLabel(level)+' / lot</span></div>'; }
    html+='<div class="calc-row total"><span>Kamu terima</span><span class="amt">'+fmt(you)+'</span></div>';
    html+='<div style="margin-top:.85rem;font-size:.75rem;color:var(--text-dim);line-height:1.45">Total distribusi per 1 lot selalu <strong style="color:var(--text)">$15</strong>.</div>';
    document.getElementById('calc-out').innerHTML=html;
  }
  document.getElementById('calc-level').onchange=renderCalc;
  document.getElementById('calc-lots').oninput=renderCalc;
  renderCalc();
  function copyText(text, btn){
    function ok(){ var old=btn.textContent; btn.textContent='Tersalin ✓'; setTimeout(function(){btn.textContent=old},1500); }
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok).catch(function(){fallback();});
    else fallback();
    function fallback(){ var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');ok()}catch(e){} document.body.removeChild(ta); }
  }
  document.getElementById('copy-code').onclick=function(){ copyText(document.getElementById('ref-code').textContent, this); };
  document.getElementById('copy-link').onclick=function(){ copyText(document.getElementById('ref-link').textContent, this); };
}
</script>
</body>
