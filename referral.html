<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache"/>
<title>Referral Network — Smart AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=20261116e">
<style>
.pyramid-wrap{
  background: linear-gradient(180deg, rgba(45,212,191,.04),transparent 35%),var(--input-bg);
  border:1px solid var(--border);border-radius:18px;padding:0;position:relative;overflow:hidden
}
.tree-toolbar{
  display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;
  padding:.75rem 1rem;border-bottom:1px solid var(--border);background:rgba(0,0,0,.15)
}
[data-theme=light] .tree-toolbar{background:rgba(15,23,42,.03)}
.tree-toolbar .hint{font-size:.75rem;color:var(--text-dim)}
.zoom-btns{display:flex;align-items:center;gap:.4rem}
.zoom-btns button{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg-card-solid);color:var(--text);font-size:1.1rem;font-weight:700;
  cursor:pointer;font-family:inherit;line-height:1
}
.zoom-btns button:hover{border-color:var(--cyan);color:var(--cyan)}
.zoom-btns .z-label{font-size:.78rem;color:var(--text-muted);min-width:48px;text-align:center;font-weight:600}
.tree-viewport{
  overflow:auto;max-height:min(70vh,640px);cursor:grab;padding:1rem .75rem 1.25rem;
  -webkit-overflow-scrolling:touch
}
.tree-viewport.dragging{cursor:grabbing}
.tree-stage{
  transform-origin:top left;transition:transform .15s ease;width:max-content;min-width:100%
}
.pyramid-svg{display:block;height:auto}
.pyramid-svg .edge{
  stroke:#64748b;stroke-width:2.2;stroke-linecap:square;stroke-linejoin:miter;fill:none;opacity:.7
}
[data-theme=light] .pyramid-svg .edge{stroke:#64748b;opacity:.5}
.pyramid-svg .node-ring{fill:none;stroke:rgba(255,255,255,.1);stroke-width:1.5}
.pyramid-svg .node-group{cursor:default}
.pyramid-svg .node-group:hover .node-fill{filter:brightness(1.12)}
.pyramid-svg text{font-family:Inter,system-ui,sans-serif;text-anchor:middle}
.pyramid-svg .lbl{fill:#94a3b8;font-size:9px;font-weight:600;dominant-baseline:hanging}
[data-theme=light] .pyramid-svg .lbl{fill:#475569}
.pyramid-svg .lbl-root{fill:#2dd4bf;font-size:11px;font-weight:700;dominant-baseline:hanging}
.pyramid-svg .lvl-tag{fill:#64748b;font-size:10px;font-weight:700;text-anchor:start}
.pyramid-svg .av-text{fill:#042f2e;font-size:11px;font-weight:700;dominant-baseline:central}
.pyramid-svg .av-text.light{fill:#fff}
.pyramid-svg .av-text.sm{font-size:9px}
.pyramid-svg .av-text.empty{fill:#64748b;font-size:12px;font-weight:500}
.tree-note{text-align:center;font-size:.78rem;color:var(--text-dim);margin-top:.65rem;padding:0 1rem 1rem}
.tree-legend{
  display:flex;flex-wrap:wrap;gap:.6rem 1.1rem;justify-content:center;
  padding:.75rem 1rem;border-top:1px solid var(--border);font-size:.72rem;color:var(--text-muted)
}
.tree-legend span{display:flex;align-items:center;gap:.35rem}
.tree-legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.tree-legend i.l0{background:linear-gradient(135deg,#2dd4bf,#0d9488)}
.tree-legend i.l1{background:linear-gradient(135deg,#5eead4,#14b8a6)}
.tree-legend i.l2{background:linear-gradient(135deg,#c4b5fd,#7c3aed)}
.tree-legend i.l3{background:linear-gradient(135deg,#fcd34d,#d97706)}
.tree-legend i.l4{background:linear-gradient(135deg,#60a5fa,#2563eb)}
.tree-legend i.l5{background:linear-gradient(135deg,#fb7185,#e11d48)}
.tree-legend i.empty{border:1.5px dashed #64748b;background:transparent;box-sizing:border-box}
</style>
<script>try{var t=localStorage.getItem('smartai_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<script src="js/auth.js?v=20261116e"></script>
<script src="js/app.js?v=20261116e"></script>
<script>
const user = renderShell('referral');
if (user) {
  const me = escapeHtml(user.nama || 'You');
  const shortMe = me.length > 10 ? me.slice(0, 9) + '…' : me;
  const ini = initials(user.nama || 'You');
  const refCode = (user.referral && user.referral.trim()) ? user.referral.trim().toUpperCase() : 'SMARTAI-REF';
  const refLink = location.origin + location.pathname.replace(/[^/]+$/, '') + 'register.html?ref=' + encodeURIComponent(refCode);

  /* Lebih banyak member per level (demo). Real: unlimited width, max depth 5 */
  function slot(av, label, full, empty) {
    return { av: av, label: label || '', full: full || label, empty: !!empty };
  }
  const roster = {
    0: [slot(ini, shortMe, me + ' (Kamu)', false)],
    1: [
      slot('FS','Fajar','Fajar S.'), slot('ML','Maya','Maya L.'),
      slot('RK','Rizky','Rizky K.'), slot('SW','Sari','Sari W.')
    ],
    2: [
      slot('TH','Tono','Tono H.'), slot('NA','Nina','Nina A.'), slot('DW','Dina','Dina W.'),
      slot('BP','Bima','Bima P.'), slot('YP','Yoga','Yoga P.'), slot('SA','Sinta','Sinta A.'),
      slot('EH','Eko','Eko H.'), slot('RM','Rina','Rina M.')
    ],
    3: [
      slot('AR','Andi','Andi R.'), slot('DK','Dedi','Dedi K.'), slot('FL','Fira','Fira L.'),
      slot('GH','Gilang','Gilang H.'), slot('IR','Indra','Indra R.'), slot('JN','Joko','Joko N.'),
      slot('KL','Kiki','Kiki L.'), slot('LN','Lina','Lina N.'),
      slot('+','','Slot kosong',true), slot('OP','Omar','Omar P.'),
      slot('+','','Slot kosong',true), slot('QR','Qori','Qori R.'),
      slot('ST','Susi','Susi T.'), slot('+','','Slot kosong',true),
      slot('UV','Umi','Umi V.'), slot('+','','Slot kosong',true)
    ],
    4: [
      slot('W1','Wati','Wati A.'), slot('X2','Xena','Xena B.'), slot('+','','Slot kosong',true),
      slot('Y3','Yudi','Yudi C.'), slot('Z4','Zaki','Zaki D.'), slot('+','','Slot kosong',true),
      slot('A5','Alya','Alya E.'), slot('B6','Bagus','Bagus F.'), slot('+','','Slot kosong',true),
      slot('C7','Cici','Cici G.'), slot('D8','Dika','Dika H.'), slot('+','','Slot kosong',true),
      slot('E9','Ella','Ella I.'), slot('+','','Slot kosong',true), slot('F0','Fani','Fani J.'),
      slot('+','','Slot kosong',true), slot('G1','Gita','Gita K.'), slot('H2','Hana','Hana L.'),
      slot('+','','Slot kosong',true), slot('I3','Ivan','Ivan M.'), slot('+','','Slot kosong',true),
      slot('J4','Jaya','Jaya N.'), slot('+','','Slot kosong',true), slot('K5','Kara','Kara O.')
    ],
    5: [
      slot('L6','Lulu','Lulu P.'), slot('+','','Slot kosong',true), slot('M7','Mira','Mira Q.'),
      slot('N8','Nico','Nico R.'), slot('+','','Slot kosong',true), slot('O9','Oki','Oki S.'),
      slot('+','','Slot kosong',true), slot('P0','Putri','Putri T.'), slot('Q1','Rafi','Rafi U.'),
      slot('+','','Slot kosong',true), slot('R2','Sasa','Sasa V.'), slot('+','','Slot kosong',true),
      slot('S3','Tari','Tari W.'), slot('T4','Udin','Udin X.'), slot('+','','Slot kosong',true),
      slot('U5','Vina','Vina Y.'), slot('+','','Slot kosong',true), slot('V6','Wira','Wira Z.'),
      slot('W7','Yuni','Yuni A.'), slot('+','','Slot kosong',true), slot('X8','Zara','Zara B.'),
      slot('+','','Slot kosong',true), slot('Y9','Adi','Adi C.'), slot('+','','Slot kosong',true),
      slot('Z0','Beni','Beni D.'), slot('+','','Slot kosong',true), slot('AA','Cora','Cora E.'),
      slot('+','','Slot kosong',true), slot('BB','Dina','Dina F.'), slot('+','','Slot kosong',true),
      slot('CC','Eros','Eros G.'), slot('+','','Slot kosong',true)
    ]
  };

  const MAX_LEVEL = 5;
  const maxCount = Math.max.apply(null, [0,1,2,3,4,5].map(function (l) { return (roster[l] || []).length; }));
  const colW = 56;
  const leftPad = 52;
  const W = leftPad + maxCount * colW + 40;
  const rowH = 92;
  const topPad = 40;
  const H = topPad + (MAX_LEVEL + 1) * rowH + 30;
  const radii = [24, 20, 18, 14, 12, 11];

  const nodes = [];
  for (let level = 0; level <= MAX_LEVEL; level++) {
    const list = roster[level] || [];
    const count = list.length;
    const y = topPad + level * rowH;
    const r = radii[level] || 11;
    const span = W - leftPad - 30;
    for (let i = 0; i < count; i++) {
      const x = leftPad + ((i + 0.5) / count) * span;
      const d = list[i];
      nodes.push({
        id: 'L' + level + '_' + i,
        level: level, i: i, x: x, y: y, r: r,
        av: d.av, label: d.label, full: d.full, empty: d.empty,
        parent: level === 0 ? null : 'L' + (level - 1) + '_' + Math.floor(i * (roster[level - 1].length) / count)
      });
    }
  }

  const byId = Object.fromEntries(nodes.map(function (n) { return [n.id, n]; }));
  const fills = ['url(#g0)','url(#g1)','url(#g2)','url(#g3)','url(#g4)','url(#g5)'];

  const childrenOf = {};
  nodes.forEach(function (n) {
    if (!n.parent) return;
    if (!childrenOf[n.parent]) childrenOf[n.parent] = [];
    childrenOf[n.parent].push(n);
  });

  var edgeSvg = '';
  Object.keys(childrenOf).forEach(function (pid) {
    var parent = byId[pid];
    var kids = childrenOf[pid];
    if (!parent || !kids.length) return;
    var py1 = parent.y + parent.r;
    var midY = (parent.y + kids[0].y) / 2;
    edgeSvg += '<path class="edge" d="M' + parent.x.toFixed(1) + ' ' + py1.toFixed(1) + ' V' + midY.toFixed(1) + '"/>';
    if (kids.length === 1) {
      var k = kids[0];
      var ky0 = k.y - k.r;
      if (Math.abs(k.x - parent.x) < 0.5) {
        edgeSvg += '<path class="edge" d="M' + parent.x.toFixed(1) + ' ' + midY.toFixed(1) + ' V' + ky0.toFixed(1) + '"/>';
      } else {
        edgeSvg += '<path class="edge" d="M' + parent.x.toFixed(1) + ' ' + midY.toFixed(1) +
          ' H' + k.x.toFixed(1) + ' V' + ky0.toFixed(1) + '"/>';
      }
    } else {
      var minX = kids[0].x, maxX = kids[0].x;
      kids.forEach(function (k) {
        if (k.x < minX) minX = k.x;
        if (k.x > maxX) maxX = k.x;
      });
      edgeSvg += '<path class="edge" d="M' + minX.toFixed(1) + ' ' + midY.toFixed(1) + ' H' + maxX.toFixed(1) + '"/>';
      kids.forEach(function (k) {
        edgeSvg += '<path class="edge" d="M' + k.x.toFixed(1) + ' ' + midY.toFixed(1) + ' V' + (k.y - k.r).toFixed(1) + '"/>';
      });
    }
  });

  const levelTags = [0,1,2,3,4,5].map(function (lv) {
    return '<text class="lvl-tag" x="8" y="' + (topPad + lv * rowH + 4) + '">L' + lv + '</text>';
  }).join('');

  const nodeSvg = nodes.map(function (n) {
    if (n.empty) {
      return '<g class="node-group" transform="translate(' + n.x + ',' + n.y + ')">' +
        '<title>' + escapeHtml(n.full) + ' · L' + n.level + '</title>' +
        '<circle class="node-fill" r="' + n.r + '" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 2"/>' +
        '<text class="av-text empty" y="1">+</text></g>';
    }
    const fill = fills[n.level] || fills[5];
    const avCls = (n.level === 2 || n.level >= 4) ? 'av-text light sm' : (n.level >= 3 ? 'av-text sm' : 'av-text');
    const lblCls = n.level === 0 ? 'lbl-root' : 'lbl';
    const showLbl = n.level <= 2 || (n.level === 3 && n.label);
    return '<g class="node-group" transform="translate(' + n.x + ',' + n.y + ')">' +
      '<title>' + escapeHtml(n.full) + ' · L' + n.level + '</title>' +
      '<circle class="node-fill" r="' + n.r + '" fill="' + fill + '"/>' +
      '<circle class="node-ring" r="' + n.r + '"/>' +
      '<text class="' + avCls + '" y="1">' + escapeHtml(n.av) + '</text>' +
      (showLbl && n.label ? '<text class="' + lblCls + '" y="' + (n.r + 8) + '">' + escapeHtml(n.label) + '</text>' : '') +
      '</g>';
  }).join('');

  const filledCount = nodes.filter(function (n) { return !n.empty; }).length;

  const matrixNames = [
    'Fajar S.','Maya L.','Rizky K.','Andi R.','Sari W.',
    'Tono H.','Nina A.','Dina W.','Bima P.','Yoga P.',
    'Sinta A.','Eko H.','Rina M.','Gilang H.','Indra R.',
    'Joko N.',null,null,null,null,null,null,null,null,null
  ];
  const matrixCells = matrixNames.map(function (name, i) {
    if (!name) return '<div class="matrix-cell empty" style="animation-delay:' + (i * 0.02) + 's"></div>';
    const av = name.split(/\s+/).map(function (p) { return p[0]; }).slice(0, 2).join('').toUpperCase();
    return '<div class="matrix-cell filled" style="animation-delay:' + (i * 0.02) + 's" title="' + escapeHtml(name) + '">' +
      '<div class="mc-av">' + av + '</div><div class="mc-name">' + escapeHtml(name.split(' ')[0]) + '</div></div>';
  }).join('');

  document.getElementById('page-content').innerHTML =
    '<div class="stats-grid">' +
      '<div class="stat-card"><div class="label">Nodes di pohon</div><div class="value">' + filledCount + '</div><div class="hint">Demo terisi</div></div>' +
      '<div class="stat-card"><div class="label">Max depth</div><div class="value">5</div><div class="hint">Mentok level 5</div></div>' +
      '<div class="stat-card"><div class="label">L1 Direct</div><div class="value">4</div><div class="hint">Direct members</div></div>' +
      '<div class="stat-card"><div class="label">Posisi</div><div class="value">∞</div><div class="hint">Tak terbatas / level</div></div>' +
    '</div>' +
    '<div class="panel"><div class="panel-head"><h2>Bagikan referral</h2><span class="sub">Salin kode / link</span></div>' +
      '<div class="ref-share">' +
        '<div class="ref-field"><div class="rf-label">Kode referral</div><div class="rf-row">' +
          '<span class="rf-value code" id="ref-code">' + escapeHtml(refCode) + '</span>' +
          '<button type="button" class="btn-copy" id="copy-code">Salin kode</button></div></div>' +
        '<div class="ref-field"><div class="rf-label">Link referral</div><div class="rf-row">' +
          '<span class="rf-value" id="ref-link">' + escapeHtml(refLink) + '</span>' +
          '<button type="button" class="btn-copy" id="copy-link">Salin link</button></div></div>' +
      '</div></div>' +
    '<div class="panel"><div class="panel-head"><h2>Pohon Jaringan</h2><span class="sub">Scroll · drag · zoom</span></div>' +
      '<div class="pyramid-wrap">' +
        '<div class="tree-toolbar">' +
          '<span class="hint">Scroll / seret untuk geser · Zoom − / +</span>' +
          '<div class="zoom-btns">' +
            '<button type="button" id="zoom-out" title="Perkecil">−</button>' +
            '<span class="z-label" id="zoom-label">100%</span>' +
            '<button type="button" id="zoom-in" title="Perbesar">+</button>' +
            '<button type="button" id="zoom-reset" title="Reset" style="width:auto;padding:0 .7rem;font-size:.75rem">Reset</button>' +
          '</div>' +
        '</div>' +
        '<div class="tree-viewport" id="tree-viewport">' +
          '<div class="tree-stage" id="tree-stage">' +
            '<svg class="pyramid-svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">' +
              '<defs>' +
                '<linearGradient id="g0" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#2dd4bf"/><stop offset="100%" stop-color="#0d9488"/></linearGradient>' +
                '<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#5eead4"/><stop offset="100%" stop-color="#14b8a6"/></linearGradient>' +
                '<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#c4b5fd"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>' +
                '<linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fcd34d"/><stop offset="100%" stop-color="#d97706"/></linearGradient>' +
                '<linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#93c5fd"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>' +
                '<linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fda4af"/><stop offset="100%" stop-color="#e11d48"/></linearGradient>' +
              '</defs>' +
              levelTags + edgeSvg + nodeSvg +
            '</svg>' +
          '</div>' +
        '</div>' +
        '<p class="tree-note">L0–L5 · banyak member · geser & zoom jika tidak muat.</p>' +
        '<div class="tree-legend">' +
          '<span><i class="l0"></i> L0</span><span><i class="l1"></i> L1</span><span><i class="l2"></i> L2</span>' +
          '<span><i class="l3"></i> L3</span><span><i class="l4"></i> L4</span><span><i class="l5"></i> L5</span><span><i class="empty"></i> Kosong</span>' +
        '</div>' +
      '</div></div>' +
    '<div class="panel"><div class="panel-head"><h2>Matrix 5×5</h2></div>' +
      '<div class="matrix-wrap"><div class="matrix-5x5">' + matrixCells + '</div></div></div>' +
    '<div class="copy-toast" id="copy-toast">Disalin!</div>';

  /* Zoom + pan */
  var scale = 1;
  var stage = document.getElementById('tree-stage');
  var viewport = document.getElementById('tree-viewport');
  var label = document.getElementById('zoom-label');
  function applyZoom() {
    stage.style.transform = 'scale(' + scale + ')';
    stage.style.width = (W * scale) + 'px';
    stage.style.height = (H * scale) + 'px';
    label.textContent = Math.round(scale * 100) + '%';
  }
  document.getElementById('zoom-in').onclick = function () {
    scale = Math.min(1.8, Math.round((scale + 0.15) * 100) / 100);
    applyZoom();
  };
  document.getElementById('zoom-out').onclick = function () {
    scale = Math.max(0.35, Math.round((scale - 0.15) * 100) / 100);
    applyZoom();
  };
  document.getElementById('zoom-reset').onclick = function () {
    scale = 1; applyZoom();
    viewport.scrollLeft = 0; viewport.scrollTop = 0;
  };
  /* Drag to pan */
  var dragging = false, sx = 0, sy = 0, sl = 0, st = 0;
  viewport.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    dragging = true;
    viewport.classList.add('dragging');
    sx = e.clientX; sy = e.clientY;
    sl = viewport.scrollLeft; st = viewport.scrollTop;
  });
  window.addEventListener('mousemove', function (e) {
    if (!dragging) return;
    viewport.scrollLeft = sl - (e.clientX - sx);
    viewport.scrollTop = st - (e.clientY - sy);
  });
  window.addEventListener('mouseup', function () {
    dragging = false;
    viewport.classList.remove('dragging');
  });
  /* Ctrl + wheel zoom */
  viewport.addEventListener('wheel', function (e) {
    if (!e.ctrlKey) return;
    e.preventDefault();
    if (e.deltaY < 0) scale = Math.min(1.8, scale + 0.08);
    else scale = Math.max(0.35, scale - 0.08);
    applyZoom();
  }, { passive: false });

  function showToast(msg) {
    var t = document.getElementById('copy-toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 1800);
  }
  function copyText(text, btn) {
    function ok() {
      btn.classList.add('copied');
      var old = btn.textContent; btn.textContent = 'Tersalin ✓';
      showToast('Berhasil disalin');
      setTimeout(function () { btn.classList.remove('copied'); btn.textContent = old; }, 1600);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok).catch(function () {
        var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta); ok();
      });
    }
  }
  document.getElementById('copy-code').onclick = function () { copyText(refCode, this); };
  document.getElementById('copy-link').onclick = function () { copyText(refLink, this); };
}
</script>
</body>
</html>
