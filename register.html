<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="Daftar member Smart AI — buat akun portal untuk dashboard, referral, dan komisi."/>
<meta name="theme-color" content="#060b14"/>
<title>Register — Smart AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>try{var t=localStorage.getItem('smartai_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<div class="auth-page">
  <div class="auth-card register">
    <div class="auth-logo">SMART<span>AI</span><span class="auth-logo-badge">Member</span></div>
    <h1>Buat akun baru</h1>
    <p class="auth-sub">Daftar sebagai member Smart AI</p>
    <form id="register-form" novalidate>
      <div class="form-group">
        <label for="nama">Nama lengkap <span class="req">*</span></label>
        <input type="text" id="nama" required autocomplete="name" placeholder="Nama lengkap"/>
      </div>
      <div class="form-group">
        <label for="email">Email <span class="req">*</span></label>
        <input type="email" id="email" required autocomplete="email" placeholder="nama@email.com"/>
      </div>
      <div class="form-group">
        <label for="hp">No. HP / WhatsApp <span class="req">*</span></label>
        <input type="tel" id="hp" required pattern="[0-9]{10,15}" inputmode="numeric" placeholder="0812xxxxxxxx"/>
      </div>
      <div class="form-group">
        <label for="password">Password <span class="req">*</span></label>
        <div class="password-wrap">
          <input type="password" id="password" required minlength="6" autocomplete="new-password" placeholder="Minimal 6 karakter"/>
          <button type="button" class="toggle-pass" id="toggle-pass" aria-label="Tampilkan password">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label for="password2">Konfirmasi password <span class="req">*</span></label>
        <div class="password-wrap">
          <input type="password" id="password2" required minlength="6" autocomplete="new-password" placeholder="Ulangi password"/>
          <button type="button" class="toggle-pass" id="toggle-pass2" aria-label="Tampilkan password">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label for="referral">Kode referral <span class="opt">(opsional)</span></label>
        <input type="text" id="referral" placeholder="Kode referral jika ada"/>
      </div>
      <label class="check" style="margin-bottom:1rem">
        <input type="checkbox" id="agree" required/>
        Saya setuju dengan ketentuan layanan &amp; memahami risiko trading
      </label>
      <div class="msg error" id="error" role="alert"></div>
      <div class="msg success" id="success" role="status"></div>
      <button type="submit" class="btn-primary" id="btn">Daftar sekarang</button>
    </form>
    <div class="auth-divider"><span>atau</span></div>
    <p class="auth-footer">Sudah punya akun? <a href="login.html">Masuk</a></p>
  </div>
</div>
<script src="js/auth.js"></script>
<script>
redirectIfLoggedIn();
ensureDemoAccount();
setupPasswordToggle('toggle-pass', 'password');
setupPasswordToggle('toggle-pass2', 'password2');

try {
  var params = new URLSearchParams(location.search);
  var refQ = params.get('ref');
  if (refQ) document.getElementById('referral').value = refQ;
} catch (e) {}

document.getElementById('register-form').addEventListener('submit', function (e) {
  e.preventDefault();
  var nama = document.getElementById('nama').value.trim();
  var email = document.getElementById('email').value.trim();
  var hp = document.getElementById('hp').value.trim().replace(/\s/g, '');
  var password = document.getElementById('password').value;
  var password2 = document.getElementById('password2').value;
  var referral = document.getElementById('referral').value.trim();
  var err = document.getElementById('error');
  var ok = document.getElementById('success');
  err.classList.remove('show');
  ok.classList.remove('show');
  if (!nama || !email || !hp) {
    err.textContent = 'Lengkapi data wajib.';
    err.classList.add('show');
    return;
  }
  if (!/^[0-9]{10,15}$/.test(hp)) {
    err.textContent = 'No. HP harus 10–15 digit.';
    err.classList.add('show');
    return;
  }
  if (password.length < 6) {
    err.textContent = 'Password minimal 6 karakter.';
    err.classList.add('show');
    return;
  }
  if (password !== password2) {
    err.textContent = 'Konfirmasi password tidak cocok.';
    err.classList.add('show');
    return;
  }
  if (!document.getElementById('agree').checked) {
    err.textContent = 'Anda harus menyetujui ketentuan.';
    err.classList.add('show');
    return;
  }
  var accounts = getAccounts();
  if (accounts.some(function (a) { return a.email && a.email.toLowerCase() === email.toLowerCase(); })) {
    err.textContent = 'Email sudah terdaftar. Silakan login.';
    err.classList.add('show');
    return;
  }
  var record = { nama: nama, email: email, hp: hp, password: password, referral: referral, avatar: null };
  accounts.push(record);
  localStorage.setItem('smartai_accounts', JSON.stringify(accounts));
  setUser(sessionFromAccount(record));
  ok.textContent = 'Registrasi berhasil. Mengalihkan ke dashboard...';
  ok.classList.add('show');
  setTimeout(function () { location.href = 'dashboard.html'; }, 800);
});
</script>
</body>
</html>
