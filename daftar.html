    <main class="daftar-main">
      <div class="daftar-card" id="form-view">
        <h1>Buat akun member</h1>
        <p class="daftar-sub">Setelah daftar, kamu langsung masuk ke dashboard Smart AI.</p>
        <form id="interest-form">
          <div class="error-msg" id="error-msg" role="alert"></div>
          <div class="form-group">
            <label for="nama">Nama lengkap</label>
            <input type="text" id="nama" name="nama" placeholder="Nama Anda" required autocomplete="name"/>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="nama@email.com" required autocomplete="email"/>
          </div>
          <div class="form-group">
            <label for="wa">WhatsApp</label>
            <input type="tel" id="wa" name="wa" placeholder="0812xxxxxxxx" required pattern="[0-9]{10,15}" inputmode="numeric"/>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password" placeholder="Min. 6 karakter"/>
              <button type="button" class="toggle-pass" data-target="password" aria-label="Tampilkan password">👁</button>
            </div>
          </div>
          <div class="form-group">
            <label for="password2">Konfirmasi password</label>
            <div class="password-wrap">
              <input type="password" id="password2" name="password2" required minlength="6" autocomplete="new-password"/>
              <button type="button" class="toggle-pass" data-target="password2" aria-label="Tampilkan password">👁</button>
            </div>
          </div>
          <div class="form-group">
            <label for="referral">Kode referral <span class="opt">(opsional)</span></label>
            <input type="text" id="referral" name="referral" placeholder="Kode referral" maxlength="30"/>
          </div>
          <button type="submit" class="btn-submit" id="submit-btn">Daftar & Masuk →</button>
        </form>
        <p style="margin-top:1rem;font-size:.85rem;color:var(--text-muted);text-align:center">Sudah punya akun? <a href="login.html">Login</a></p>
      </div>
      <div class="success-box" id="success-view" style="display:none">
        <h2>Akun berhasil dibuat</h2>
        <p>Mengalihkan ke dashboard…</p>
      </div>
    </main>
    <a href="https://wa.me/6282137585596" class="wa-float" target="_blank" rel="noopener">WHATSAPP</a>
