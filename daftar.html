<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Sign Up — Smart AI</title>
  <meta name="theme-color" content="#050a12"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme=dark] {
      --bg: #040810;
      --bg-card: rgba(12, 18, 32, 0.85);
      --border: rgba(148, 163, 184, 0.14);
      --cyan: #2dd4bf;
      --teal: #14b8a6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --green: #34d399;
      --glow: rgba(45, 212, 191, 0.22);
      --shadow: 0 30px 60px -25px rgba(0, 0, 0, 0.65);
    }
    [data-theme=light] {
      --bg: #e8eef6;
      --bg-card: rgba(255, 255, 255, 0.92);
      --border: rgba(15, 23, 42, 0.08);
      --cyan: #0f766e;
      --teal: #0d9488;
      --text: #0f172a;
      --text-muted: #475569;
      --text-dim: #94a3b8;
      --green: #059669;
      --glow: rgba(13, 148, 136, 0.15);
      --shadow: 0 25px 50px -20px rgba(15, 23, 42, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 480px; height: 480px;
      top: -120px; left: -80px;
      background: radial-gradient(circle, rgba(45, 212, 191, 0.16), transparent 70%);
    }
    body::after {
      width: 400px; height: 400px;
      bottom: -80px; right: -60px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.12), transparent 70%);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 1.5rem;
      max-width: 520px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }
    .logo {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      text-decoration: none;
      color: var(--text);
    }
    .logo span {
      background: linear-gradient(135deg, var(--cyan), #5eead4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .top-actions { display: flex; align-items: center; gap: 0.55rem; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0.48rem 1rem; border-radius: 999px; font-weight: 700; font-size: 0.84rem;
      text-decoration: none; font-family: inherit; cursor: pointer; border: 1px solid transparent;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    }
    .btn-ghost {
      border-color: var(--border); color: var(--text); background: rgba(255,255,255,0.03);
    }
    .btn-ghost:hover { border-color: var(--cyan); color: var(--cyan); }
    .btn-primary {
      background: linear-gradient(135deg, #2dd4bf, #14b8a6);
      color: #042f2e; border: none;
      box-shadow: 0 6px 18px rgba(45, 212, 191, 0.25);
    }
    .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.04); }
    .theme-btn {
      width: 40px; height: 40px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--bg-card);
      color: var(--text-muted); cursor: pointer; font-size: 0.95rem;
    }
    .theme-btn:hover { border-color: var(--cyan); color: var(--cyan); }
    .wrap {
      max-width: 440px;
      margin: 0 auto;
      padding: 0.25rem 1.25rem 2.5rem;
      position: relative;
      z-index: 1;
      animation: rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: none; }
    }
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 1.75rem 1.5rem 1.5rem;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(45, 212, 191, 0.4), transparent);
    }
    .card h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
      text-align: center;
    }
    .card .sub {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 1.3rem;
    }
    .form-group { margin-bottom: 0.95rem; }
    .form-group label {
      display: block;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
    }
    .form-group label .req { color: var(--cyan); }
    .form-group label .opt { color: var(--text-dim); font-weight: 500; }
    .form-group input {
      width: 100%;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 12px;
      padding: 0.75rem 0.95rem;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      min-height: 48px;
      transition: border-color 0.18s, box-shadow 0.18s;
    }
    [data-theme=light] .form-group input {
      background: rgba(15, 23, 42, 0.03);
      border-color: rgba(15, 23, 42, 0.1);
    }
    .form-group input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px var(--glow);
    }
    .form-group input.err {
      border-color: rgba(248, 113, 113, 0.55);
    }
    .btn-submit {
      width: 100%;
      margin-top: 0.35rem;
      padding: 0.9rem;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
      background: linear-gradient(135deg, #2dd4bf, #14b8a6 50%, #0d9488);
      color: #042f2e;
      min-height: 50px;
      box-shadow: 0 8px 24px rgba(45, 212, 191, 0.28);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(45, 212, 191, 0.35);
    }
    .btn-submit:disabled { opacity: 0.65; cursor: wait; transform: none; }
    .msg {
      display: none;
      margin-top: 0.85rem;
      padding: 0.7rem 0.95rem;
      border-radius: 10px;
      font-size: 0.82rem;
    }
    .msg.show { display: block; }
    .msg.error {
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.25);
      color: #f87171;
    }
    .msg.success {
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.25);
      color: var(--green);
    }
    .foot {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.82rem;
      color: var(--text-dim);
    }
    .foot a { color: var(--cyan); font-weight: 600; text-decoration: none; }
    .foot a:hover { text-decoration: underline; }
    .back-link {
      display: inline-flex; align-items: center; gap: 0.35rem;
      color: var(--text-muted); text-decoration: none;
      font-size: 0.82rem; font-weight: 600; margin-bottom: 0.85rem;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--cyan); }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="https://smartai-landing-delta.vercel.app/" class="logo">SMART<span>AI</span></a>
    <div class="top-actions">
      <button type="button" class="theme-btn" id="theme-toggle" aria-label="Tema">◐</button>
      <a href="index.html" class="btn btn-ghost">Login</a>
    </div>
  </div>

  <div class="wrap">
    <div class="card">
      <a href="https://smartai-landing-delta.vercel.app/" class="back-link">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Kembali ke Beranda
      </a>
      <h1>Sign Up</h1>
      <p class="sub">Buat akun member Smart AI</p>

      <form id="signup-form" novalidate>
        <div class="form-group">
          <label for="nama">Nama lengkap <span class="req">*</span></label>
          <input type="text" id="nama" name="nama" placeholder="Nama Anda" required autocomplete="name"/>
        </div>
        <div class="form-group">
          <label for="email">Email <span class="req">*</span></label>
          <input type="email" id="email" name="email" placeholder="nama@email.com" required autocomplete="email"/>
        </div>
        <div class="form-group">
          <label for="hp">No. HP / WhatsApp <span class="req">*</span></label>
          <input type="tel" id="hp" name="hp" placeholder="08xxxxxxxxxx" required inputmode="numeric" autocomplete="tel"/>
        </div>
        <div class="form-group">
          <label for="password">Password <span class="req">*</span></label>
          <input type="password" id="password" name="password" placeholder="Minimal 6 karakter" required autocomplete="new-password"/>
        </div>
        <div class="form-group">
          <label for="password2">Konfirmasi password <span class="req">*</span></label>
          <input type="password" id="password2" name="password2" placeholder="Ulangi password" required autocomplete="new-password"/>
        </div>
        <div class="form-group">
          <label for="ref">Kode referral <span class="opt">(opsional)</span></label>
          <input type="text" id="ref" name="ref" placeholder="Contoh: SMARTAI-REF" autocomplete="off"/>
        </div>
        <button type="submit" class="btn-submit" id="btn-submit">Buat Akun</button>
      </form>

      <div id="msg" class="msg"></div>

      <p class="foot">
        Sudah punya akun? <a href="index.html">Login</a>
      </p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
  (function () {
    var html = document.documentElement;
    var themeBtn = document.getElementById('theme-toggle');
    try {
      var saved = localStorage.getItem('smartai_theme') || localStorage.getItem('theme');
      if (saved) html.setAttribute('data-theme', saved);
    } catch (e) {}
    if (themeBtn) {
      themeBtn.addEventListener('click', function () {
        var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        try {
          localStorage.setItem('smartai_theme', next);
          localStorage.setItem('theme', next);
        } catch (e) {}
      });
    }

    try {
      var params = new URLSearchParams(location.search);
      var refQ = params.get('ref');
      if (refQ) {
        var refEl = document.getElementById('ref');
        if (refEl) refEl.value = refQ;
      }
    } catch (e) {}

    /* Form registrasi selalu tampil dulu — tidak auto-redirect */

    var form = document.getElementById('signup-form');
    var msg = document.getElementById('msg');
    var btn = document.getElementById('btn-submit');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var nama = (form.nama.value || '').trim();
      var email = (form.email.value || '').trim();
      var hp = (form.hp.value || '').trim();
      var password = form.password.value || '';
      var password2 = form.password2.value || '';
      var referral = (form.ref.value || '').trim();

      Array.prototype.forEach.call(form.querySelectorAll('input'), function (el) {
        el.classList.remove('err');
      });

      if (!nama || !email || !hp || !password || !password2) {
        msg.className = 'msg show error';
        msg.textContent = 'Lengkapi semua field wajib.';
        return;
      }
      if (password.length < 6) {
        form.password.classList.add('err');
        msg.className = 'msg show error';
        msg.textContent = 'Password minimal 6 karakter.';
        return;
      }
      if (password !== password2) {
        form.password2.classList.add('err');
        msg.className = 'msg show error';
        msg.textContent = 'Konfirmasi password tidak cocok.';
        return;
      }

      btn.disabled = true;

      var result;
      if (typeof registerAccount === 'function') {
        result = registerAccount({
          nama: nama,
          email: email,
          hp: hp,
          password: password,
          referral: referral
        });
      } else {
        result = { ok: false, error: 'Sistem auth belum siap. Refresh halaman.' };
      }

      if (result && result.ok) {
        msg.className = 'msg show success';
        msg.textContent = 'Akun berhasil dibuat. Mengalihkan ke dashboard...';
        setTimeout(function () { location.href = 'dashboard.html'; }, 600);
      } else {
        btn.disabled = false;
        msg.className = 'msg show error';
        msg.textContent = (result && result.error) || 'Gagal mendaftar.';
      }
    });
  })();
  </script>
</body>
</html>
