<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#050a12"/>
<title>Dashboard — Smart AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=pro2">
<style>
.mt5-mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.25rem}
@media(max-width:900px){.mt5-mini-grid{grid-template-columns:1fr}}
.mt5-mini{background:var(--bg-card-solid);border:1px solid var(--border);border-radius:14px;padding:1rem 1.1rem}
.mt5-mini .pkg{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.35rem}
.mt5-mini.basic .pkg{color:var(--cyan)}.mt5-mini.gold .pkg{color:var(--gold)}.mt5-mini.pro .pkg{color:var(--purple)}
.mt5-mini .aid{font-size:1.05rem;font-weight:800;margin-bottom:.55rem}
.mt5-mini .row{display:flex;justify-content:space-between;font-size:.78rem;color:var(--text-muted);margin:.2rem 0}
.mt5-mini .row strong{color:var(--text);font-weight:600}
.mt5-mini .dp{font-size:1.05rem;font-weight:800;color:var(--cyan);margin-top:.45rem}
.mt5-mini .st{font-size:.7rem;font-weight:700}
.mt5-mini .st.on{color:var(--green)}.mt5-mini .st.off{color:var(--text-dim)}
</style>
<script>try{var t=localStorage.getItem('smartai_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<script src="js/auth.js?v=pro2"></script>
<script src="js/app.js?v=pro2"></script>
<script src="js/mt5-api.js?v=20261117live2"></script>
<script>
const user = renderShell('dashboard');
if (user) {
  var root = document.getElementById('page-content');
  root.innerHTML = '<div style="padding:2rem;color:var(--text-muted);text-align:center">Memuat dashboard…</div>';

  async function loadDash() {
    var accounts = [];
    try { accounts = await SmartAIMT5.getAccounts(true); } catch (e) { accounts = []; }
    accounts.sort(function(a,b){ return String(a.account_id).localeCompare(String(b.account_id)); });
    var live = SmartAIMT5.isLive && SmartAIMT5.isLive();
    var totalEq = 0, totalDaily = 0, totalProfit = 0, totalWd = 0, onlineN = 0;
    accounts.forEach(function(a) {
      if (Number.isFinite(Number(a.equity))) totalEq += Number(a.equity);
      if (Number.isFinite(Number(a.daily_profit))) totalDaily += Number(a.daily_profit);
      if (Number.isFinite(Number(a.total_profit))) totalProfit += Number(a.total_profit);
      if (Number.isFinite(Number(a.total_penarikan))) totalWd += Number(a.total_penarikan);
      if (String(a.status).toUpperCase() === 'ONLINE') onlineN++;
    });
    var pkgClass = { ACC01:'basic', ACC02:'gold', ACC03:'pro' };
    var pkgName = { ACC01:'Smart Basic', ACC02:'Smart Gold', ACC03:'Smart Pro' };

    var cards = accounts.map(function(a) {
      var cls = pkgClass[a.account_id] || 'basic';
      var on = String(a.status).toUpperCase() === 'ONLINE';
      return '<div class="mt5-mini ' + cls + '">' +
        '<div class="pkg">' + (pkgName[a.account_id] || a.name || 'MT5') + '</div>' +
        '<div class="aid">' + SmartAIMT5.escape(a.account_id) +
          ' <span class="st ' + (on?'on':'off') + '">' + SmartAIMT5.escape(a.status || '\u2014') + '</span></div>' +
        '<div class="row"><span>Balance</span><strong>' + SmartAIMT5.formatUSD(a.balance) + '</strong></div>' +
        '<div class="row"><span>Equity</span><strong>' + SmartAIMT5.formatUSD(a.equity) + '</strong></div>' +
        '<div class="row"><span>Total profit</span><strong>' + SmartAIMT5.formatUSD(a.total_profit) + '</strong></div>' +
        '<div class="dp">Daily ' + SmartAIMT5.formatUSD(a.daily_profit) + '</div>' +
      '</div>';
    }).join('');

    root.innerHTML =
      '<section class="dashboard-hero">' +
        '<div class="dashboard-hero-copy">' +
          '<div class="dashboard-hero-kicker">SMARTAI MEMBER PORTAL</div>' +
          '<h2>Your workspace for <span>smarter insights.</span></h2>' +
          '<p>' + (live
            ? 'Data akun MT5 <strong style="color:var(--green)">LIVE</strong> dari API SmartInvestama.'
            : 'Mode demo — API live belum terjangkau.') + '</p>' +
        '</div>' +
      '</section>' +
      '<div class="page-header">' +
        '<div><h1>Welcome back, ' + escapeHtml(user.nama || 'Member') + '</h1>' +
        '<p>Ringkasan 3 akun MT5 (ACC01 / ACC02 / ACC03).</p></div>' +
        '<div class="date-chip">' + escapeHtml(formatToday()) + '</div>' +
      '</div>' +
      '<div class="stats-grid">' +
        '<div class="stat-card"><div class="label">Total equity</div><div class="value" id="account-equity-total">' + SmartAIMT5.formatUSD(totalEq) + '</div><div class="hint">' + accounts.length + ' akun · ' + onlineN + ' online</div></div>' +
        '<div class="stat-card"><div class="label">Daily profit (all)</div><div class="value ' + (totalDaily>=0?'up':'') + '">' + SmartAIMT5.formatUSD(totalDaily) + '</div><div class="hint">Hari ini</div></div>' +
        '<div class="stat-card"><div class="label">Total profit</div><div class="value up">' + SmartAIMT5.formatUSD(totalProfit) + '</div><div class="hint">Kumulatif</div></div>' +
        '<div class="stat-card"><div class="label">Total penarikan</div><div class="value">' + SmartAIMT5.formatUSD(totalWd) + '</div><div class="hint">Semua akun</div></div>' +
      '</div>' +
      '<div class="panel-head" style="margin-bottom:.75rem"><h2 style="font-size:1rem;font-weight:700">Akun MT5</h2></div>' +
      '<div class="mt5-mini-grid">' + (cards || '<p>Tidak ada data akun.</p>') + '</div>' +
      '<div class="grid-2">' +
        '<div class="panel"><div class="panel-head"><h2>Account summary</h2><span class="sub">Member</span></div>' +
          '<div class="table-wrap"><table><tbody>' +
            '<tr><td style="width:36%">Email</td><td>' + escapeHtml(user.email) + '</td></tr>' +
            '<tr><td>WhatsApp</td><td>' + escapeHtml(user.hp || '\u2014') + '</td></tr>' +
            '<tr><td>Referral</td><td><strong style="color:var(--cyan)">' + escapeHtml(user.referral || 'SMARTAI-REF') + '</strong></td></tr>' +
            '<tr><td>Status</td><td><span class="badge ok">Active</span></td></tr>' +
          '</tbody></table></div></div>' +
        '<div class="panel"><div class="panel-head"><h2>Quick access</h2></div>' +
          '<div class="quick-actions">' +
            '<a href="performance.html">Acc Performance</a>' +
            '<a href="trading-report.html">Trading Report</a>' +
            '<a href="transactions.html">Transactions</a>' +
            '<a href="commission.html">Commission</a>' +
            '<a href="referral.html">Referral Map</a>' +
            '<a href="profile.html">My Profile</a>' +
          '</div></div>' +
      '</div>';
  }
  loadDash();
  setInterval(loadDash, 45000);
}
</script>
</body>
</html>
