<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#050a12"/>
<title>Dashboard — Smart AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=pro2">
<script>try{var t=localStorage.getItem('smartai_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
</head>
<body>
<script src="js/auth.js?v=pro2"></script>
<script src="js/app.js?v=pro2"></script>
<script src="js/mt5-api.js?v=20261117"></script>
<script>
const user = renderShell('dashboard');
if (user) {
  document.getElementById('page-content').innerHTML = `
    <section class="dashboard-hero">
      <div class="dashboard-hero-copy">
        <div class="dashboard-hero-kicker">SMARTAI MEMBER PORTAL</div>
        <h2>Your workspace for <span>smarter insights.</span></h2>
        <p>Explore your account overview, member network, reports, and activity in one streamlined dashboard.</p>
      </div>
      <div class="dashboard-hero-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2.8 14.4 9.6 21.2 12l-6.8 2.4L12 21.2l-2.4-6.8L2.8 12l6.8-2.4L12 2.8Z"/>
          <path d="m19 2 .7 2.3L22 5l-2.3.7L19 8l-.7-2.3L16 5l2.3-.7L19 2Z"/>
        </svg>
      </div>
    </section>

    <div class="page-header">
      <div>
        <h1>Welcome back, ${escapeHtml(user.nama || 'Member')}</h1>
        <p>Ringkasan contoh tampilan portal. Data belum berasal dari akun atau transaksi nyata.</p>
      </div>
      <div class="date-chip">${escapeHtml(formatToday())}</div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">Total clients</div>
        <div class="value">12 <span class="stat-trend up">+2</span></div>
        <div class="hint">This month</div>
      </div>
      <div class="stat-card">
        <div class="label">Referral network</div>
        <div class="value">34</div>
        <div class="hint">3 active levels</div>
      </div>
      <div class="stat-card">
        <div class="label">Commission</div>
        <div class="value up">$1,240</div>
        <div class="hint">Current period</div>
      </div>
      <div class="stat-card">
        <div class="label">Account equity</div>
        <div class="value" id="account-equity-total">Loading…</div>
        <div class="hint">3 MT5 accounts</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <div class="panel-head">
          <h2>Recent activity</h2>
          <span class="sub">Last 7 days</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Date</th><th>Activity</th><th>Status</th></tr>
            </thead>
            <tbody>
              <tr><td>16 Nov 2026</td><td>New client: Andi R.</td><td><span class="badge ok">Done</span></td></tr>
              <tr><td>15 Nov 2026</td><td>Referral commission L1</td><td><span class="badge ok">Paid</span></td></tr>
              <tr><td>14 Nov 2026</td><td>Withdraw $200</td><td><span class="badge warn">Pending</span></td></tr>
              <tr><td>12 Nov 2026</td><td>Trading report sync</td><td><span class="badge info">Synced</span></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Account summary</h2>
          <span class="sub">Active member</span>
        </div>
        <div class="table-wrap">
          <table>
            <tbody>
              <tr><td style="width:36%">Email</td><td>${escapeHtml(user.email)}</td></tr>
              <tr><td>WhatsApp</td><td>${escapeHtml(user.hp || '—')}</td></tr>
              <tr><td>Referral code</td><td><strong style="color:var(--cyan);font-family:ui-monospace,monospace">${escapeHtml(user.referral || 'SMARTAI-REF')}</strong></td></tr>
              <tr><td>Status</td><td><span class="badge ok">Active</span></td></tr>
            </tbody>
          </table>
        </div>
        <div class="mini-chart" style="margin-top:1.1rem" aria-hidden="true">
          <span style="height:32%"></span>
          <span style="height:48%;animation-delay:.04s"></span>
          <span style="height:40%;animation-delay:.08s"></span>
          <span style="height:65%;animation-delay:.12s"></span>
          <span style="height:52%;animation-delay:.16s"></span>
          <span style="height:78%;animation-delay:.2s"></span>
          <span style="height:60%;animation-delay:.24s"></span>
          <span style="height:88%;animation-delay:.28s"></span>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Quick access</h2></div>
      <div class="quick-actions">
        <a href="performance.html">Acc Performance</a>
        <a href="referral.html">Referral Map</a>
        <a href="clients.html">My Clients</a>
        <a href="commission.html">Commission</a>
        <a href="trading-report.html">Trading Report</a>
        <a href="profile.html">My Profile</a>
      </div>
    </div>`;
}
</script>
<script>
(function () {
  var target = document.getElementById('account-equity-total');
  if (!target || !window.SmartAIMT5) return;
  async function refreshEquity() {
    try {
      var accounts = await SmartAIMT5.getAccounts();
      var values = accounts.map(function(a){ return Number(a.equity); }).filter(function(v){ return Number.isFinite(v); });
      target.textContent = values.length ? SmartAIMT5.formatUSD(values.reduce(function(s,v){return s+v;},0)) : '—';
      var note = target.closest('.stat-card');
      if (note) { var label = note.querySelector('.label'); if (label && !label.textContent.includes('DEMO')) label.textContent += ' · DEMO'; }
    } catch (e) { target.textContent = 'API unavailable'; }
  }
  refreshEquity();
  setInterval(refreshEquity, 30000);
})();
</script>
</body>
</html>
