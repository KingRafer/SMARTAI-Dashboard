<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard — Smart AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
const user = renderShell('dashboard');
if (user) {
  document.getElementById('page-content').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card"><div class="label">Total Clients</div><div class="value">12</div><div class="hint">+2 bulan ini</div></div>
      <div class="stat-card"><div class="label">Referral Network</div><div class="value">34</div><div class="hint">3 level aktif</div></div>
      <div class="stat-card"><div class="label">Commission</div><div class="value up">$1,240</div><div class="hint">Bulan berjalan</div></div>
      <div class="stat-card"><div class="label">Pending TX</div><div class="value">3</div><div class="hint">Menunggu proses</div></div>
    </div>
    <div class="grid-2">
      <div class="panel">
        <div class="panel-head"><h2>Aktivitas terbaru</h2><span class="sub">7 hari terakhir</span></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Tanggal</th><th>Aktivitas</th><th>Status</th></tr></thead>
            <tbody>
              <tr><td>16 Nov 2026</td><td>Client baru: Andi R.</td><td><span class="badge ok">Selesai</span></td></tr>
              <tr><td>15 Nov 2026</td><td>Komisi referral L1</td><td><span class="badge ok">Paid</span></td></tr>
              <tr><td>14 Nov 2026</td><td>Withdraw $200</td><td><span class="badge warn">Pending</span></td></tr>
              <tr><td>12 Nov 2026</td><td>Trading report sync</td><td><span class="badge info">Sync</span></td></tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Ringkasan akun</h2></div>
        <p style="color:var(--text-muted);font-size:.9rem;margin-bottom:1rem">Halo, <strong style="color:var(--text)">${escapeHtml(user.nama)}</strong>. Selamat datang di portal member Smart AI.</p>
        <div class="table-wrap">
          <table>
            <tbody>
              <tr><td>Email</td><td>${escapeHtml(user.email)}</td></tr>
              <tr><td>WhatsApp</td><td>${escapeHtml(user.hp || '—')}</td></tr>
              <tr><td>Referral code</td><td>${escapeHtml(user.referral || '—')}</td></tr>
              <tr><td>Status</td><td><span class="badge ok">Active</span></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
}
</script>
</body>
</html>
