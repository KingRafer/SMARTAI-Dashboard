<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login — Smart AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>try{var t=localStorage.getItem('smartai_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
.demo-box{
  background:rgba(45,212,191,.08);
  border:1px solid rgba(45,212,191,.22);
  border-radius:12px;
  padding:.9rem 1rem;
  margin-bottom:1.25rem;
  font-size:.82rem;
  color:var(--text-muted);
}
.demo-box strong{color:var(--cyan);font-weight:600}
.demo-box code{
  display:inline-block;
  background:rgba(0,0,0,.25);
  padding:.15rem .45rem;
  border-radius:6px;
  color:var(--text);
  font-size:.8rem;
}
.demo-box .row{margin:.25rem 0}
.btn-demo{
  margin-top:.65rem;
  width:100%;
  padding:.55rem;
  border-radius:999px;
  border:1px solid rgba(45,212,191,.35);
  background:transparent;
  color:var(--cyan);
  font-size:.8rem;
  font-weight:600;
  font-family:inherit;
  cursor:pointer;
}
.btn-demo:hover{background:rgba(45,212,191,.12)}
</style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">SMART<span>AI</span></div>
    <h1>Masuk ke akun</h1>
    <p class="auth-sub">Akses dashboard member Smart AI</p>

    <div class="demo-box">
      <strong>Akun demo</strong>
      <div class="row">Email: <code>demo@smartai.com</code></div>
      <div class="row">Password: <code>demo123</code></div>
      <button type="button" class="btn-demo" id="fill-demo">Isi & pakai akun demo</button>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email <span class="req">*</span></label>
        <input type="email" id="email" required autocomplete="username" placeholder="nama@email.com"/>
      </div>
      <div class="form-group">
        <label for="password">Password <span class="req">*</span></label>
        <div class="password-wrap">
          <input type="password" id="password" required autocomplete="current-password" placeholder="Password"/>
          <button type="button" class="toggle-pass" id="toggle-pass" aria-label="Tampilkan password">👁</button>
        </div>
      </div>
      <div class="form-row">
        <label class="check"><input type="checkbox" id="remember"/> Ingat saya</label>
      </div>
      <div class="msg error" id="error"></div>
      <button type="submit" class="btn-primary" id="btn">Masuk →</button>
    </form>
    <div class="auth-divider"><span>atau</span></div>
    <p class="auth-footer">Belum punya akun? <a href="register.html">Register</a></p>
  </div>
</div>
<script src="js/auth.js"></script>
<script>
redirectIfLoggedIn();
ensureDemoAccount();
setupPasswordToggle('toggle-pass', 'password');

document.getElementById('fill-demo').addEventListener('click', function () {
  document.getElementById('email').value = DEMO_ACCOUNT.email;
  document.getElementById('password').value = DEMO_ACCOUNT.password;
});

document.getElementById('login-form').addEventListener('submit', function (e) {
  e.preventDefault();
  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  var err = document.getElementById('error');
  err.classList.remove('show');

  if (!email || !password) {
    err.textContent = 'Email dan password wajib diisi.';
    err.classList.add('show');
    return;
  }

  var found = findAccount(email, password);
  if (!found) {
    err.textContent = 'Email atau password salah. Gunakan akun demo atau register dulu.';
    err.classList.add('show');
    return;
  }

  setUser(sessionFromAccount(found));
  location.href = 'dashboard.html';
});
</script>
</body>
</html>
