    <main class="login-main">
      <div class="login-card">
        <h1>Masuk ke akun</h1>
        <p class="login-sub">Gunakan email & password member Smart AI.</p>
        <div class="demo-hint" style="font-size:.8rem;color:var(--text-muted);margin-bottom:1rem;padding:.75rem;border-radius:10px;border:1px solid rgba(45,212,191,.2);background:rgba(45,212,191,.06)">
          Demo: <code>demo@smartai.com</code> / <code>demo123</code>
        </div>
        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="username" placeholder="nama@email.com"/>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Password"/>
              <button type="button" class="toggle-pass" id="toggle-pass" aria-label="Tampilkan password">
                <svg class="eye-open" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-closed" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>
          <div class="form-row" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;font-size:.85rem">
            <label style="display:flex;gap:.4rem;align-items:center;color:var(--text-muted)"><input type="checkbox" id="remember"/> Ingat saya</label>
            <a href="#" class="forgot-link" id="forgot-link">Lupa password?</a>
          </div>
          <div class="error-msg" id="error-msg"></div>
          <button type="submit" class="btn-submit" id="submit-btn">Masuk →</button>
        </form>
        <p style="margin-top:1.1rem;font-size:.85rem;color:var(--text-muted);text-align:center">Belum punya akun? <a href="daftar.html">Registrasi</a></p>
      </div>
    </main>
    <a href="https://wa.me/6282137585596" class="wa-float" target="_blank" rel="noopener">WHATSAPP</a>
