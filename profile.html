<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Profile — Smart AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
const user = renderShell('profile');
if (user) {
  document.getElementById('page-content').innerHTML = `
    <div class="panel" style="max-width:560px">
      <div class="panel-head"><h2>Profil member</h2></div>
      <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem">
        <div class="user-avatar" style="width:56px;height:56px;font-size:1.1rem">${initials(user.nama)}</div>
        <div>
          <div style="font-weight:700;font-size:1.1rem">${escapeHtml(user.nama)}</div>
          <div style="color:var(--text-muted);font-size:.85rem">${escapeHtml(user.email)}</div>
        </div>
      </div>
      <div class="form-group">
        <label>Nama lengkap</label>
        <input type="text" id="p-nama" value="${escapeHtml(user.nama)}"/>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="p-email" value="${escapeHtml(user.email)}" readonly style="opacity:.7"/>
      </div>
      <div class="form-group">
        <label>No. HP / WhatsApp</label>
        <input type="tel" id="p-hp" value="${escapeHtml(user.hp || '')}"/>
      </div>
      <div class="form-group">
        <label>Kode referral (saat daftar)</label>
        <input type="text" id="p-ref" value="${escapeHtml(user.referral || '')}" readonly style="opacity:.7"/>
      </div>
      <div class="msg success" id="saved"></div>
      <button type="button" class="btn-primary" id="save-btn" style="max-width:220px">Simpan perubahan</button>
    </div>`;
  document.getElementById('save-btn').addEventListener('click', function () {
    const next = {
      nama: document.getElementById('p-nama').value.trim() || user.nama,
      email: user.email,
      hp: document.getElementById('p-hp').value.trim(),
      referral: user.referral || ''
    };
    setUser(next);
    const msg = document.getElementById('saved');
    msg.textContent = 'Profil disimpan.';
    msg.classList.add('show');
    setTimeout(function () { location.reload(); }, 600);
  });
}
</script>
</body>
</html>
